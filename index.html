        const item = typeof getConsumable === "function" ? getConsumable(itemId) : null;
        const qty = typeof getConsumableQuantity === "function" ? getConsumableQuantity(player, itemId) : 0;
        document.getElementById("inventoryTitle").textContent = item ? item.itemName : label;
        content.innerHTML = `
          ${renderDetailCard(consumableIconHtml(itemId, "equipDetailIcon"), item ? item.itemName : itemId, `
            ${detailSection("", detailLine("Belt Slot", label))}
            ${renderConsumableDetailBody(itemId, qty)}
          `)}
          <div class="equipDetailActions">
            <button class="equipSlotRow" onclick="equipSlotItem('${slot}', '${itemId}')">
              <span class="equipSlotLabel">Equip</span>
              <span class="equipSlotValue">${label}</span>
            </button>
            ${detailBackButton(`renderChangeEquipSlot('${slot}')`)}
          </div>
        `;
        return;
      }

      const item = getEquipItem(itemId);
      const allowed = canEquip(itemId);
      document.getElementById("inventoryTitle").textContent = getEquipmentDetailTitle(itemId);
      content.innerHTML = `
        ${renderDetailCard(equipDetailIconHtml(itemId), getEquipmentDetailTitle(itemId), renderEquipmentDetailBody(itemId, label))}
        <div class="equipDetailActions">
          <button class="equipSlotRow ${!allowed ? "locked" : ""}" ${allowed ? `onclick="equipSlotItem('${slot}', '${itemId}')"` : ""}>
            <span class="equipSlotLabel">Equip</span>
            <span class="equipSlotValue">${allowed ? label : "Need Lv " + ((item && item.reqLevel) || 1)}</span>
          </button>
          ${detailBackButton(`renderChangeEquipSlot('${slot}')`)}
        </div>
      `;
    }


    function getShortRuneStatLine(entryOrRuneId, level = 0) {
      const runeId = typeof entryOrRuneId === "string"
        ? entryOrRuneId
        : (entryOrRuneId?.runeId || entryOrRuneId?.itemId || "");

      const lvl = Number(typeof entryOrRuneId === "object" ? (entryOrRuneId.level ?? level ?? 0) : (level ?? 0)) || 0;
      const step = lvl + 1;

      const shortLines = {
        fehu: `+${10 * step}% Gold`,
        uruz: `+${10 * step}% Attack`,
        thurisaz: `-${10 * step}% Enemy Def`,
        ansuz: `+${10 * step}% Magic`,
        raidho: `+${10 * step}% Speed`,
        kenaz: `+${10 * step}% Fire Attack`,
        gebo: `${5 * step}% Life Steal`,
        hagalaz: `+${10 * step}% Shock Attack`,
        isa: `${10 * step}% Slow Chance`,
        eihwaz: `+${10 * step}% Dark Attack`,
        algiz: `+${10 * step}% Defense`,
        sowilo: `+${10 * step}% Holy Attack`
      };

      return shortLines[runeId] || (typeof entryOrRuneId === "object" ? (entryOrRuneId.statLine || "Passive") : "Passive");
    }

    function cycleItemCategory(direction) {
      const currentIndex = ITEM_CATEGORIES.indexOf(activeItemCategory);
      const safeIndex = currentIndex >= 0 ? currentIndex : 0;
      const nextIndex = (safeIndex + direction + ITEM_CATEGORIES.length) % ITEM_CATEGORIES.length;
      activeItemCategory = ITEM_CATEGORIES[nextIndex];
      renderItemsTab();
    }

    function renderItemCategoryCycle() {
      return `
        <div class="itemCategoryCycle">
          <button class="statusCycleButton" onclick="cycleItemCategory(-1)">&lt;</button>
          <div class="itemCategoryLabel">${ITEM_CATEGORY_LABELS[activeItemCategory] || "Items"}</div>
          <button class="statusCycleButton" onclick="cycleItemCategory(1)">&gt;</button>
        </div>
      `;
    }

    function getEquippedEquipmentIds() {
      return Object.entries(player.equipment || {})
        .filter(([slot, itemId]) => itemId && !isBeltSlot(slot))
        .map(([, itemId]) => itemId);
    }

    function isEquipmentEquippedInOtherSlot(itemId, currentSlot = null) {
      return Object.entries(player.equipment || {}).some(([slot, equippedId]) => {
        if (slot === currentSlot || isBeltSlot(slot)) return false;
        return equippedId === itemId;
      });
    }

    function getAvailableEquipmentInventoryList(slot) {
      if (typeof getEquipmentBySlot !== "function") return [];
      const equippedIds = new Set(getEquippedEquipmentIds());

      return getEquipmentBySlot(slot)
        .filter(item => ownsEquipment(item.itemId))
        .filter(item => !equippedIds.has(item.itemId))
        .map(item => ({
          itemId: item.itemId,
          itemName: item.itemName,
          image: item.image,
          slot: item.slot,
          tier: item.tier,
          rarity: item.rarity,
          description: equipmentStatLine(item.itemId)
        }));
    }

    function normalizeVisibleRuneEntry(entry) {
      const available = typeof entry.available === "number"
        ? entry.available
        : (typeof getAvailableRuneQuantity === "function"
          ? getAvailableRuneQuantity(player, entry.runeId, entry.level || 0)
          : entry.quantity);

      return {
        ...entry,
        quantity: Math.max(0, Number(available) || 0),
        available: Math.max(0, Number(available) || 0)
      };
    }

    function getVisibleRuneInventoryList() {
      if (typeof getRuneInventoryList !== "function") return [];
      return getRuneInventoryList(player)
        .map(normalizeVisibleRuneEntry)
        .filter(entry => entry.quantity > 0);
    }

    function renderItemsTab() {
      const content = document.getElementById("inventoryContent");
      document.getElementById("inventoryTitle").textContent = "Items";
      document.getElementById("inventoryTabs").style.display = "grid";
      ensureFullInventoryShape();

      const category = ITEM_CATEGORIES.includes(activeItemCategory) ? activeItemCategory : "consumables";
      activeItemCategory = category;

      const lists = {
        consumables: typeof getConsumableInventoryList === "function" ? getConsumableInventoryList(player) : [],
        runes: getVisibleRuneInventoryList(),
        weapons: getAvailableEquipmentInventoryList("weapon"),
        armor: getAvailableEquipmentInventoryList("armor"),
        fragments: getFragmentInventoryList(),
        keyitems: typeof getKeyItemInventoryList === "function" ? getKeyItemInventoryList(player) : []
      };

      const list = lists[category] || [];
      const visible = sliceInventoryPage(category, list);

      let html = `
        <div class="menuHeader">
          <span>Gold: ${player.gold}</span>
          <span>${list.length} shown</span>
        </div>
        ${renderItemCategoryCycle()}
      `;

      if (category === "consumables") {
        html += `<div class="twoColList">`;
        if (!list.length) {
          html += `<div class="smallNote">No consumables.</div>`;
        } else {
          html += visible.map(item => `
            <button class="compactRow" onclick="renderInventoryConsumableDetail('${item.itemId}')" title="${item.description || ""}">
              ${compactIconWithQtyHtml(item.image, "items", item.quantity)}
              <div>
                <div class="compactName">${item.itemName}</div>
              </div>
            </button>
          `).join("");
        }
        html += `</div>`;
      }

      if (category === "runes") {
        html += `<div class="twoColList">`;
        if (!list.length) {
          html += `<div class="smallNote">No available runes.</div>`;
        } else {
          html += visible.map(entry => `
            <button class="compactRow" onclick="renderInventoryRuneDetail('${entry.runeId}', ${entry.level || 0})" title="${entry.statLine || ""}">
              ${compactIconWithQtyHtml(entry.image, "runes", entry.quantity)}
              <div>
                <div class="compactName">${entry.displayName}</div>
              </div>
            </button>
          `).join("");
        }
        html += `</div>`;
      }

      if (category === "weapons" || category === "armor") {
        html += `<div class="twoColList">`;
        if (!list.length) {
          html += `<div class="smallNote">No unequipped ${ITEM_CATEGORY_LABELS[category].toLowerCase()}.</div>`;
        } else {
          html += visible.map(item => `
            <button class="compactRow" onclick="renderInventoryEquipmentDetail('${item.itemId}')" title="${item.description || ""}">
              ${equipmentCompactIconWithQtyHtml(item.itemId)}
              <div>
                <div class="compactName">${item.itemName}</div>
              </div>
            </button>
          `).join("");
        }
        html += `</div>`;
      }

      if (category === "fragments") {
        html += `<div class="twoColList">`;
        if (!list.length) {
          html += `<div class="smallNote">No fragments.</div>`;
        } else {
          html += visible.map(fragment => `
            <button class="compactRow" onclick="renderBasicInventoryDetail('Fragment', '${fragment.itemId || fragment.fragmentId || fragment.itemName}')" title="${fragment.description}">
              <span class="compactIconWrap"><span class="compactIcon empty"></span><span class="compactQtyBadge">${fragment.quantity}</span></span>
              <div>
                <div class="compactName">${fragment.itemName}</div>
              </div>
            </button>
          `).join("");
        }
        html += `</div>`;
      }

      if (category === "keyitems") {
        html += `<div class="twoColList">`;
        if (!list.length) {
          html += `<div class="smallNote">No key items.</div>`;
        } else {
          html += visible.map(item => `
            <button class="compactRow" onclick="renderBasicInventoryDetail('Key Item', '${item.itemId}')" title="${item.description || ""}">
              ${compactIconWithQtyHtml(item.image, "items", 0)}
              <div>
                <div class="compactName">${item.itemName}</div>
              </div>
            </button>
          `).join("");
        }
        html += `</div>`;
      }

      html += renderPager(category, list.length);
      content.innerHTML = html;
    }

    function useInventoryConsumable(itemId) {
      if (typeof useConsumable !== "function") {
        setMessage("Item loader not found.");
        return;
      }

      const result = useConsumable(itemId, player, gameMode);

      if (result.escape && gameMode === "encounter") {
        runAway();
      }

      updateBars();
      updateCombatBeltSlots();
      if (gameMode !== "encounter") setMessage(result.message);

      if (document.getElementById("inventoryOverlay").classList.contains("show")) {
        renderInventoryConsumableDetail(itemId);
      }
    }

    // =========================
    // SOTN-STYLE EQUIPMENT UI
    // =========================


    function getEquipmentImageFolder(item) {
      if (!item) return "items";
      if (item.slot === "weapon") return "weapons";
      if (item.slot === "armor") return "armor";
      if (item.slot === "ring" || item.slot === "necklace") return "jewelry";
      if (item.slot === "cloak") return "cloaks";
      return "items";
    }

    function equipIconHtml(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return `<span class="equipIcon empty"></span>`;

      const iconPath = typeof getEquipmentIconPath === "function"
        ? getEquipmentIconPath(item)
        : (item.image ? `assets/${getEquipmentImageFolder(item)}/${item.image}` : "");

      if (!iconPath) return `<span class="equipIcon empty"></span>`;
      return `<img class="equipIcon" src="${iconPath}" alt="" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend','<span class=&quot;equipIcon empty&quot;></span>');">`;
    }


    function equipDetailIconHtml(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return `<span class="equipDetailIcon empty"></span>`;

      const iconPath = typeof getEquipmentIconPath === "function"
        ? getEquipmentIconPath(item)
        : (item.image ? `assets/${getEquipmentImageFolder(item)}/${item.image}` : "");

      if (!iconPath) return `<span class="equipDetailIcon empty"></span>`;
      return `<img class="equipDetailIcon" src="${iconPath}" alt="" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend','<span class=&quot;equipDetailIcon empty&quot;></span>');">`;
    }


    function isBeltSlot(slot) {
      return ["belt1", "belt2", "belt3", "belt4"].includes(slot);
    }

    function getBeltNumber(slot) {
      return Number(String(slot).replace("belt", "")) || 1;
    }

    function getConsumableName(itemId) {
      if (!itemId || typeof getConsumable !== "function") return "None";
      const item = getConsumable(itemId);
      return item ? item.itemName : itemId;
    }

    function getConsumableQuantityForSlot(slot) {
      const itemId = player.equipment[slot];
      if (!itemId || typeof getConsumableQuantity !== "function") return 0;
      return getConsumableQuantity(player, itemId);
    }

    function consumableIconHtml(itemId, className = "equipIcon") {
      if (!itemId || typeof getConsumable !== "function") return `<span class="${className} empty"></span>`;
      const item = getConsumable(itemId);
      if (!item || !item.image) return `<span class="${className} empty"></span>`;
      return `<img class="${className}" src="assets/items/${item.image}" alt="" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend','<span class=&quot;${className} empty&quot;></span>');">`;
    }

    function equipGridIconHtml(slot, itemId) {
      if (isBeltSlot(slot)) {
        if (!itemId || getConsumableQuantityForSlot(slot) <= 0) return `<span class="equipGridIcon empty"></span>`;
        const item = getConsumable(itemId);
        if (!item || !item.image) return `<span class="equipGridIcon empty"></span>`;
        return `<img class="equipGridIcon" src="assets/items/${item.image}" alt="">`;
      }

      const item = getEquipItem(itemId);
      if (!item) return `<span class="equipGridIcon empty"></span>`;
      const iconPath = typeof getEquipmentIconPath === "function"
        ? getEquipmentIconPath(item)
        : (item.image ? `assets/${getEquipmentImageFolder(item)}/${item.image}` : "");
      if (!iconPath) return `<span class="equipGridIcon empty"></span>`;
      return `<img class="equipGridIcon" src="${iconPath}" alt="">`;
    }

    function getSlotDisplayName(slot, itemId) {
      if (isBeltSlot(slot)) {
        const qty = getConsumableQuantityForSlot(slot);
        return itemId && qty > 0 ? getConsumableName(itemId) : "Empty";
      }
      return getEquipName(itemId);
    }

    function getEquipmentDetailMeta(item) {
      if (!item) return "No item equipped.";
      const parts = [];
      if (item.rarity) parts.push(item.rarity.toUpperCase());
      if (item.tier) parts.push(String(item.tier).toUpperCase());
      if (item.reqLevel) parts.push(`Req Lv ${item.reqLevel}`);
      if (item.maxSockets) parts.push(`${item.maxSockets} socket${item.maxSockets === 1 ? "" : "s"}`);
      return parts.join(" · ") || "Equipped item.";
    }

    function renderEquipOverview() {
      const content = document.getElementById("inventoryContent");
      document.getElementById("inventoryTitle").textContent = "Equipment";
      document.getElementById("inventoryTabs").style.display = "grid";

      const gridSlots = [
        ["weapon", "Weapon", player.equipment.weapon, "wideLeft"],
        ["armor", "Armor", player.equipment.armor, "wideRight"],
        ["ring1", "Ring 1", player.equipment.ring1, ""],
        ["ring2", "Ring 2", player.equipment.ring2, ""],
        ["ring3", "Ring 3", player.equipment.ring3, ""],
        ["ring4", "Ring 4", player.equipment.ring4, ""],
        ["belt1", "P1", player.equipment.belt1, ""],
        ["belt2", "P2", player.equipment.belt2, ""],
        ["belt3", "P3", player.equipment.belt3, ""],
        ["belt4", "P4", player.equipment.belt4, ""]
      ];

      let html = `
        <div class="menuHeader">
          <span>${player.name} · Lv ${player.level}</span>
          <span>Gold: ${player.gold}</span>
        </div>
        <div class="equipGrid">
      `;

      html += gridSlots.map(([slot, label, itemId, extraClass]) => `
        <button class="equipGridButton ${extraClass} ${slot}Slot" onclick="renderEquipSlot('${slot}')">
          <div class="equipGridLabel">${label}</div>
          ${equipGridIconHtml(slot, itemId)}
          <div class="equipGridName">${getSlotDisplayName(slot, itemId)}</div>
        </button>
      `).join("");

      html += `
        </div>
        <div class="smallNote">Atk ${getPlayerAttackValue()} · Def ${getPlayerDefenseValue()} · HP ${player.hp}/${player.maxHp} · MP ${player.mp}/${player.maxMp}</div>
      `;

      content.innerHTML = html;
    }

    function getSlotSource(slot) {
      if (["ring1", "ring2", "ring3", "ring4"].includes(slot)) return "ring";
      if (isBeltSlot(slot)) return "consumable";
      return slot;
    }

    function getSlotLabel(slot) {
      const labels = {
        weapon: "Weapon",
        armor: "Armor",
        necklace: "Necklace",
        ring1: "Ring 1",
        ring2: "Ring 2",
        ring3: "Ring 3",
        ring4: "Ring 4",
        belt1: "P1",
        belt2: "P2",
        belt3: "P3",
        belt4: "P4"
      };

      return labels[slot] || slot;
    }

    function getOwnedItemsForSlot(slot) {
      const sourceSlot = getSlotSource(slot);

      if (sourceSlot === "consumable") {
        return typeof getConsumableInventoryList === "function"
          ? getConsumableInventoryList(player).filter(item => item.quantity > 0)
          : [];
      }

      if (typeof getEquipmentBySlot !== "function") return [];

      return getEquipmentBySlot(sourceSlot)
        .filter(item => ownsEquipment(item.itemId))
        .filter(item => !isEquipmentEquippedInOtherSlot(item.itemId, slot));
    }

    function renderEquipSlot(slot) {
      const content = document.getElementById("inventoryContent");
      const label = getSlotLabel(slot);
      const equippedId = player.equipment[slot];

      document.getElementById("inventoryTitle").textContent = label;
      document.getElementById("inventoryTabs").style.display = "none";

      if (isBeltSlot(slot)) {
        const item = equippedId && typeof getConsumable === "function" ? getConsumable(equippedId) : null;
        const qty = getConsumableQuantityForSlot(slot);
        const desc = item ? (item.description || `${item.itemName} x${qty}`) : "No consumable assigned.";

        content.innerHTML = `
          <div class="equipDetailCard">
            ${consumableIconHtml(equippedId, "equipDetailIcon")}
            <div>
              <div class="equipDetailName">${item && qty > 0 ? item.itemName : "Empty"}</div>
              <div class="equipDetailLine">Belt Slot ${getBeltNumber(slot)}</div>
              <div class="equipDetailLine">${desc}${item ? ` · Qty ${qty}` : ""}</div>
            </div>
          </div>
          <div class="equipDetailActions">
            <button class="equipSlotRow" onclick="renderChangeEquipSlot('${slot}')">
              <span class="equipSlotLabel">Change</span>
              <span class="equipSlotValue">${label}</span>
            </button>
            <button class="equipSlotRow" onclick="renderEquipOverview()">
              <span class="equipSlotLabel">Close</span>
              <span class="equipSlotValue">Equipment</span>
            </button>
          </div>
        `;
        return;
      }

      const item = getEquipItem(equippedId);

      let html = `
        <div class="equipDetailCard">
          ${equipDetailIconHtml(equippedId)}
          <div>
            <div class="equipDetailName">${getEquipName(equippedId)}</div>
            <div class="equipDetailLine">${getEquipmentDetailMeta(item)}</div>
            <div class="equipDetailLine">${equippedId ? equipmentStatLine(equippedId) : "No stats"}</div>
          </div>
        </div>

        <div class="equipDetailActions">
          <button class="equipSlotRow" onclick="renderChangeEquipSlot('${slot}')">
            <span class="equipSlotLabel">Change</span>
            <span class="equipSlotValue">${label}</span>
          </button>
      `;

      if ((slot === "weapon" || slot === "armor") && equippedId) {
        html += `
          <button class="equipSlotRow" onclick="renderRuneSlots('${slot}')">
            <span class="equipSlotLabel">Runes</span>
            <span class="equipSlotValue">${getSocketSummary(equippedId).replace("Runes ", "")}</span>
          </button>
        `;
      }

      html += `
          <button class="equipSlotRow" onclick="renderEquipOverview()">
            <span class="equipSlotLabel">Close</span>
            <span class="equipSlotValue">Equipment</span>
          </button>
        </div>
      `;

      content.innerHTML = html;
    }

    function renderChangeEquipSlot(slot) {
      const content = document.getElementById("inventoryContent");
      const label = getSlotLabel(slot);
      const equippedId = player.equipment[slot];

      document.getElementById("inventoryTitle").textContent = `Change ${label}`;
      document.getElementById("inventoryTabs").style.display = "none";

      const items = getOwnedItemsForSlot(slot);
      const rowData = [{ none: true }].concat(items);
      const page = getSlotPage(slot, rowData.length);
      const startIndex = page * EQUIPMENT_PAGE_SIZE;
      const visibleRows = rowData.slice(startIndex, startIndex + EQUIPMENT_PAGE_SIZE);

      let html = `
        <button class="equipSlotRow" onclick="renderEquipSlot('${slot}')">
          <span class="equipSlotLabel">Back</span>
          <span class="equipSlotValue">${label}</span>
        </button>

        <div class="equipCompactList" style="margin-top:6px;">
      `;

      html += visibleRows.map(item => {
        if (item.none) {
          return `
            <button class="equipSlotRow equipItemRow" onclick="renderEquipCandidateDetail('${slot}', null)">
              <span class="compactIconWrap"><span class="equipIcon empty"></span></span>
              <span class="equipSlotLabel">None</span>
            </button>
          `;
        }

        if (isBeltSlot(slot)) {
          const itemId = item.itemId;
          const equipped = equippedId === itemId;
          return `
            <button class="equipSlotRow ${equipped ? "equipped" : ""} equipItemRow" onclick="renderEquipCandidateDetail('${slot}', '${itemId}')">
              ${compactIconWithQtyHtml(item.image || "", "items", item.quantity)}
              <span class="equipSlotLabel">${item.itemName}${equipped ? " *" : ""}</span>
            </button>
          `;
        }

        const itemId = item.itemId;
        const equipped = equippedId === itemId;
        const allowed = canEquip(itemId);
        const rowClass = `equipSlotRow ${equipped ? "equipped" : ""} ${!allowed ? "locked" : ""}`;
        return `
          <button class="${rowClass} equipItemRow" onclick="renderEquipCandidateDetail('${slot}', '${itemId}')">
            ${equipmentCompactIconWithQtyHtml(itemId)}
            <span class="equipSlotLabel">${getEquipName(itemId)}${equipped ? " *" : ""}</span>
          </button>
        `;
      }).join("");

      html += `</div>${renderEquipmentPager(slot, rowData.length)}`;
      content.innerHTML = html;
    }

    function renderRuneSlots(slot) {
      const content = document.getElementById("inventoryContent");
      const itemId = player.equipment[slot];

      document.getElementById("inventoryTitle").textContent = `${getSlotLabel(slot)} Runes`;
      document.getElementById("inventoryTabs").style.display = "none";

      if (!itemId) {
        content.innerHTML = `
          <button class="equipSlotRow" onclick="renderEquipSlot('${slot}')">
            <span class="equipSlotLabel">Back</span>
            <span class="equipSlotValue">${getSlotLabel(slot)}</span>
          </button>
          <div class="smallNote">No item equipped.</div>
        `;
        return;
      }

      const item = getEquipItem(itemId);
      const record = getOrCreateEquipmentRecord(itemId);
      normalizeEquipmentSockets(itemId);

      let html = `
        <button class="equipSlotRow" onclick="renderEquipSlot('${slot}')">
          <span class="equipSlotLabel">Back</span>
          <span class="equipSlotValue">${getSlotLabel(slot)}</span>
        </button>

        <div class="smallNote">${getEquipName(itemId)}</div>
        <div class="equipCompactList">
      `;

      if (!item || !item.maxSockets) {
        html += `<div class="smallNote">This item has no rune sockets.</div>`;
      } else {
        for (let i = 0; i < record.socketsUnlocked; i++) {
          const socket = record.sockets[i];
          const runeText = socket && socket.runeId
            ? getRuneDisplayName(socket.runeId, socket.level || 0)
            : "Empty";

          html += `
            <button class="equipSlotRow" onclick="renderRuneSelect('${slot}', ${i})">
              <span class="equipSlotLabel">Rune ${i + 1}</span>
              <span class="equipSlotValue">${runeText}</span>
            </button>
          `;
        }

        if (record.socketsUnlocked < item.maxSockets) {
          html += `<div class="smallNote">Locked sockets: ${item.maxSockets - record.socketsUnlocked}. Shrine merchant unlocks these later.</div>`;
        }
      }

      html += `</div>`;
      content.innerHTML = html;
    }

    function renderSocketRows(slot, itemId) {
      if (!itemId) {
        return `<div class="smallNote">No item equipped. Equip an item before socketing runes.</div>`;
      }

      const item = getEquipItem(itemId);
      const record = getOrCreateEquipmentRecord(itemId);

      if (!item || !item.maxSockets) {
        return `<div class="smallNote">This item has no rune sockets.</div>`;
      }

      normalizeEquipmentSockets(itemId);

      let html = `<div class="smallNote">Rune Sockets</div>`;

      for (let i = 0; i < record.socketsUnlocked; i++) {
        const socket = record.sockets[i];
        const runeText = socket && socket.runeId
          ? `${getRuneDisplayName(socket.runeId, socket.level || 0)} · ${getShortRuneStatLine(socket.runeId, socket.level || 0)}`
          : "Empty";

        html += `
          <button class="sotnRow" onclick="renderRuneSelect('${slot}', ${i})">
            <span class="sotnSlot">Rune ${i + 1}</span>
            <span class="sotnValue">
              <span style="display:inline-grid;grid-template-columns:30px 1fr;gap:6px;align-items:center;">
                ${socketRuneIconHtml(socket).replace('class="menuIcon"', 'class="menuIcon" style="width:28px;height:28px;"')}
                <span>${runeText}</span>
              </span>
            </span>
          </button>
        `;
      }

      if (record.socketsUnlocked < item.maxSockets) {
        html += `<div class="smallNote">Locked sockets: ${item.maxSockets - record.socketsUnlocked}. Shrine merchant will unlock these later.</div>`;
      }

      return html;
    }

    function renderRuneSelect(slot, socketIndex) {
      const itemId = player.equipment[slot];
      const record = getOrCreateEquipmentRecord(itemId);
      const currentSocket = record.sockets[socketIndex] || null;

      document.getElementById("inventoryTitle").textContent = `Rune ${socketIndex + 1}`;
      document.getElementById("inventoryTabs").style.display = "none";

      const content = document.getElementById("inventoryContent");

      const exclude = { itemId, socketIndex };
      const runes = typeof getRuneInventoryList === "function" ? getRuneInventoryList(player, exclude) : [];

      let html = `
        <div class="menuHeader">
          <span>${getEquipName(itemId)}</span>
          <span>${currentSocket ? getRuneDisplayName(currentSocket.runeId, currentSocket.level || 0) : "Empty"}</span>
        </div>

        <button class="sotnRow" onclick="renderEquipSlot('${slot}')">
          <span class="sotnSlot">Back</span>
          <span class="sotnValue">Return to ${getSlotLabel(slot)}</span>
        </button>

        <button class="sotnRow" onclick="socketRune('${slot}', ${socketIndex}, null, 0)">
          <span class="sotnSlot">None</span>
          <span class="sotnValue">Remove rune</span>
        </button>
      `;

      if (!runes.length) {
        html += `<div class="smallNote">No runes owned.</div>`;
        content.innerHTML = html;
        return;
      }

      html += runes.map(entry => {
        const current = currentSocket &&
          currentSocket.runeId === entry.runeId &&
          (currentSocket.level || 0) === entry.level;

        const available = entry.available > 0 || current;

        return `
          <button class="compactRow ${current ? "equipped" : ""} ${!available ? "locked" : ""}" ${available ? `onclick="socketRune('${slot}', ${socketIndex}, '${entry.runeId}', ${entry.level})"` : ""}>
            ${compactIconWithQtyHtml(entry.image, "runes", entry.available)}
            <div>
              <div class="compactName">${entry.displayName}${current ? " [Socketed]" : ""}</div>
            </div>
          </button>
        `;
      }).join("");

      content.innerHTML = html;
    }

    function socketRune(slot, socketIndex, runeId, level = 0) {
      const itemId = player.equipment[slot];
      const record = getOrCreateEquipmentRecord(itemId);

      if (!record || !Array.isArray(record.sockets)) {
        setMessage("No socket available.");
        renderEquipSlot(slot);
        return;
      }

      if (runeId === null) {
        record.sockets[socketIndex] = null;
        recalcDerivedStats();
        updateBars();
        setMessage("Rune removed.");
        renderEquipSlot(slot);
        return;
      }

      const exclude = { itemId, socketIndex };
      const available = getAvailableRuneQuantity(player, runeId, level, exclude);

      if (available <= 0) {
        setMessage("No free copy of that rune.");
        renderRuneSelect(slot, socketIndex);
        return;
      }

      record.sockets[socketIndex] = { runeId, level };
      recalcDerivedStats();
      updateBars();
      setMessage(`Socketed ${getRuneDisplayName(runeId, level)}.`);
      renderEquipSlot(slot);
    }

    function equipSlotItem(slot, itemId) {
      if (isBeltSlot(slot)) {
        player.equipment[slot] = itemId || null;
        updateCombatBeltSlots();
        setMessage(itemId ? `${getSlotLabel(slot)} set to ${getConsumableName(itemId)}.` : `${getSlotLabel(slot)} cleared.`);
        renderEquipSlot(slot);
        return;
      }

      if (!itemId) {
        player.equipment[slot] = null;
        recalcDerivedStats();
        updateBars();
        setMessage(`${getSlotLabel(slot)} removed.`);
        renderEquipSlot(slot);
        return;
      }

      if (!canEquip(itemId)) {
        setMessage("Requirements not met.");
        renderEquipSlot(slot);
        return;
      }

      player.equipment[slot] = itemId;

      if (slot === "weapon" || slot === "armor") {
        normalizeEquipmentSockets(itemId);
      }

      recalcDerivedStats();
      updateBars();
      setMessage(`Equipped ${getEquipName(itemId)}.`);
      renderEquipSlot(slot);
    }


    function renderCombatBeltButton(slot) {
      const btn = document.querySelector(`.beltButton[onclick="useBeltSlot('${slot}')"]`);
      if (!btn) return;

      const itemId = player.equipment[slot];
      const qty = getConsumableQuantityForSlot(slot);
      const hasUsableItem = !!itemId && qty > 0;

      btn.classList.toggle("empty", !hasUsableItem);
      btn.setAttribute("aria-label", hasUsableItem ? getConsumableName(itemId) : `${getSlotLabel(slot)} empty`);
      btn.title = hasUsableItem ? `${getConsumableName(itemId)} x${qty}` : `${getSlotLabel(slot)} empty`;

      if (!hasUsableItem) {
        btn.innerHTML = "";
        return;
      }

      const item = typeof getConsumable === "function" ? getConsumable(itemId) : null;
      const icon = item && item.image
        ? `<img class="beltItemIcon" src="assets/items/${item.image}" alt="">`
        : "";

      btn.innerHTML = `${icon}<span class="beltQtyBadge">${qty}</span>`;
    }

    function updateCombatBeltSlots() {
      ["belt1", "belt2", "belt3", "belt4"].forEach(renderCombatBeltButton);
    }

    function useBeltSlot(slot) {
      const itemId = player.equipment[slot];
      if (!itemId || getConsumableQuantityForSlot(slot) <= 0) {
        updateCombatBeltSlots();
        return;
      }

      if (typeof useConsumable !== "function") {
        setMessage("Item loader not found.");
        return;
      }

      const result = useConsumable(itemId, player, gameMode);

      if (result.escape && gameMode === "encounter") {
        runAway();
      }

      updateBars();
      updateCombatBeltSlots();
      if (gameMode !== "encounter") setMessage(result.message);
    }

    // =========================
    // INIT
    // =========================

    ensureFullInventoryShape();
    const loadedLocalSave = loadGameState();
    ensureFullInventoryShape();

    Object.keys(player.inventory.equipment).forEach(itemId => {
      const item = getEquipItem(itemId);
      const record = player.inventory.equipment[itemId];

      if (!item || !record) return;

      if (record.socketsUnlocked === undefined) {
        record.socketsUnlocked = Math.min(item.maxSockets || 0, item.maxSockets > 0 ? 1 : 0);
      }

      normalizeEquipmentSockets(itemId);
    });

    recalcDerivedStats();
    updateCombatBeltSlots();
    saveReady = true;

    if (loadedLocalSave) {
      startNewFloor();
      setMessage(`Save loaded. New floor layout started on floor ${currentFloor}.`);
    } else {
      startNewFloor();
    }
  </script>
</body>
</html>
