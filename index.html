      const poses = Array.isArray(assets.poses) && assets.poses.length ? assets.poses.slice() : [];
      const folder = assets.folder || "";
      const base = assets.base || "";
      if (!folder || !base || !poses.length) return "";
      const cacheKey = `${armorItem.itemId || armorItem.itemName || "armor"}:${poses.join(",")}`;
      if (!armorPoseSelection[cacheKey] || !poses.includes(armorPoseSelection[cacheKey])) {
        armorPoseSelection[cacheKey] = poses[Math.floor(Math.random() * poses.length)];
      }
      const pose = armorPoseSelection[cacheKey];
      return `${folder}/${base}${pose}.png`;
    }

    function getCharacterStatusImage() {
      const equippedArmor = getEquipItem(player.equipment.armor);
      const randomArmorImage = getRandomArmorStatusImagePath(equippedArmor);
      if (randomArmorImage) return randomArmorImage;
      if (equippedArmor && typeof getEquipmentStatusImagePath === "function") {
        const armorStatusImage = getEquipmentStatusImagePath(equippedArmor);
        if (armorStatusImage) return armorStatusImage;
      }
      const id = (player.character || "maya").toLowerCase();
      return `assets/characters/${id}_status.png`;
    }

    function statusTabButton(page, label) {
      return `<button class="uiButton" onclick="setStatusPage('${page}')">${label}</button>`;
    }

    function equipmentSlots() {
      return [
        ["weapon", "Weapon", player.equipment.weapon],
        ["armor", "Armor", player.equipment.armor],
        ["ring1", "Ring 1", player.equipment.ring1],
        ["ring2", "Ring 2", player.equipment.ring2],
        ["ring3", "Ring 3", player.equipment.ring3],
        ["ring4", "Ring 4", player.equipment.ring4],
        ["belt1", "P1", player.equipment.belt1],
        ["belt2", "P2", player.equipment.belt2],
        ["belt3", "P3", player.equipment.belt3],
        ["belt4", "P4", player.equipment.belt4]
      ];
    }

    function getSlotPage(slot, totalItems) {
      const maxPage = Math.max(0, Math.ceil(totalItems / EQUIPMENT_PAGE_SIZE) - 1);
      equipmentPage[slot] = Math.max(0, Math.min(equipmentPage[slot] || 0, maxPage));
      return equipmentPage[slot];
    }

    function setEquipmentPage(slot, direction) {
      equipmentPage[slot] = (equipmentPage[slot] || 0) + direction;
      renderEquipSlot(slot);
    }

    function renderEquipmentPager(slot, totalItems) {
      const maxPage = Math.max(0, Math.ceil(totalItems / EQUIPMENT_PAGE_SIZE) - 1);
      const current = getSlotPage(slot, totalItems);

      if (maxPage <= 0) return "";

      return `
        <div class="pageControls">
          <button class="uiButton" onclick="setEquipmentPage('${slot}', -1)" ${current <= 0 ? "disabled" : ""}>Prev</button>
          <div class="pageText">${current + 1} / ${maxPage + 1}</div>
          <button class="uiButton" onclick="setEquipmentPage('${slot}', 1)" ${current >= maxPage ? "disabled" : ""}>Next</button>
        </div>
      `;
    }

    function getPrimaryItemValue(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return "";
      const stats = getEquipStats(itemId);

      if (item.slot === "weapon") {
        const parts = [];
        if (stats.atk) parts.push(`Atk ${stats.atk}`);
        if (stats.mag) parts.push(`Mag ${stats.mag}`);
        if (item.maxSockets) parts.push(`${item.maxSockets}S`);
        return parts.join(" · ");
      }

      if (item.slot === "armor") {
        const parts = [];
        if (stats.pdef) parts.push(`PDEF ${stats.pdef}%`);
        const resLine = getResistanceSummaryLine(stats);
        if (resLine) parts.push(resLine);
        if (item.maxSockets) parts.push(`${item.maxSockets}S`);
        return parts.join(" · ");
      }

      const parts = [];
      if (stats.atk) parts.push(`Atk ${stats.atk}`);
      if (stats.pdef) parts.push(`PDEF ${stats.pdef}%`);
      if (stats.mag) parts.push(`Mag ${stats.mag}`);
      const resLine = getResistanceSummaryLine(stats);
      if (resLine) parts.push(resLine);
      if (stats.hp) parts.push(`HP ${stats.hp}`);
      if (stats.mp) parts.push(`MP ${stats.mp}`);
      if (stats.speed) parts.push(`Spd ${stats.speed}`);
      return parts.slice(0, 2).join(" · ");
    }

    function renderStatusRows(rows) {
      return rows.map(([name, value]) => `
        <div class="statusStat">
          <span class="statusLabel">${name}</span>
          <span class="statusValue">${value}</span>
        </div>
      `).join("");
    }

    function getStatusRows() {
      const bonuses = getEquipmentBonusTotals();
      const runeBonuses = getRuneBonusTotals();

      if (statusPage === "combat") {
        return [
          ["HP", `${player.hp} / ${player.maxHp}`],
          ["MP", `${player.mp} / ${player.maxMp}`],
          ["ATK", getPlayerAttackValue()],
          ["PDEF", `${Math.round(getPlayerPdefValue())}%`],
          ["MAG", `${bonuses.mag} / ${runeBonuses.magicPct}%`],
          ["SPD", `${bonuses.speed} / ${runeBonuses.speedPct}%`],
          ["PIERCE", `${runeBonuses.piercePct}%`],
          ["LIFE", `${runeBonuses.lifeStealPct}%`],
          ["HARD", getPlayerHardinessValue()]
        ];
      }

      if (statusPage === "damage") {
        return [
          ["FIRE", `${runeBonuses.fireWeaponPct}%`],
          ["SHOCK", `${runeBonuses.shockWeaponPct}%`],
          ["ICE", "0%"],
          ["DARK", "0%"],
          ["HOLY", `${runeBonuses.lightBonusPct}%`],
          ["TIME", `${runeBonuses.slowChancePct}%`],
          ["GOLD", `${getTotalGoldFindPct()}%`]
        ];
      }

      if (statusPage === "resist") {
        return [
          ["FIRE", `${bonuses.fireRes || 0}%`],
          ["SHOCK", `${bonuses.shockRes || 0}%`],
          ["ICE", `${bonuses.iceRes || 0}%`],
          ["DARK", `${bonuses.darkRes || 0}%`],
          ["AVG", `${Math.round(getAveragePlayerResistanceValue())}%`],
          ["DODGE", `${getPlayerDodgeValue()}%`]
        ];
      }

      if (statusPage === "leaderboard") {
        const stats = ensureLeaderboardStats();
        return [
          ["FLOORS", stats.totalFloors],
          ["ROOMS", stats.totalRooms],
          ["GOLD", stats.totalGold],
          ["XP", stats.totalXp],
          ["POTS", stats.potionsUsed],
          ["DEATHS", stats.deaths],
          ["KILLS", stats.kills],
          ["LEVEL", player.level]
        ];
      }

      return [
        ["STR", player.str],
        ["DEX", player.dex],
        ["MAG", player.magic],
        ["VIT", player.vitality],
        ["SPD", player.speed],
        ["EXP", `${player.exp || 0}/${getExpNeededForLevel(player.level)}`],
        ["GOLD", player.gold]
      ];
    }

    function renderStatusTab() {
      const content = document.getElementById("inventoryContent");
      const rows = getStatusRows();
      const statusImage = getCharacterStatusImage();

      content.innerHTML = `
        <div class="statusCard" style="--status-pose: url('${statusImage}');" aria-label="${player.name} armor preview">
          <div class="statusInfoBox">
            <div class="statusName">${player.name}</div>
            <div class="statusLevel">Level ${player.level} · EXP ${player.exp || 0}/${getExpNeededForLevel(player.level)}</div>
            <div class="statusStatGrid">
              ${renderStatusRows(rows)}
            </div>
            ${renderStatusCycle()}
          </div>
        </div>
      `;
    }

    function compactIconHtml(image, folder) {
      if (!image) return `<span class="compactIcon empty"></span>`;
      return `<img class="compactIcon" src="assets/${folder}/${image}" alt="">`;
    }


    function compactIconWithQtyHtml(image, folder, quantity = 0) {
      const qty = Math.max(0, Number(quantity) || 0);
      return `
        <span class="compactIconWrap">
          ${compactIconHtml(image, folder)}
          ${qty > 1 ? `<span class="compactQtyBadge">${qty}</span>` : ""}
        </span>
      `;
    }

    function equipmentCompactIconWithQtyHtml(itemId, quantity = 0) {
      const qty = Math.max(0, Number(quantity) || 0);
      return `
        <span class="compactIconWrap">
          ${equipIconHtml(itemId).replace(/class="equipIcon/g, 'class="compactIcon')}
          ${qty > 1 ? `<span class="compactQtyBadge">${qty}</span>` : ""}
        </span>
      `;
    }

    function detailBackButton(backAction) {
      return `
        <button class="equipSlotRow" onclick="${backAction}">
          <span class="equipSlotLabel">Back</span>
          <span class="equipSlotValue">List</span>
        </button>
      `;
    }

    function renderDetailCard(iconHtml, name, linesHtml) {
      return `
        <div class="equipDetailCard">
          ${iconHtml}
          <div>
            <div class="equipDetailName">${name}</div>
            ${linesHtml}
          </div>
        </div>
      `;
    }

    function detailLine(label, value) {
      return `
        <div class="detailLine">
          <span class="detailLabel">${label}</span>
          <span class="detailValue">${value}</span>
        </div>
      `;
    }

    function detailSection(title, bodyHtml) {
      return `
        <div class="detailSection">
          ${title ? `<div class="detailBlockTitle">${title}</div>` : ""}
          ${bodyHtml}
        </div>
      `;
    }

    function titleCaseText(value) {
      return String(value || "")
        .replace(/[_-]+/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function getEquipmentDetailTitle(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return getEquipName(itemId);

      const reqLevel = item.reqLevel || 1;
      const upgradeLevel = getEquipmentLevel(itemId);
      const upgradeText = upgradeLevel > 0 ? ` +${upgradeLevel}` : "";
      return `${item.itemName}${upgradeText} Lv${reqLevel}`;
    }

    function getEquipmentBaseStat(item, key) {
      if (!item) return 0;
      if (key === "pdef") return Number(item.pdef ?? item.def ?? item.stats?.pdef ?? item.stats?.def ?? 0) || 0;
      return Number(item[key] ?? item.stats?.[key] ?? 0) || 0;
    }

    function getEquipmentTotalStat(itemId, key) {
      const stats = getEquipStats(itemId);
      return Number(stats[key] || 0) || 0;
    }

    function equipmentBreakdownLine(label, item, itemId, key, suffix = "") {
      const base = getEquipmentBaseStat(item, key);
      const total = getEquipmentTotalStat(itemId, key);
      if (!base && !total) return "";

      const bonus = total - base;
      const bonusText = bonus >= 0 ? `+ ${bonus}` : `- ${Math.abs(bonus)}`;
      return detailLine(label, `${base}${suffix} ${bonusText}${suffix} = ${total}${suffix}`);
    }

    function renderEquipmentStatBreakdown(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return detailLine("Stats", "No stats");

      const stats = getEquipStats(itemId);
      const resistanceRows = [];

      const resValues = {
        "Fire Res": stats.fireRes || 0,
        "Ice Res": stats.iceRes || 0,
        "Shock Res": stats.shockRes || 0,
        "Dark Res": stats.darkRes || 0
      };

      const activeRes = Object.entries(resValues).filter(([, value]) => value !== 0);
      const uniqueRes = [...new Set(activeRes.map(([, value]) => value))];

      if (activeRes.length === 4 && uniqueRes.length === 1) {
        resistanceRows.push(equipmentBreakdownLine("All Res", item, itemId, "fireRes", "%"));
      } else {
        activeRes.forEach(([label, value]) => {
          const keyMap = {
            "Fire Res": "fireRes",
            "Ice Res": "iceRes",
            "Shock Res": "shockRes",
            "Dark Res": "darkRes"
          };
          resistanceRows.push(equipmentBreakdownLine(label, item, itemId, keyMap[label], "%"));
        });
      }

      const rows = [
        equipmentBreakdownLine("Atk", item, itemId, "atk"),
        equipmentBreakdownLine("Mag", item, itemId, "mag"),
        equipmentBreakdownLine("PDEF", item, itemId, "pdef", "%"),
        ...resistanceRows,
        equipmentBreakdownLine("HP", item, itemId, "hp"),
        equipmentBreakdownLine("MP", item, itemId, "mp"),
        equipmentBreakdownLine("Speed", item, itemId, "speed"),
        equipmentBreakdownLine("Crit", item, itemId, "crit", "%"),
        equipmentBreakdownLine("Dodge", item, itemId, "dodge", "%"),
        equipmentBreakdownLine("Gold Find", item, itemId, "goldFind", "%")
      ].filter(Boolean).join("");

      return rows || detailLine("Stats", "No stats");
    }

    function renderEquipmentSocketDetail(itemId) {
      const item = getEquipItem(itemId);
      const record = getOwnedEquipmentRecord(itemId);

      if (!item || !item.maxSockets) {
        return detailSection("Sockets", detailLine("Sockets", "None"));
      }

      if (record) normalizeEquipmentSockets(itemId);

      const current = record ? (record.socketsUnlocked || 0) : 0;
      const max = item.maxSockets || 0;

      return detailSection("Sockets", detailLine("Current / Max", `${current} / ${max}`));
    }

    function renderEquipmentRunesDetail(itemId) {
      const item = getEquipItem(itemId);
      const record = getOwnedEquipmentRecord(itemId);

      if (!item || !item.maxSockets) {
        return detailSection("Runes", `<div class="smallNote">No rune sockets.</div>`);
      }

      if (record) normalizeEquipmentSockets(itemId);

      const current = record ? (record.socketsUnlocked || 0) : 0;
      const max = item.maxSockets || 0;
      const rows = [];

      for (let i = 0; i < max; i++) {
        const socket = record && i < current ? record.sockets[i] : null;
        let text = "Locked";

        if (i < current) {
          text = socket && socket.runeId
            ? `${getRuneDisplayName(socket.runeId, socket.level || 0)} — ${getShortRuneStatLine(socket.runeId, socket.level || 0).replace("Attack", "Atk").replace("Defense", "PDEF").replace("Magic", "Mag").replace("Speed", "Spd")}`
            : "Empty";
        }

        rows.push(`
          <div class="detailRuneRow">
            <span class="detailLabel">${i + 1}</span>
            <span class="detailValue">${text}</span>
          </div>
        `);
      }

      return detailSection("Runes", `<div class="detailRuneList">${rows.join("")}</div>`);
    }

    function getEquipmentDescriptionText(item) {
      if (!item) return "No description available.";
      const direct = item.description || item.desc || item.flavorText || item.flavor;
      if (direct) return direct;

      const rarity = titleCaseText(item.rarity || "common");
      const tier = titleCaseText(item.tier || "");
      const slot = titleCaseText(item.slot || "equipment");
      const owner = item.character && item.character !== "all" ? ` for ${titleCaseText(item.character)}` : "";
      const tierText = tier ? `${tier} ` : "";
      return `${rarity} ${tierText}${slot}${owner}.`;
    }

    function renderEquipmentDescriptionDetail(item) {
      return detailSection("Description", `
        <div class="detailTextBlock">${getEquipmentDescriptionText(item)}</div>
      `);
    }

    function renderEquipmentDetailBody(itemId, slotLabel = "") {
      const item = getEquipItem(itemId);
      if (!item) return detailLine("Item", itemId);

      return `
        ${detailSection("", `
          ${slotLabel ? detailLine("Slot", slotLabel) : detailLine("Type", titleCaseText(item.slot || "equipment"))}
          ${detailLine("Rarity", titleCaseText(item.rarity || "common"))}
          ${detailLine("Req", `Lv${item.reqLevel || 1}`)}
          ${detailLine("Value", `${item.value || 0}g`)}
        `)}
        ${detailSection("Stats", renderEquipmentStatBreakdown(itemId))}
        ${renderEquipmentSocketDetail(itemId)}
        ${renderEquipmentRunesDetail(itemId)}
        ${renderEquipmentDescriptionDetail(item)}
      `;
    }

    function renderConsumableDetailBody(itemId, qty) {
      const item = getConsumableSafe(itemId);
      return `
        ${detailSection("", `
          ${detailLine("Type", "Consumable")}
          ${detailLine("Quantity", qty)}
          ${detailLine("Value", `${item ? (item.value || 0) : 0}g`)}
        `)}
        ${detailSection("Description", `
          <div class="detailTextBlock">${item ? (item.description || "Consumable item.") : "Consumable item."}</div>
        `)}
      `;
    }

    function renderRuneDetailBody(runeId, level, qty) {
      return `
        ${detailSection("", `
          ${detailLine("Type", "Rune")}
          ${detailLine("Quantity", qty)}
          ${detailLine("Level", Number(level || 0) + 1)}
        `)}
        ${detailSection("Effect", detailLine("Bonus", getShortRuneStatLine(runeId, level)))}
        ${detailSection("Description", `
          <div class="detailTextBlock">Socket this rune from the Rune page of an equipped weapon or armor.</div>
        `)}
      `;
    }


    function firstAvailableBeltSlot() {
      const slots = ["belt1", "belt2", "belt3", "belt4"];
      return slots.find(slot => !player.equipment[slot]) || slots[0];
    }

    function moveItemToBelt(itemId) {
      const slot = firstAvailableBeltSlot();
      player.equipment[slot] = itemId;
      updateCombatBeltSlots();
      saveGameState();
      setMessage(`${getConsumableName(itemId)} assigned to ${getSlotLabel(slot)}.`);
      renderInventoryConsumableDetail(itemId);
    }

    function findBestEquipSlotForItem(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return "weapon";
      if (item.slot === "ring") {
        return ["ring1", "ring2", "ring3", "ring4"].find(slot => !player.equipment[slot]) || "ring1";
      }
      return item.slot || "weapon";
    }

    function equipItemFromInventory(itemId) {
      const slot = findBestEquipSlotForItem(itemId);
      equipSlotItem(slot, itemId);
    }

    function renderInventoryConsumableDetail(itemId) {
      const content = document.getElementById("inventoryContent");
      const item = getConsumableSafe(itemId);
      const qty = typeof getConsumableQuantity === "function"
        ? getConsumableQuantity(player, itemId)
        : Number(player.inventory?.consumables?.[itemId] || 0);

      if (!item) { renderItemsTab(); return; }

      document.getElementById("inventoryTitle").textContent = item.itemName;
      document.getElementById("inventoryTabs").style.display = "none";
      content.innerHTML = `
        ${renderDetailCard(consumableIconHtml(itemId, "equipDetailIcon"), item.itemName, renderConsumableDetailBody(itemId, qty))}
        <div class="equipDetailActions">
          <button class="equipSlotRow" onclick="useInventoryConsumable('${itemId}')">
            <span class="equipSlotLabel">Use</span>
            <span class="equipSlotValue">Now</span>
          </button>
          <button class="equipSlotRow" onclick="moveItemToBelt('${itemId}')">
            <span class="equipSlotLabel">Move</span>
            <span class="equipSlotValue">Belt</span>
          </button>
          ${detailBackButton("renderItemsTab()")}
        </div>
      `;
    }

    function renderInventoryRuneDetail(runeId, level = 0) {
      const content = document.getElementById("inventoryContent");
      const rune = typeof getRuneById === "function" ? getRuneById(runeId) : null;
      const displayName = typeof getRuneDisplayName === "function" ? getRuneDisplayName(runeId, level) : runeId;
      const entry = getVisibleRuneInventoryList().find(r => r.runeId === runeId && Number(r.level || 0) === Number(level || 0));
      const qty = entry ? entry.quantity : 0;
      const image = entry && entry.image ? entry.image : "rune1.png";

      document.getElementById("inventoryTitle").textContent = displayName;
      document.getElementById("inventoryTabs").style.display = "none";
      content.innerHTML = `
        ${renderDetailCard(`<img class="equipDetailIcon" src="assets/runes/${image}" alt="">`, displayName, renderRuneDetailBody(runeId, level, qty))}
        <div class="equipDetailActions">
          ${detailBackButton("renderItemsTab()")}
        </div>
      `;
    }

    function renderInventoryEquipmentDetail(itemId) {
      const content = document.getElementById("inventoryContent");
      const item = getEquipItem(itemId);
      if (!item) { renderItemsTab(); return; }
      const allowed = canEquip(itemId);

      document.getElementById("inventoryTitle").textContent = getEquipmentDetailTitle(itemId);
      document.getElementById("inventoryTabs").style.display = "none";
      content.innerHTML = `
        ${renderDetailCard(equipDetailIconHtml(itemId), getEquipmentDetailTitle(itemId), renderEquipmentDetailBody(itemId))}
        <div class="equipDetailActions">
          <button class="equipSlotRow ${!allowed ? "locked" : ""}" ${allowed ? `onclick="equipItemFromInventory('${itemId}')"` : ""}>
            <span class="equipSlotLabel">Equip</span>
            <span class="equipSlotValue">${allowed ? "Ready" : "Need Lv " + (item.reqLevel || 1)}</span>
          </button>
          ${detailBackButton("renderItemsTab()")}

    function renderBasicInventoryDetail(kind, itemId) {
      const content = document.getElementById("inventoryContent");
      document.getElementById("inventoryTitle").textContent = itemId;
      document.getElementById("inventoryTabs").style.display = "none";
      content.innerHTML = `
        <div class="smallNote">${kind}: ${itemId}</div>
        <div class="equipDetailActions">${detailBackButton("renderItemsTab()")}</div>
      `;
    }

    function renderEquipCandidateDetail(slot, itemId) {
      const content = document.getElementById("inventoryContent");
      const label = getSlotLabel(slot);

      if (!itemId) {
        equipSlotItem(slot, null);
        return;
      }

      if (isBeltSlot(slot)) {
        const item = getConsumableSafe(itemId);
        const qty = typeof getConsumableQuantity === "function"
          ? getConsumableQuantity(player, itemId)
          : Number(player.inventory?.consumables?.[itemId] || 0);

        document.getElementById("inventoryTitle").textContent = item ? item.itemName : label;
        content.innerHTML = `
          ${renderDetailCard(consumableIconHtml(itemId, "equipDetailIcon"), item ? item.itemName : itemId, `
            ${detailSection("", detailLine("Belt Slot", label))}
            ${renderConsumableDetailBody(itemId, qty)}
          `)}
          <div class="equipDetailActions">
            <button class="equipSlotRow" onclick="equipSlotItem('${slot}', '${itemId}')">
              <span class="equipSlotLabel">Equip</span>
              <span class="equipSlotValue">${label}</span>
            </button>
            ${detailBackButton(`renderChangeEquipSlot('${slot}')`)}
          </div>
        `;
        return;
      }

      const item = getEquipItem(itemId);
      const allowed = canEquip(itemId);
      document.getElementById("inventoryTitle").textContent = getEquipmentDetailTitle(itemId);
      content.innerHTML = `
        ${renderDetailCard(equipDetailIconHtml(itemId), getEquipmentDetailTitle(itemId), renderEquipmentDetailBody(itemId, label))}
        <div class="equipDetailActions">
          <button class="equipSlotRow ${!allowed ? "locked" : ""}" ${allowed ? `onclick="equipSlotItem('${slot}', '${itemId}')"` : ""}>
            <span class="equipSlotLabel">Equip</span>
            <span class="equipSlotValue">${allowed ? label : "Need Lv " + ((item && item.reqLevel) || 1)}</span>
          </button>
          ${detailBackButton(`renderChangeEquipSlot('${slot}')`)}
        </div>
      `;
    }


    function getShortRuneStatLine(entryOrRuneId, level = 0) {
      const runeId = typeof entryOrRuneId === "string"
        ? entryOrRuneId
        : (entryOrRuneId?.runeId || entryOrRuneId?.itemId || "");

      const lvl = Number(typeof entryOrRuneId === "object" ? (entryOrRuneId.level ?? level ?? 0) : (level ?? 0)) || 0;

      if (typeof getRuneById === "function" && typeof getRuneValue === "function") {
        const rune = getRuneById(runeId);
        if (rune) {
          const value = getRuneValue(runeId, lvl);
          const v = Number.isInteger(value) ? value : Number(value.toFixed(1));

          switch (rune.effectType) {
            case "gold_find_pct": return `+${v}% Gold`;
            case "attack_pct": return `+${v}% Atk`;
            case "pierce_pct": return `-${v}% Enemy Def`;
            case "magic_pct": return `+${v}% Mag`;
            case "speed_pct": return `+${v}% Spd`;
            case "fire_weapon_pct": return `+${v}% Fire Atk`;
            case "life_steal_pct": return `${v}% Life Steal`;
            case "shock_weapon_pct": return `+${v}% Shock Atk`;
            case "slow_chance_pct": return `${v}% Slow`;
            case "light_bonus_pct": return `+${v}% Light Dmg`;
            case "defense_pct": return `+${v}% PDEF`;
            case "undead_bonus_pct": return `+${v}% Undead Dmg`;
            default: return rune.shortLabel || rune.description || "Passive";
          }
        }
      }

      const step = lvl + 1;
      const shortLines = {
        fehu: `+${10 * step}% Gold`,
        uruz: `+${10 * step}% Atk`,
        thurisaz: `-${10 * step}% Enemy PDEF`,
        ansuz: `+${10 * step}% Mag`,
        raidho: `+${10 * step}% Spd`,
        kenaz: `+${10 * step}% Fire Atk`,
        gebo: `${5 * step}% Life Steal`,
        hagalaz: `+${10 * step}% Shock Atk`,
        isa: `${10 * step}% Slow`,
        eihwaz: `+${10 * step}% Light Dmg`,
        algiz: `+${10 * step}% PDEF`,
        sowilo: `+${10 * step}% Undead Dmg`
      };

      return shortLines[runeId] || (typeof entryOrRuneId === "object" ? (entryOrRuneId.statLine || "Passive") : "Passive");
    }

    function cycleItemCategory(direction) {
      const currentIndex = ITEM_CATEGORIES.indexOf(activeItemCategory);
      const safeIndex = currentIndex >= 0 ? currentIndex : 0;
      const nextIndex = (safeIndex + direction + ITEM_CATEGORIES.length) % ITEM_CATEGORIES.length;
      activeItemCategory = ITEM_CATEGORIES[nextIndex];
      renderItemsTab();
    }

    function renderItemCategoryCycle() {
      return `
        <div class="itemCategoryCycle">
          <button class="statusCycleButton" onclick="cycleItemCategory(-1)">&lt;</button>
          <div class="itemCategoryLabel">${ITEM_CATEGORY_LABELS[activeItemCategory] || "Items"}</div>
          <button class="statusCycleButton" onclick="cycleItemCategory(1)">&gt;</button>
        </div>
      `;
    }

    function getEquippedEquipmentIds() {
      return Object.entries(player.equipment || {})
        .filter(([slot, itemId]) => itemId && !isBeltSlot(slot))
        .map(([, itemId]) => itemId);
    }

    function isEquipmentEquippedInOtherSlot(itemId, currentSlot = null) {
      return Object.entries(player.equipment || {}).some(([slot, equippedId]) => {
        if (slot === currentSlot || isBeltSlot(slot)) return false;
        return equippedId === itemId;
      });
    }

    function getAvailableEquipmentInventoryList(slot) {
      if (typeof getEquipmentBySlot !== "function") return [];
      const equippedIds = new Set(getEquippedEquipmentIds());

      return getEquipmentBySlot(slot)
        .filter(item => ownsEquipment(item.itemId))
        .filter(item => !equippedIds.has(item.itemId))
        .map(item => ({
          itemId: item.itemId,
          itemName: item.itemName,
          image: item.image,
          slot: item.slot,
          tier: item.tier,
          rarity: item.rarity,
          description: equipmentStatLine(item.itemId)
        }));
    }

    function normalizeVisibleRuneEntry(entry) {
      const available = typeof entry.available === "number"
        ? entry.available
        : (typeof getAvailableRuneQuantity === "function"
          ? getAvailableRuneQuantity(player, entry.runeId, entry.level || 0)
          : entry.quantity);

      return {
        ...entry,
        quantity: Math.max(0, Number(available) || 0),
        available: Math.max(0, Number(available) || 0)
      };
    }

    function getVisibleRuneInventoryList() {
      if (typeof getRuneInventoryList !== "function") return [];
      return getRuneInventoryList(player)
        .map(normalizeVisibleRuneEntry)
        .filter(entry => entry.quantity > 0);
    }

    function renderItemsTab() {
      const content = document.getElementById("inventoryContent");
      document.getElementById("inventoryTitle").textContent = "Items";
      document.getElementById("inventoryTabs").style.display = "grid";
      ensureFullInventoryShape();

      const category = ITEM_CATEGORIES.includes(activeItemCategory) ? activeItemCategory : "consumables";
      activeItemCategory = category;

      const lists = {
        consumables: typeof getConsumableInventoryList === "function" ? getConsumableInventoryList(player) : [],
        runes: getVisibleRuneInventoryList(),
        weapons: getAvailableEquipmentInventoryList("weapon"),
        armor: getAvailableEquipmentInventoryList("armor"),
        skills: getSkillList(),
        fragments: getFragmentInventoryList(),
        keyitems: typeof getKeyItemInventoryList === "function" ? getKeyItemInventoryList(player) : []
      };

      const list = lists[category] || [];
      const visible = sliceInventoryPage(category, list);

      let html = `
        <div class="menuHeader">
          <span>Gold: ${player.gold}</span>
          <span>${list.length} shown</span>
        </div>
        ${renderItemCategoryCycle()}
      `;

      if (category === "consumables") {
        html += `<div class="twoColList">`;
        if (!list.length) {
          html += `<div class="smallNote">No consumables.</div>`;
        } else {
          html += visible.map(item => `
            <button class="compactRow" onclick="renderInventoryConsumableDetail('${item.itemId}')" title="${item.description || ""}">
              ${compactIconWithQtyHtml(item.image, "items", item.quantity)}
              <div>
                <div class="compactName">${item.itemName}</div>
              </div>
            </button>
          `).join("");
        }
        html += `</div>`;
      }

      if (category === "runes") {
        html += `<div class="oneColList">`;
        if (!list.length) {
          html += `<div class="smallNote">No available runes.</div>`;
        } else {
          html += visible.map(entry => `
            <button class="compactRow runeListRow" onclick="renderInventoryRuneDetail('${entry.runeId}', ${entry.level || 0})" title="${entry.statLine || ""}">
              ${compactIconWithQtyHtml(entry.image, "runes", entry.quantity)}
              <div>
                <div class="compactName">${entry.displayName}</div>
                <span class="compactSub">${getShortRuneStatLine(entry)}</span>
              </div>
            </button>
          `).join("");
        }
        html += `</div>`;
      }

      if (category === "weapons" || category === "armor") {
        html += `<div class="twoColList">`;
        if (!list.length) {
          html += `<div class="smallNote">No unequipped ${ITEM_CATEGORY_LABELS[category].toLowerCase()}.</div>`;
        } else {
          html += visible.map(item => `
            <button class="compactRow" onclick="renderInventoryEquipmentDetail('${item.itemId}')" title="${item.description || ""}">
              ${equipmentCompactIconWithQtyHtml(item.itemId)}
              <div>
                <div class="compactName">${item.itemName}</div>
              </div>
            </button>
          `).join("");
        }
        html += `</div>`;
      }


      if (category === "skills") {
        html += `<div class="oneColList">`;
        if (!list.length) {
          html += `<div class="smallNote">No skills unlocked.</div>`;
        } else {
          html += visible.map(skill => `
            <button class="compactRow" onclick="renderSkillDetail('${skill.skillId}')" title="${skill.name}">
              <span class="compactIconWrap"><span class="compactIcon empty"></span></span>
              <div>
                <div class="compactName">${skill.name}</div>
                <span class="compactSub">${skill.type === "self" ? skill.description : `${skill.type === "self" ? `${skill.mpCost} MP · Self` : `${skill.mpCost} MP · ${skill.baseMultiplier.toFixed(2)}x`} base · ${skill.ultimateMultiplier.toFixed(2)}x ultimate`}</span>
              </div>
            </button>
          `).join("");
        }
        html += `</div>`;
      }

      if (category === "fragments") {
        html += `<div class="twoColList">`;
        if (!list.length) {
          html += `<div class="smallNote">No fragments.</div>`;
        } else {
          html += visible.map(fragment => `
            <button class="compactRow" onclick="renderBasicInventoryDetail('Fragment', '${fragment.itemId || fragment.fragmentId || fragment.itemName}')" title="${fragment.description}">
              <span class="compactIconWrap"><span class="compactIcon empty"></span><span class="compactQtyBadge">${fragment.quantity}</span></span>
              <div>
                <div class="compactName">${fragment.itemName}</div>
              </div>
            </button>
          `).join("");
        }
        html += `</div>`;
      }

      if (category === "keyitems") {
        html += `<div class="twoColList">`;
        if (!list.length) {
          html += `<div class="smallNote">No key items.</div>`;
        } else {
          html += visible.map(item => `
            <button class="compactRow" onclick="renderBasicInventoryDetail('Key Item', '${item.itemId}')" title="${item.description || ""}">
              ${compactIconWithQtyHtml(item.image, "items", 0)}
              <div>
                <div class="compactName">${item.itemName}</div>
              </div>
            </button>
          `).join("");
        }
        html += `</div>`;
      }

      html += renderPager(category, list.length);
      content.innerHTML = html;
    }

    function useInventoryConsumable(itemId) {
      const special = useConsumableSafe(itemId);
      if (special.handled) {
        updateBars();
        updateCombatBeltSlots();
        if (document.getElementById("inventoryOverlay").classList.contains("show") && gameMode !== "roaming") {
          renderInventoryConsumableDetail(itemId);
        }
        return;
      }

      if (typeof useConsumable !== "function") {
        setMessage("Item loader not found.");
        return;
      }

      const result = useConsumable(itemId, player, gameMode);

      if (result.escape && gameMode === "encounter") {
        runAway();
      }

      updateBars();
      updateCombatBeltSlots();
      if (gameMode !== "encounter") setMessage(result.message);

      if (document.getElementById("inventoryOverlay").classList.contains("show")) {
        renderInventoryConsumableDetail(itemId);
      }
    }

    // =========================
    // SOTN-STYLE EQUIPMENT UI
    // =========================


    function getEquipmentImageFolder(item) {
      if (!item) return "items";
      if (item.slot === "weapon") return "weapons";
      if (item.slot === "armor") return "armor";
      if (item.slot === "ring" || item.slot === "necklace") return "jewelry";
      if (item.slot === "cloak") return "cloaks";
      return "items";
    }

    function equipIconHtml(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return `<span class="equipIcon empty"></span>`;

      const iconPath = typeof getEquipmentIconPath === "function"
        ? getEquipmentIconPath(item)
        : (item.image ? `assets/${getEquipmentImageFolder(item)}/${item.image}` : "");

      if (!iconPath) return `<span class="equipIcon empty"></span>`;
      return `<img class="equipIcon" src="${iconPath}" alt="" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend','<span class=&quot;equipIcon empty&quot;></span>');">`;
    }


    function equipDetailIconHtml(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return `<span class="equipDetailIcon empty"></span>`;

      const iconPath = typeof getEquipmentIconPath === "function"
        ? getEquipmentIconPath(item)
        : (item.image ? `assets/${getEquipmentImageFolder(item)}/${item.image}` : "");

      if (!iconPath) return `<span class="equipDetailIcon empty"></span>`;
      return `<img class="equipDetailIcon" src="${iconPath}" alt="" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend','<span class=&quot;equipDetailIcon empty&quot;></span>');">`;
    }


    function isBeltSlot(slot) {
      return ["belt1", "belt2", "belt3", "belt4"].includes(slot);
    }

    function getBeltNumber(slot) {
      return Number(String(slot).replace("belt", "")) || 1;
    }

    function getConsumableName(itemId) {
      const item = getConsumableSafe(itemId);
      return item ? item.itemName : String(itemId || "Item");
    }

    function getConsumableQuantityForSlot(slot) {
      const itemId = player.equipment[slot];
      if (!itemId) return 0;
      if (typeof getConsumableQuantity === "function") return getConsumableQuantity(player, itemId);
      return Number(player.inventory?.consumables?.[itemId] || 0);
    }

    function consumableIconHtml(itemId, className = "equipIcon") {
      if (!itemId) return `<span class="${className} empty"></span>`;
      const item = getConsumableSafe(itemId);
      if (!item || !item.image) return `<span class="${className} empty"></span>`;
      return `<img class="${className}" src="assets/items/${item.image}" alt="" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend','<span class=&quot;${className} empty&quot;></span>');">`;
    }

    function equipGridIconHtml(slot, itemId) {
      if (isBeltSlot(slot)) {
        if (!itemId || getConsumableQuantityForSlot(slot) <= 0) return `<span class="equipGridIcon empty"></span>`;
        const item = getConsumableSafe(itemId);
        if (!item || !item.image) return `<span class="equipGridIcon empty"></span>`;
        return `<img class="equipGridIcon" src="assets/items/${item.image}" alt="">`;
      }

      const item = getEquipItem(itemId);
      if (!item) return `<span class="equipGridIcon empty"></span>`;
      const iconPath = typeof getEquipmentIconPath === "function"
        ? getEquipmentIconPath(item)
        : (item.image ? `assets/${getEquipmentImageFolder(item)}/${item.image}` : "");
      if (!iconPath) return `<span class="equipGridIcon empty"></span>`;
      return `<img class="equipGridIcon" src="${iconPath}" alt="">`;
    }

    function getSlotDisplayName(slot, itemId) {
      if (isBeltSlot(slot)) {
        const qty = getConsumableQuantityForSlot(slot);
        return itemId && qty > 0 ? getConsumableName(itemId) : "Empty";
      }
      return getEquipName(itemId);
    }

    function getEquipmentDetailMeta(item) {
      if (!item) return "No item equipped.";
      const parts = [];
      if (item.rarity) parts.push(item.rarity.toUpperCase());
      if (item.tier) parts.push(String(item.tier).toUpperCase());
      if (item.reqLevel) parts.push(`Req Lv ${item.reqLevel}`);
      if (item.maxSockets) parts.push(`${item.maxSockets} socket${item.maxSockets === 1 ? "" : "s"}`);
      return parts.join(" · ") || "Equipped item.";
    }


    function isSkillSlot(slot) {
      return ["ultimate", "base1", "base2"].includes(slot);
    }

    function getSkillSlotLabel(slot) {
      const labels = {
        ultimate: "Ultimate",
        base1: "Skill 1",
        base2: "Skill 2"
      };
      return labels[slot] || slot;
    }

    function getSkillList() {
      return getOwnedSkillList();
    }

    function renderSkillEffectLines(skillId) {
      const skill = getSkillData(skillId);
      if (!skill) return detailLine("Skill", skillId);

      const lines = [];
      lines.push(detailLine("Req", `Level ${getSkillLevelReq(skillId)}`));
      lines.push(detailLine("Cost", `${Number(skill.mpCost || 0)} MP`));
      if (skill.description) lines.push(detailLine("Info", skill.description));

      if (skill.type === "self") {
        const baseText = skill.effect === "heal"
          ? `Restore ${Number(skill.power || 0)} HP`
          : skill.effect === "haste"
            ? `+${Number(skill.power || 0)}% speed for a short time`
            : skill.effect === "iron_skin"
              ? `+${Number(skill.power || 0)}% physical defense for a short time`
              : skill.effect === "mana_regen"
                ? `Restore ${Number(skill.power || 0)} MP per tick for a short time`
                : skill.effect === "weapon_enchant"
                  ? `Add ${Number(skill.power || 0)}% ${skill.element || "elemental"} weapon damage`
                  : "Self effect";
        const ultText = skill.effect === "heal"
          ? `Restore ${Number(skill.ultimatePower ?? skill.power ?? 0)} HP`
          : skill.effect === "weapon_enchant"
            ? `Add ${Number(skill.ultimatePower ?? skill.power ?? 0)}% ${skill.element || "elemental"} weapon damage`
            : `${Number(skill.ultimatePower ?? skill.power ?? 0)} power variant`;
        return `${detailSection("Skill", lines.join(""))}${detailSection("Base Skill", detailLine("Effect", baseText))}${detailSection("Ultimate Variant", detailLine("Effect", ultText))}`;
      }

      const hits = Number(skill.hits || 1);
      const ultimateHits = Number(skill.ultimateHits || Math.max(hits, 1));
      const element = skill.element ? `${skill.element.toUpperCase()} · ` : "";
      const baseParts = [`${element}${hits} hit${hits === 1 ? "" : "s"}`, `${Number(skill.baseMultiplier || 1).toFixed(2)}x damage`, `${Number(skill.mpCost || 0)} MP`];
      if (Number(skill.piercePct || 0) > 0) baseParts.push(`${Number(skill.piercePct)}% pierce`);
      if (Number(skill.lifeStealPct || 0) > 0) baseParts.push(`${Number(skill.lifeStealPct)}% life steal`);
      const ultParts = [`${element}${ultimateHits} hit${ultimateHits === 1 ? "" : "s"}`, `${Number(skill.ultimateMultiplier || 1).toFixed(2)}x damage`, `full charge`];
      if (Number(skill.ultimatePiercePct ?? skill.piercePct ?? 0) > 0) ultParts.push(`${Number(skill.ultimatePiercePct ?? skill.piercePct)}% pierce`);
      if (Number(skill.ultimateLifeStealPct ?? skill.lifeStealPct ?? 0) > 0) ultParts.push(`${Number(skill.ultimateLifeStealPct ?? skill.lifeStealPct)}% life steal`);
      return `${detailSection("Skill", lines.join(""))}${detailSection("Base Skill", detailLine("Effect", baseParts.join(" · ")))}${detailSection("Ultimate Variant", detailLine("Effect", ultParts.join(" · ")))}`;
    }

    function skillDetailIconHtml() {
      return `<span class="equipDetailIcon empty"></span>`;
    }

    function getSkillSlotDisplayName(slot) {
      ensurePlayerSkills();
      return getSkillNameForSlot(slot);
    }

    function equipSkillToSlot(slot, skillId) {
      ensurePlayerSkills();
      if (!isSkillSlot(slot) || !SKILL_DATA[skillId]) return;
      if (!ownsSkill(skillId)) { setMessage("You have not learned that skill."); return; }
      if (!canUseSkillLevel(skillId)) { setMessage(`${getSkillData(skillId).name} requires Level ${getSkillLevelReq(skillId)}.`); return; }
      player.skills[slot] = skillId;
      saveGameState();
      updateCombatMetersUI();
      renderEquipOverview();
      setMessage(`${getSkillData(skillId).name} equipped to ${getSkillSlotLabel(slot)}.`);
    }

        ${renderDetailCard(skillDetailIconHtml(), skill.name, `

        </div>

              <span class="equipSlotLabel">${skill.name}${equippedId === skill.skillId ? " *" : ""}</span>
              <span class="equipSlotValue">${skill.type === "self" ? `${skill.mpCost} MP · Self` : `${skill.mpCost} MP · ${skill.baseMultiplier.toFixed(2)}x`}</span>

    function renderSkillCandidateDetail(slot, skillId) {
      const skill = getSkillData(skillId);

      const label = getSkillSlotLabel(slot);

        ${renderDetailCard(skillDetailIconHtml(), skill.name, `
          ${detailSection("", detailLine("Slot", label))}

    function getSlotSource(slot) {
      if (["ring1", "ring2", "ring3", "ring4"].includes(slot)) return "ring";
      if (isBeltSlot(slot)) return "consumable";
      return slot;
    }

    function getSlotLabel(slot) {
      const labels = {
        weapon: "Weapon",
        armor: "Armor",
        necklace: "Necklace",
        ring1: "Ring 1",
        ring2: "Ring 2",
        ring3: "Ring 3",
        ring4: "Ring 4",
        belt1: "P1",
        belt2: "P2",
        belt3: "P3",
        belt4: "P4",
        ultimate: "Ultimate",
        base1: "Skill 1",
        base2: "Skill 2"
      };

      return labels[slot] || slot;
    }

    function getOwnedItemsForSlot(slot) {
      const sourceSlot = getSlotSource(slot);

      if (sourceSlot === "consumable") {
        return typeof getConsumableInventoryList === "function"
          ? getConsumableInventoryList(player).filter(item => item.quantity > 0)
          : [];
      }

      if (typeof getEquipmentBySlot !== "function") return [];

      return getEquipmentBySlot(sourceSlot)
        .filter(item => ownsEquipment(item.itemId))
        .filter(item => !isEquipmentEquippedInOtherSlot(item.itemId, slot));
    }

    function renderEquipSlot(slot) {
      if (isSkillSlot(slot)) {
        renderSkillSlot(slot);
        return;
      }

      const content = document.getElementById("inventoryContent");
      const label = getSlotLabel(slot);
      const equippedId = player.equipment[slot];

      document.getElementById("inventoryTitle").textContent = label;
      document.getElementById("inventoryTabs").style.display = "none";

      if (isBeltSlot(slot)) {
        const item = equippedId ? getConsumableSafe(equippedId) : null;
        const qty = getConsumableQuantityForSlot(slot);
        const desc = item ? (item.description || `${item.itemName} x${qty}`) : "No consumable assigned.";

        content.innerHTML = `
          <div class="equipDetailCard">
            ${consumableIconHtml(equippedId, "equipDetailIcon")}
            <div>
              <div class="equipDetailName">${item && qty > 0 ? item.itemName : "Empty"}</div>
              <div class="equipDetailLine">Belt Slot ${getBeltNumber(slot)}</div>
              <div class="equipDetailLine">${desc}${item ? ` · Qty ${qty}` : ""}</div>
            </div>
          </div>
          <div class="equipDetailActions">
            <button class="equipSlotRow" onclick="renderChangeEquipSlot('${slot}')">
              <span class="equipSlotLabel">Change</span>
              <span class="equipSlotValue">${label}</span>
            </button>
            <button class="equipSlotRow" onclick="renderEquipOverview()">
              <span class="equipSlotLabel">Close</span>
              <span class="equipSlotValue">Equipment</span>
            </button>
          </div>
        `;
        return;
      }

      const item = getEquipItem(equippedId);

      let html = `
        <div class="equipDetailCard">
          ${equipDetailIconHtml(equippedId)}
          <div>
            <div class="equipDetailName">${getEquipName(equippedId)}</div>
            <div class="equipDetailLine">${getEquipmentDetailMeta(item)}</div>
            <div class="equipDetailLine">${equippedId ? equipmentStatLine(equippedId) : "No stats"}</div>
          </div>
        </div>

        <div class="equipDetailActions">
          <button class="equipSlotRow" onclick="renderChangeEquipSlot('${slot}')">
            <span class="equipSlotLabel">Change</span>
            <span class="equipSlotValue">${label}</span>
          </button>
      `;

      if ((slot === "weapon" || slot === "armor") && equippedId) {
        html += `
          <button class="equipSlotRow" onclick="renderRuneSlots('${slot}')">
            <span class="equipSlotLabel">Runes</span>
            <span class="equipSlotValue">${getSocketSummary(equippedId).replace("Runes ", "")}</span>
          </button>
        `;
      }

      html += `
          <button class="equipSlotRow" onclick="renderEquipOverview()">
            <span class="equipSlotLabel">Close</span>
            <span class="equipSlotValue">Equipment</span>
          </button>
        </div>
      `;

      content.innerHTML = html;
    }

    function renderChangeEquipSlot(slot) {
      const content = document.getElementById("inventoryContent");
      const label = getSlotLabel(slot);
      const equippedId = player.equipment[slot];

      document.getElementById("inventoryTitle").textContent = `Change ${label}`;
      document.getElementById("inventoryTabs").style.display = "none";

      const items = getOwnedItemsForSlot(slot);
      const rowData = [{ none: true }].concat(items);
      const page = getSlotPage(slot, rowData.length);
      const startIndex = page * EQUIPMENT_PAGE_SIZE;
      const visibleRows = rowData.slice(startIndex, startIndex + EQUIPMENT_PAGE_SIZE);

      let html = `
        <button class="equipSlotRow" onclick="renderEquipSlot('${slot}')">
          <span class="equipSlotLabel">Back</span>
          <span class="equipSlotValue">${label}</span>
        </button>

        <div class="equipCompactList" style="margin-top:6px;">
      `;

      html += visibleRows.map(item => {
        if (item.none) {
          return `
            <button class="equipSlotRow equipItemRow" onclick="renderEquipCandidateDetail('${slot}', null)">
              <span class="compactIconWrap"><span class="equipIcon empty"></span></span>
              <span class="equipSlotLabel">None</span>
            </button>
          `;
        }

        if (isBeltSlot(slot)) {
          const itemId = item.itemId;
          const equipped = equippedId === itemId;
          return `
            <button class="equipSlotRow ${equipped ? "equipped" : ""} equipItemRow" onclick="renderEquipCandidateDetail('${slot}', '${itemId}')">
              ${compactIconWithQtyHtml(item.image || "", "items", item.quantity)}
              <span class="equipSlotLabel">${item.itemName}${equipped ? " *" : ""}</span>
            </button>
          `;
        }

        const itemId = item.itemId;
        const equipped = equippedId === itemId;
        const allowed = canEquip(itemId);
        const rowClass = `equipSlotRow ${equipped ? "equipped" : ""} ${!allowed ? "locked" : ""}`;
        return `
          <button class="${rowClass} equipItemRow" onclick="renderEquipCandidateDetail('${slot}', '${itemId}')">
            ${equipmentCompactIconWithQtyHtml(itemId)}
            <span class="equipSlotLabel">${getEquipName(itemId)}${equipped ? " *" : ""}</span>
          </button>
        `;
      }).join("");

      html += `</div>${renderEquipmentPager(slot, rowData.length)}`;
      content.innerHTML = html;
    }

    function renderRuneSlots(slot) {
      const content = document.getElementById("inventoryContent");
      const itemId = player.equipment[slot];

      document.getElementById("inventoryTitle").textContent = `${getSlotLabel(slot)} Runes`;
      document.getElementById("inventoryTabs").style.display = "none";

      if (!itemId) {
        content.innerHTML = `
          <button class="equipSlotRow" onclick="renderEquipSlot('${slot}')">
            <span class="equipSlotLabel">Back</span>
            <span class="equipSlotValue">${getSlotLabel(slot)}</span>
          </button>
          <div class="smallNote">No item equipped.</div>
        `;
        return;
      }

      const item = getEquipItem(itemId);
      const record = getOrCreateEquipmentRecord(itemId);
      normalizeEquipmentSockets(itemId);

      let html = `
        <button class="equipSlotRow" onclick="renderEquipSlot('${slot}')">
          <span class="equipSlotLabel">Back</span>
          <span class="equipSlotValue">${getSlotLabel(slot)}</span>
        </button>

        <div class="smallNote">${getEquipName(itemId)}</div>
        <div class="equipCompactList">
      `;

      if (!item || !item.maxSockets) {
        html += `<div class="smallNote">This item has no rune sockets.</div>`;
      } else {
        for (let i = 0; i < record.socketsUnlocked; i++) {
          const socket = record.sockets[i];
          const runeText = socket && socket.runeId
            ? getRuneDisplayName(socket.runeId, socket.level || 0)
            : "Empty";

          html += `
            <button class="equipSlotRow" onclick="renderRuneSelect('${slot}', ${i})">
              <span class="equipSlotLabel">Rune ${i + 1}</span>
              <span class="equipSlotValue">${runeText}</span>
            </button>
          `;
        }

        if (record.socketsUnlocked < item.maxSockets) {
          html += `<div class="smallNote">Locked sockets: ${item.maxSockets - record.socketsUnlocked}. Shrine merchant unlocks these later.</div>`;
        }
      }

      html += `</div>`;
      content.innerHTML = html;
    }

    function renderSocketRows(slot, itemId) {
      if (!itemId) {
        return `<div class="smallNote">No item equipped. Equip an item before socketing runes.</div>`;
      }

      const item = getEquipItem(itemId);
      const record = getOrCreateEquipmentRecord(itemId);

      if (!item || !item.maxSockets) {
        return `<div class="smallNote">This item has no rune sockets.</div>`;
      }

      normalizeEquipmentSockets(itemId);

      let html = `<div class="smallNote">Rune Sockets</div>`;

      for (let i = 0; i < record.socketsUnlocked; i++) {
        const socket = record.sockets[i];
        const runeText = socket && socket.runeId
          ? `${getRuneDisplayName(socket.runeId, socket.level || 0)} · ${getShortRuneStatLine(socket.runeId, socket.level || 0)}`
          : "Empty";

        html += `
          <button class="sotnRow" onclick="renderRuneSelect('${slot}', ${i})">
            <span class="sotnSlot">Rune ${i + 1}</span>
            <span class="sotnValue">
              <span style="display:inline-grid;grid-template-columns:30px 1fr;gap:6px;align-items:center;">
                ${socketRuneIconHtml(socket).replace('class="menuIcon"', 'class="menuIcon" style="width:28px;height:28px;"')}
                <span>${runeText}</span>
              </span>
            </span>
          </button>
        `;
      }

      if (record.socketsUnlocked < item.maxSockets) {
        html += `<div class="smallNote">Locked sockets: ${item.maxSockets - record.socketsUnlocked}. Shrine merchant will unlock these later.</div>`;
      }

      return html;
    }

    function renderRuneSelect(slot, socketIndex) {
      const itemId = player.equipment[slot];
      const record = getOrCreateEquipmentRecord(itemId);
      const currentSocket = record.sockets[socketIndex] || null;

      document.getElementById("inventoryTitle").textContent = `Rune ${socketIndex + 1}`;
      document.getElementById("inventoryTabs").style.display = "none";

      const content = document.getElementById("inventoryContent");

      const exclude = { itemId, socketIndex };
      const runes = typeof getRuneInventoryList === "function" ? getRuneInventoryList(player, exclude) : [];

      let html = `
        <div class="menuHeader">
          <span>${getEquipName(itemId)}</span>
          <span>${currentSocket ? getRuneDisplayName(currentSocket.runeId, currentSocket.level || 0) : "Empty"}</span>
        </div>

        <button class="sotnRow" onclick="renderEquipSlot('${slot}')">
          <span class="sotnSlot">Back</span>
          <span class="sotnValue">Return to ${getSlotLabel(slot)}</span>
        </button>

        <button class="sotnRow" onclick="socketRune('${slot}', ${socketIndex}, null, 0)">
          <span class="sotnSlot">None</span>
          <span class="sotnValue">Remove rune</span>
        </button>
      `;

      if (!runes.length) {
        html += `<div class="smallNote">No runes owned.</div>`;
        content.innerHTML = html;
        return;
      }

      html += `<div class="oneColList">`;

      html += runes.map(entry => {
        const current = currentSocket &&
          currentSocket.runeId === entry.runeId &&
          (currentSocket.level || 0) === entry.level;

        const available = entry.available > 0 || current;

        return `
          <button class="compactRow runeListRow ${current ? "equipped" : ""} ${!available ? "locked" : ""}" ${available ? `onclick="socketRune('${slot}', ${socketIndex}, '${entry.runeId}', ${entry.level})"` : ""}>
            ${compactIconWithQtyHtml(entry.image, "runes", entry.available)}
            <div>
              <div class="compactName">${entry.displayName}${current ? " [Socketed]" : ""}</div>
              <span class="compactSub">${getShortRuneStatLine(entry)}</span>
            </div>
          </button>
        `;
      }).join("");

      html += `</div>`;

      content.innerHTML = html;
    }

    function socketRune(slot, socketIndex, runeId, level = 0) {
      const itemId = player.equipment[slot];
      const record = getOrCreateEquipmentRecord(itemId);

      if (!record || !Array.isArray(record.sockets)) {
        setMessage("No socket available.");
        renderEquipSlot(slot);
        return;
      }

      if (runeId === null) {
        record.sockets[socketIndex] = null;
        recalcDerivedStats();
        updateBars();
        setMessage("Rune removed.");
        renderEquipSlot(slot);
        return;
      }

      const exclude = { itemId, socketIndex };
      const available = getAvailableRuneQuantity(player, runeId, level, exclude);

      if (available <= 0) {
        setMessage("No free copy of that rune.");
        renderRuneSelect(slot, socketIndex);
        return;
      }

      record.sockets[socketIndex] = { runeId, level };
      recalcDerivedStats();
      updateBars();
      setMessage(`Socketed ${getRuneDisplayName(runeId, level)}.`);
      renderEquipSlot(slot);
    }

    function equipSlotItem(slot, itemId) {
      if (isBeltSlot(slot)) {
        player.equipment[slot] = itemId || null;
        updateCombatBeltSlots();
        setMessage(itemId ? `${getSlotLabel(slot)} set to ${getConsumableName(itemId)}.` : `${getSlotLabel(slot)} cleared.`);
        renderEquipSlot(slot);
        return;
      }

      if (!itemId) {
        player.equipment[slot] = null;
        recalcDerivedStats();
        updateBars();
        setMessage(`${getSlotLabel(slot)} removed.`);
        renderEquipSlot(slot);
        return;
      }

      if (!canEquip(itemId)) {
        setMessage("Requirements not met.");
        renderEquipSlot(slot);
        return;
      }

      player.equipment[slot] = itemId;

      if (slot === "weapon" || slot === "armor") {
        normalizeEquipmentSockets(itemId);
      }

      recalcDerivedStats();
      updateBars();
      setMessage(`Equipped ${getEquipName(itemId)}.`);
      renderEquipSlot(slot);
    }


    function renderCombatBeltButton(slot) {
      const btn = document.querySelector(`.beltButton[onclick="useBeltSlot('${slot}')"]`);
      if (!btn) return;

      const itemId = player.equipment[slot];
      const qty = getConsumableQuantityForSlot(slot);
      const hasUsableItem = !!itemId && qty > 0;

      btn.classList.toggle("empty", !hasUsableItem);
      btn.setAttribute("aria-label", hasUsableItem ? getConsumableName(itemId) : `${getSlotLabel(slot)} empty`);
      btn.title = hasUsableItem ? `${getConsumableName(itemId)} x${qty}` : `${getSlotLabel(slot)} empty`;

      if (!hasUsableItem) {
        btn.innerHTML = "";
        return;
      }

      const item = getConsumableSafe(itemId);
      const icon = item && item.image
        ? `<img class="beltItemIcon" src="assets/items/${item.image}" alt="">`
        : "";

      btn.innerHTML = `${icon}<span class="beltQtyBadge">${qty}</span>`;
    }

    function updateCombatBeltSlots() {
      ["belt1", "belt2", "belt3", "belt4"].forEach(renderCombatBeltButton);
    }

    function useBeltSlot(slot) {
      const itemId = player.equipment[slot];
      if (!itemId || getConsumableQuantityForSlot(slot) <= 0) {
        updateCombatBeltSlots();
        return;
      }

      const special = useConsumableSafe(itemId);
      if (special.handled) {
        updateBars();
        updateCombatBeltSlots();
        return;
      }

      if (typeof useConsumable !== "function") {
        setMessage("Item loader not found.");
        return;
      }

      const result = useConsumable(itemId, player, gameMode);

      if (String(itemId || "").includes("potion")) incrementLeaderboardStat("potionsUsed", 1);

      if (result.escape && gameMode === "encounter") {
        runAway();
      }

      updateBars();
      updateCombatBeltSlots();
      if (gameMode !== "encounter") setMessage(result.message);
    }


    function showSplashMenu(returningPlayer = false) {
      const splash = document.getElementById("splashOverlay");
      if (!splash) return;

      const title = document.getElementById("splashTitle");
      const text = document.getElementById("splashText");
      const list = document.getElementById("splashList");

      if (title) title.textContent = returningPlayer ? "Welcome Back" : "Enter the Dungeon";
      if (text) {
        text.textContent = returningPlayer
          ? `Save loaded on Floor ${currentFloor}. Check your Hardiness before pushing deeper.`
          : "Reach the shrine, build your gear, and decide when to push deeper or retreat.";
      }

      if (list) {
        list.innerHTML = `
          <li>The shrine is always at H18.</li>
          <li>The entrance menu can retreat 2 floors for 20% gold.</li>
          <li>Death costs 25% gold and returns you to a new floor.</li>
          <li>Shrine Stones return you directly to the current floor shrine.</li>
          <li>Hardiness is a player-only survival estimate. Floor buttons show separate destination threat.</li>
        `;
      }

      setMenuOpen(true);
      splash.classList.add("show");
    }

    function closeSplashMenu() {
      const splash = document.getElementById("splashOverlay");
      if (splash) splash.classList.remove("show");
      setMenuOpen(false);
    }


    // =========================
    // INIT
    // =========================

    ensureFullInventoryShape();
    ensurePlayerSkills();
    const loadedLocalSave = loadGameState();
    ensureFullInventoryShape();
    ensurePlayerSkills();

    Object.keys(player.inventory.equipment).forEach(itemId => {
      const item = getEquipItem(itemId);
      const record = player.inventory.equipment[itemId];

      if (!item || !record) return;

      if (record.socketsUnlocked === undefined) {
        record.socketsUnlocked = Math.min(item.maxSockets || 0, item.maxSockets > 0 ? 1 : 0);
      }

      normalizeEquipmentSockets(itemId);
    });

    recalcDerivedStats();
    updateCombatBeltSlots();
    saveReady = true;

    if (loadedLocalSave) {
      startNewFloor();
      setMessage(`Save loaded. New floor layout started on floor ${currentFloor}.`);
      showSplashMenu(true);
    } else {
      startNewFloor();
      showSplashMenu(false);
    }
  </script>
</body>
</html>
