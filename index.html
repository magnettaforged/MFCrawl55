<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dungeon Test</title>

  <style>
    :root {
      --app-width: 390px;
      --game-body-height: 680px;

      --accent: #d6a84f;
      --text-main: #ffffff;

      --button-bg: rgba(0,0,0,0.58);
      --button-border: 1px solid rgba(214,168,79,0.85);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #050505;
      color: var(--text-main);
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 8px;
      overflow-x: hidden;
    }

    .pageShell {
      width: min(var(--app-width), 96vw);
      margin: 0 auto;
    }

    .gameBody {
      position: relative;
      width: 100%;
      height: var(--game-body-height);
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }

    .dungeonStage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    .roomLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }

    .layer-room { z-index: 1; }

    .layer-monster {
      z-index: 5;
      object-fit: fill;
      transform: none;
      transform-origin: center center;
      display: none;
    }

    .layer-border { z-index: 20; display: none; }

    .moveZone {
      position: absolute;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      z-index: 30;
    }

    .moveForward { top: 0; left: 24%; width: 52%; height: 32%; }

    .moveLeft { top: 28%; left: 0; width: 28%; height: 44%; }

    .moveRight { top: 28%; right: 0; width: 28%; height: 44%; }

    .moveBack { left: 24%; bottom: 0; width: 52%; height: 28%; }

    .messageBox {
      position: absolute;
      left: 38px;
      right: 38px;
      bottom: 118px;
      z-index: 65;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid rgba(214,168,79,0.5);
      border-radius: 10px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 13px;
      line-height: 1.3;
      text-align: center;
      text-shadow: 0 0 4px #000;
      pointer-events: none;
    }

    .hud {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 30px;
      z-index: 60;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      pointer-events: none;
    }

    .statBlock,
    .actionBlock,
    .combatBlock {
      pointer-events: auto;
      color: #fff;
      text-shadow: 0 0 4px #000;
      font-size: 14px;
      line-height: 1.35;
    }

    .statBlock {
      display: grid;
      gap: 6px;
      align-content: end;
      text-align: left;
    }

    .statLine {
      display: grid;
      grid-template-columns: auto 52px minmax(0, 1fr);
      gap: 6px;
      align-items: center;
    }

    .statValue {
      min-width: 52px;
      color: rgba(255,255,255,0.9);
      font-size: 11px;
      font-weight: bold;
      text-align: right;
      line-height: 1;
      white-space: nowrap;
    }

    .bar {
      height: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 0 4px rgba(0,0,0,0.7);
    }

    .barFill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
    }

    #hpBar {
      background: linear-gradient(90deg, rgba(150,18,18,0.96), rgba(245,70,52,0.96));
    }

    #mpBar {
      background: linear-gradient(90deg, rgba(30,76,170,0.96), rgba(85,164,255,0.96));
    }

    .actionBlock {
      display: grid;
      gap: 8px;
      align-content: end;
      justify-items: center;
    }

    .combatBlock {
      display: none;
    }

    .combatMainButtons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-self: end;
    }

    .combatBeltColumn {
      display: grid;
      grid-template-rows: repeat(4, 34px) 24px;
      gap: 5px;
      align-self: end;
    }

    .combatRunButton {
      min-height: 24px;
      padding: 2px 4px;
      font-size: 11px;
      border-radius: 6px;
    }

    .beltButton {
      position: relative;
      min-height: 34px;
      width: 42px;
      padding: 2px;
      font-size: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .beltButton.empty {
      opacity: 0.18;
      border-color: rgba(214,168,79,0.12);
      background: rgba(0,0,0,0.12);
    }

    .beltItemIcon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.9));
      pointer-events: none;
    }

    .beltQtyBadge {
      position: absolute;
      right: 2px;
      bottom: 1px;
      min-width: 14px;
      padding: 0 3px;
      border-radius: 999px;
      background: rgba(0,0,0,0.76);
      color: #fff;
      font-size: 9px;
      line-height: 13px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.25);
      pointer-events: none;
    }

    .uiButton {
      width: 100%;
      min-height: 32px;
      padding: 6px 8px;
      border: var(--button-border);
      border-radius: 8px;
      background: var(--button-bg);
      color: var(--accent);
      font-weight: bold;
      cursor: pointer;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.65);
    }

    .uiButton:active { transform: scale(0.98); }

    .debugLine {
      position: absolute;
      top: 12px;
      left: 28px;
      right: 28px;
      z-index: 61;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(0,0,0,0.5);
      color: rgba(255,255,255,0.75);
      font-size: 11px;
      text-align: center;
      pointer-events: none;
    }


    /* Patch: remove room/debug/facing UI from normal play. */
    .debugLine,
    .facingBadge {
      display: none !important;
    }

    .overlay {
      position: absolute;
      inset: 6px;
      z-index: 90;
      display: none;
      padding: 8px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      background: rgba(0,0,0,0.92);
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      color: #fff;
    }

    .overlay.show { display: block; }

    .overlayTitle {
      color: var(--accent);
      font-weight: bold;
      font-size: 18px;
      text-align: center;
      margin-bottom: 6px;
      padding: 0 36px;
      line-height: 26px;
      min-height: 26px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .tabContent {
      height: 520px;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 5px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      font-size: 13px;
      line-height: 1.35;
      white-space: normal;
    }

    .menuHeader {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      color: rgba(255,255,255,0.82);
      font-size: 12px;
    }

    .sotnRow {
      width: 100%;
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 8px;
      align-items: center;
      min-height: 34px;
      margin: 0 0 5px 0;
      padding: 7px 8px;
      border: 1px solid rgba(214,168,79,0.35);
      border-radius: 7px;
      background: rgba(0,0,0,0.34);
      color: #fff;
      text-align: left;
      cursor: pointer;
    }

    .sotnRow:active { transform: scale(0.99); }

    .sotnSlot {
      color: var(--accent);
      font-weight: bold;
      font-size: 12px;
    }

    .sotnValue {
      color: #fff;
      font-size: 12px;
      line-height: 1.25;
    }

    .itemRow {
      width: 100%;
      display: block;
      min-height: 42px;
      margin: 0 0 6px 0;
      padding: 8px;
      border: 1px solid rgba(214,168,79,0.42);
      border-radius: 7px;
      background: rgba(0,0,0,0.36);
      color: #fff;
      text-align: left;
      cursor: pointer;
    }

    .itemRow.equipped {
      border-color: #fff;
      background: rgba(214,168,79,0.20);
    }

    .itemRow.locked {
      opacity: 0.45;
      border-color: rgba(255,255,255,0.18);
    }

    .itemNameLine {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--accent);
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .itemDescLine {
      color: rgba(255,255,255,0.82);
      font-size: 12px;
      line-height: 1.35;
    }

    .smallNote {
      color: rgba(255,255,255,0.72);
      font-size: 12px;
      margin: 6px 0;
    }


    .pagedList {
      display: grid;
      gap: 3px;
    }

    .twoColList {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 5px;
      row-gap: 3px;
    }

    .oneColList {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .oneColList .compactRow {
      grid-template-columns: 48px 1fr;
      min-height: 44px;
    }

    .oneColList .compactIcon {
      width: 40px;
      height: 40px;
    }

    .compactRow {
      width: 100%;
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 5px;
      align-items: center;
      min-height: 40px;
      margin: 0 0 3px 0;
      padding: 3px 5px;
      border: 1px solid rgba(214,168,79,0.35);
      border-radius: 4px;
      background: rgba(0,0,0,0.28);
      color: #fff;
      text-align: left;
      cursor: pointer;
    }

    .compactRow.locked {
      opacity: 0.45;
      border-color: rgba(255,255,255,0.18);
    }

    .compactRow.equipped {
      border-color: #fff;
      background: rgba(214,168,79,0.20);
    }

    .compactIcon {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 0 3px rgba(0,0,0,0.85));
    }

    .compactIcon.empty {
      opacity: 0.28;
    }

    .compactName {
      color: #fff;
      font-weight: normal;
      font-size: 12px;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0.2px;
    }

    .compactSub {
      display: block;
      color: rgba(255,255,255,0.68);
      font-size: 10.5px;
      line-height: 1.15;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compactQty {
      display: none;
    }


    .runeListRow {
      min-height: 52px;
    }

    .runeListRow .compactName {
      font-size: 12.5px;
      line-height: 1.1;
    }

    .runeListRow .compactSub {
      display: block;
      font-size: 11.5px;
      line-height: 1.15;
      margin-top: 3px;
      white-space: nowrap;
    }


    .compactIconWrap {
      position: relative;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .compactIconWrap .compactIcon,
    .compactIconWrap .equipIcon {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .compactQtyBadge {
      position: absolute;
      right: -2px;
      bottom: -2px;
      min-width: 15px;
      height: 15px;
      padding: 0 3px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.38);
      background: rgba(0,0,0,0.82);
      color: #fff;
      font-size: 9px;
      line-height: 13px;
      text-align: center;
      font-weight: bold;
      pointer-events: none;
    }

    .pageControls {
      display: grid;
      grid-template-columns: 58px auto 58px;
      justify-content: center;
      gap: 5px;
      align-items: center;
      margin: 5px 0 0;
    }

    .pageText {
      color: rgba(255,255,255,0.78);
      font-size: 12px;
      text-align: center;
      min-width: 70px;
    }


    .statusPageTabs {
      display: none;
    }

    .statusCard {
      position: relative;
      height: 100%;
      min-height: 100%;
      margin-bottom: 0;
      max-width: 100%;
      overflow: hidden;
      background-image: var(--status-pose, none);
      background-size: auto 100%;
      background-position: left bottom;
      background-repeat: no-repeat;
    }

    .statusPoseBox,
    .statusPose {
      display: none;
    }

    .statusPoseFallback {
      color: rgba(255,255,255,0.55);
      font-weight: bold;
      font-size: 18px;
      text-align: center;
    }

    .statusInfoBox {
      position: absolute;
      top: 0;
      right: 0;
      width: 38%;
      max-width: 156px;
      border: 1px solid rgba(214,168,79,0.35);
      border-radius: 7px;
      background: rgba(0,0,0,0.42);
      padding: 7px;
      min-width: 0;
      overflow: hidden;
      backdrop-filter: blur(1px);
    }

    .statusName {
      color: var(--accent);
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .statusLevel {
      color: rgba(255,255,255,0.86);
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .statusStatGrid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
      font-size: 12px;
      line-height: 1.1;
    }

    .statusStat {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 3px;
      align-items: center;
    }

    .statusLabel {
      color: rgba(255,255,255,0.66);
      font-weight: bold;
    }

    .statusValue {
      color: #fff;
      text-align: right;
      min-width: 34px;
    }

    .statusCycleRow {
      display: grid;
      grid-template-columns: 28px 1fr 28px;
      gap: 4px;
      align-items: center;
      margin-top: 10px;
    }

    .statusCycleButton {
      min-height: 25px;
      padding: 2px 0;
      border: 1px solid rgba(214,168,79,0.55);
      border-radius: 5px;
      background: rgba(0,0,0,0.32);
      color: var(--accent);
      font-weight: bold;
      cursor: pointer;
    }

    .statusCycleLabel {
      color: var(--accent);
      text-align: center;
      font-size: 12px;
      font-weight: bold;
    }


    .itemCategoryCycle {
      display: grid;
      grid-template-columns: 32px 1fr 32px;
      gap: 5px;
      align-items: center;
      margin: 6px 0 8px;
    }

    .itemCategoryLabel {
      color: var(--accent);
      text-align: center;
      font-size: 13px;
      font-weight: bold;
    }

    .statusEquipList {
      display: grid;
      gap: 3px;
    }

    .statusEquipRow {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 6px;
      align-items: center;
      min-height: 25px;
      padding: 3px 6px;
      border: 1px solid rgba(214,168,79,0.25);
      border-radius: 4px;
      background: rgba(0,0,0,0.22);
      font-size: 12px;
    }

    .statusGridPage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .statusMetric {
      min-height: 35px;
      padding: 6px;
      border: 1px solid rgba(214,168,79,0.28);
      border-radius: 5px;
      background: rgba(0,0,0,0.24);
    }

    .statusMetricName {
      color: rgba(255,255,255,0.66);
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .statusMetricValue {
      color: #fff;
      font-size: 13px;
    }


    .equipGrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 8px;
    }

    .equipGridButton {
      position: relative;
      min-height: 74px;
      padding: 5px 4px;
      border: 1px solid rgba(214,168,79,0.38);
      border-radius: 7px;
      background: rgba(0,0,0,0.30);
      color: #fff;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }


    .equipSkillRow {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .equipGridButton.skillEquipSlot {
      min-height: 38px;
      padding: 4px 3px;
    }

    .equipGridButton.skillEquipSlot .equipGridLabel {
      font-size: 9.5px;
      color: rgba(214,168,79,0.88);
      order: 2;
    }

    .equipGridButton.skillEquipSlot .equipGridName {
      font-size: 10.5px;
      color: #fff;
      order: 1;
    }

    .equipGridButton.wideLeft,
    .equipGridButton.wideRight {
      min-height: 165px;
    }

    .equipGridButton.wideLeft { grid-column: 1 / span 2; }
    .equipGridButton.wideRight { grid-column: 3 / span 2; }

    .equipGridButton.wideLeft .equipGridIcon,
    .equipGridButton.wideLeft .equipGridIcon.empty {
      width: 116px;
      height: 116px;
    }

    .equipGridButton.wideRight .equipGridIcon,
    .equipGridButton.wideRight .equipGridIcon.empty {
      width: 154px;
      height: 154px;
    }

    .equipGridLabel {
      position: relative;
      z-index: 2;
      width: 100%;
      color: var(--accent);
      font-size: 10.5px;
      font-weight: bold;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 0 4px #000, 0 0 6px #000;
    }

    .equipGridName {
      position: relative;
      z-index: 2;
      width: 100%;
      color: rgba(255,255,255,0.92);
      font-size: 10.5px;
      font-weight: bold;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 4px #000, 0 0 7px #000;
    }

    .equipGridIcon {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 50%;
      width: 46px;
      height: 46px;
      object-fit: contain;
      opacity: 0.92;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.95));
      pointer-events: none;
    }

    .equipGridIcon.empty {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 5px;
      opacity: 0.18;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .equipCompactList {
      display: grid;
      gap: 4px;
    }

    .equipSlotRow {
      width: 100%;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 6px;
      align-items: center;
      min-height: 30px;
      padding: 4px 6px;
      border: 1px solid rgba(214,168,79,0.38);
      border-radius: 5px;
      background: rgba(0,0,0,0.30);
      color: #fff;
      text-align: left;
      cursor: pointer;
    }

    .equipSlotLabel {
      color: var(--accent);
      font-size: 12px;
      font-weight: bold;
    }

    .equipSlotValue {
      color: #fff;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .closeButton {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 34px;
      min-height: 28px;
      padding: 2px 0;
      z-index: 100;
      font-size: 16px;
      line-height: 1;
    }

    body.encounterMode .layer-monster { display: block; }
    body.encounterMode .actionBlock { display: none; }
    body.encounterMode .combatBlock { display: contents; }

    body.encounterMode .hud {
      grid-template-columns: 1fr 46px;
      grid-template-rows: auto auto auto;
      column-gap: 8px;
      row-gap: 0;
      align-items: end;
      bottom: 22px;
      left: 18px;
      right: 18px;
    }

    body.encounterMode .statBlock {
      grid-column: 1;
      grid-row: 1;
      gap: 3px;
      padding: 5px 8px 2px;
      border: 1px solid rgba(213,170,62,0.42);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      background: rgba(0,0,0,0.28);
      box-shadow: 0 0 10px rgba(0,0,0,0.35);
    }

    body.encounterMode .statLine {
      grid-template-columns: 34px 54px minmax(0, 1fr);
      gap: 6px;
      font-size: 12px;
      color: #fff;
      text-shadow: 0 0 4px #000;
    }

    body.encounterMode .statValue {
      min-width: 54px;
      font-size: 10.5px;
    }

    body.encounterMode .attackMeterWrap {
      grid-column: 1;
      grid-row: 2;
      align-self: end;
      padding: 2px 8px 5px;
      border: 1px solid rgba(213,170,62,0.42);

    .layer-effect {
      z-index: 12;
      object-fit: contain;
      display: none;
      opacity: 0;
      transform: translateY(16px) scale(0.92);
      pointer-events: none;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.65));
    }

    .layer-effect.show {
      display: block;
      animation: effectFlash 340ms ease-out forwards;
    }

    @keyframes effectFlash {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(0.70) rotate(-3deg);
      }
      18% {
        opacity: 1;
        transform: translateY(16px) scale(0.96) rotate(1deg);
      }
      100% {
        opacity: 0;
        transform: translateY(16px) scale(1.12) rotate(4deg);
      }
    }

    body.monsterHit .layer-monster {
      animation: monsterHitJolt 260ms ease-out;
      filter: drop-shadow(0 0 10px rgba(255,0,0,0.65)) saturate(1.45);
    }

    body.monsterAttack .layer-monster {
      animation: monsterLunge 260ms ease-out;
    }

    body.playerHit .dungeonStage {
      animation: playerHitShake 220ms ease-out;
    }

    @keyframes monsterHitJolt {
      0% { transform: translateX(0) scale(1) rotate(0deg); }
      30% { transform: translateX(-5px) scale(1.015) rotate(-0.8deg); }
      65% { transform: translateX(4px) scale(0.995) rotate(0.8deg); }
      100% { transform: translateX(0) scale(1) rotate(0deg); }
    }

    @keyframes monsterLunge {
      0% { transform: scale(1); }
      45% { transform: scale(1.045); }
      100% { transform: scale(1); }
    }

    @keyframes playerHitShake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-2px); }
      100% { transform: translateX(0); }
    }

    .damageNumber {
      position: absolute;
      z-index: 70;
      left: 50%;
      top: 40%;
      transform: translate(-50%, -50%);
      display: none;
      color: #fff;
      font-weight: bold;
      font-size: 22px;
      text-shadow: 0 0 5px #000, 0 0 9px #000;

    }

    .damageNumber.show {

      animation: damageFloat 1250ms ease-out forwards;
    }

    @keyframes damageFloat {
      0% { opacity: 0; transform: translate(-50%, -35%) scale(0.8); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
      100% { opacity: 0; transform: translate(-50%, -92%) scale(1); }
    }

  
    body.roomMoving .layer-room {
      animation: roomStepTransition 540ms ease-out;
    }

    @keyframes roomStepTransition {
      0% {
        transform: scale(1);
        filter: brightness(1);
      }
      42% {
        transform: scale(1.08);
        filter: brightness(0.62);
      }
      100% {
        transform: scale(1);
        filter: brightness(1);
      }
    }

      transform-origin: center bottom;
    }

      0% { transform: translateY(0) scale(1); }

  <script>
    
    const GAME_VERSION = "v0.6.4";
// =========================
    // MAP / FLOOR STATE
    // =========================

    const FLOOR_THEMES = ["c", "b", "f"]; // c = castle, b = beach, f = forest

    let currentFloor = 1;
    let currentMapId = "";
    let currentMap = null;
    let currentFloorTheme = "c";
    let testMap = [];
    let lowHpAlertPlayed = false;

    let playerX = 1;
    let playerY = 1;
    let playerDir = 2;
    let moveHistory = []; // stores prior position + facing for Back
    let facingHistory = []; // kept for save compatibility
    let roomTransitionLocked = false;
    const ROOM_TRANSITION_DELAY_MS = 540;

    const dirNames = ["N", "E", "S", "W"];
    const openedChests = new Set();
    const clearedMonsters = new Set();
    const triggeredTraps = new Set();
    const disabledTraps = new Set();


    function forceWebpFileName(fileName) {
      const name = String(fileName || "").trim();
      if (!name) return "";
      return name.replace(/\.(png|jpg|jpeg|webp)$/i, "") + ".webp";
    }

    function setImageWithPngFallback(img, webpPath, pngPath = "") {
      if (!img || !webpPath) return;

      img.onerror = () => {
        if (!pngPath) {
          img.onerror = null;
          return;
        }

        img.onerror = null;
        img.src = pngPath;
      };

      img.src = webpPath;
    }


    function syncSoundToggleButton() {
      const btn = document.getElementById("soundToggle");
      if (!btn) return;

      const muted = typeof isGameSoundMuted === "function" ? isGameSoundMuted() : false;
      btn.textContent = muted ? "🔇" : "🔊";
      btn.classList.toggle("muted", muted);
    }

    function toggleGameSound() {
      if (typeof toggleSoundMute === "function") {
        toggleSoundMute();
      }
      syncSoundToggleButton();
    }

    function getCurrentThemeWalkSoundId() {
      if (currentFloorTheme === "b") return "walk_beach";
      if (currentFloorTheme === "f") return "walk_forest";
      return "walk_castle";
    }

    function dungeonRandomChoice(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function getMonsterFloorLevel(floor) {
      return Math.max(1, Math.floor(Number(floor) || 1));
    }

    function getCurrentMonsterPoolId() {
      // Theme-only fallback id. The current monsterLoader reads currentFloor separately in startEncounter().
      return currentFloorTheme || "c";
    }

    function findEntrancePosition(grid) {
      for (let y = 0; y < grid.length; y++) {
        const x = grid[y].indexOf("E");
        if (x !== -1) return { x, y };
      }

      return { x: 1, y: 1 };
    }


    function findShrinePosition(grid = testMap) {
      for (let y = 0; y < grid.length; y++) {
        const x = grid[y].indexOf("S");
        if (x !== -1) return { x, y };
      }

      return null;
    }

    function getWorldDirectionToShrine() {
      const shrine = findShrinePosition(testMap);
      if (!shrine) return null;

      const dx = shrine.x - playerX;
      const dy = shrine.y - playerY;

      if (dx === 0 && dy === 0) return "HERE";

      if (Math.abs(dx) > Math.abs(dy)) {
        return dx > 0 ? "E" : "W";
      }

      return dy > 0 ? "S" : "N";
    }

    function getRelativeShrineArrow() {
      const worldDir = getWorldDirectionToShrine();
      if (!worldDir) return "·";
      if (worldDir === "HERE") return "◆";

      // Fixed-view crawler: player view always faces south/down the grid.
      if (worldDir === "S") return "↑";
      if (worldDir === "E") return "→";
      if (worldDir === "N") return "↓";
      if (worldDir === "W") return "←";
      return "·";
    }

    function updateTopHud() {
      const floorEl = document.getElementById("floorIndicator");
      if (floorEl) floorEl.textContent = `Floor ${currentFloor} | ${getGridLocationLabel(playerX, playerY)}`;

      const mapEl = document.getElementById("mapIndicator");
      if (mapEl) {
        const mapName = currentMap && currentMap.name ? currentMap.name : currentMapId || "fallback";
        mapEl.textContent = `Map: ${mapName}`;
      }

      const versionEl = document.getElementById("versionIndicator");
      if (versionEl) versionEl.textContent = GAME_VERSION;
    }



    function preloadFloorThemeImages() {
      const theme = currentFloorTheme || "c";
      const roomTypes = [
        "chestroom", "door", "openroom", "room3way", "roomfl", "roomfr",
        "roomleft", "roomlr", "roomright", "shrine"
      ];

      roomTypes.forEach(type => {
        const img = new Image();
        img.src = `assets/rooms/${type}${theme}1.webp`;
      });
    }

    function startNewFloor() {
      // Starting or reloading a floor is a safe rest point.
      player.hp = player.maxHp;
      player.mp = player.maxMp;
      lowHpAlertPlayed = false;

      if (typeof MAPS === "undefined") {
        console.warn("MAPS is missing. Check maps.js load order.");
        testMap = [
          "##########",
          "#E#######",
          "#S#######",
          "##########"
        ];
        currentMapId = "fallback";
      } else {
        const mapIds = Object.keys(MAPS);
        currentMapId = dungeonRandomChoice(mapIds);
        currentMap = MAPS[currentMapId];
        testMap = currentMap.grid;
      }

      currentFloorTheme = dungeonRandomChoice(FLOOR_THEMES);

      const start = findEntrancePosition(testMap);
      playerX = start.x;
      playerY = start.y;
      playerDir = 2;
      moveHistory = [];
      facingHistory = [];
      openedChests.clear();
      clearedMonsters.clear();
      triggeredTraps.clear();
      disabledTraps.clear();

      resetFloorShopState();
      incrementLeaderboardStat("totalFloors", 1);

      preloadFloorThemeImages();
      updateRoomView();
      updateTopHud();
      updateBars();
      syncSoundToggleButton();

      const themeName = currentFloorTheme === "c" ? "Castle" : currentFloorTheme === "b" ? "Beach" : "Forest";
      setMessage(`${themeName} floor ${currentFloor} loaded.`);
    }

    // =========================
    // BASIC STATE
    // =========================

    let gameMode = "roaming";
    let currentEnemy = null;
    let currentEnemyTileKey = null;
    let inventoryMode = "main";
    let activeEquipSlot = null;

    const player = {
      character: "maya",
      name: "Maya",
      level: 1,
      exp: 0,

      str: 8,
      dex: 7,
      magic: 3,
      vitality: 8,
      speed: 6,

      hp: 100,
      maxHp: 100,
      mp: 30,
      maxMp: 30,
      gold: 0,

      statusEffects: {
        poison: false
      },

      inventory: {
        consumables: {
          potion: 3,
          mana_potion: 1
        },

        equipment: {
          rusty_sword: { owned: true, level: 0, pending: 0, socketsUnlocked: 1, sockets: [{ runeId: "kenaz", level: 0 }] },
          iron_sword: { owned: true, level: 0, pending: 0, socketsUnlocked: 1, sockets: [] },
          maya_cloth: { owned: true, level: 0, pending: 0, socketsUnlocked: 1, sockets: [{ runeId: "algiz", level: 0 }] },
          torn_cloak: { owned: true, level: 0, pending: 0 },
          traveler_cloak: { owned: true, level: 0, pending: 0 },
          copper_necklace: { owned: true, level: 0, pending: 0 },
          copper_ring: { owned: true, level: 0, pending: 0 },
          iron_ring: { owned: true, level: 0, pending: 0 }
        },

        keyitems: {
          generic_key: true
        },

        runes: {
          fehu: { 0: 1, 1: 0, 2: 0, 3: 0 },
          uruz: { 0: 1, 1: 0, 2: 0, 3: 0 },
          kenaz: { 0: 2, 1: 0, 2: 0, 3: 0 },
          algiz: { 0: 1, 1: 0, 2: 0, 3: 0 },
          sowilo: { 0: 1, 1: 0, 2: 0, 3: 0 }
        },

        gems: {},
        fragments: {}
      },

      equipment: {
        weapon: "rusty_sword",
        armor: "maya_cloth",
        necklace: null,
        ring1: "copper_ring",
        ring2: null,
        ring3: null,
        ring4: null,
        belt1: "potion",
        belt2: "mana_potion",
        belt3: null,
        belt4: null
      }
    };



    // =========================
    // LOCAL SAVE
    // =========================

    const LOCAL_SAVE_KEY = "dungeonCrawlerLocalSave_v1";
    let saveReady = false;
    let saveTimer = null;

    function deepMergeMutable(target, source) {
      if (!source || typeof source !== "object") return target;

      Object.keys(source).forEach(key => {
        const value = source[key];

        if (Array.isArray(value)) {
          target[key] = value.slice();
          return;
        }

        if (value && typeof value === "object") {
          if (!target[key] || typeof target[key] !== "object" || Array.isArray(target[key])) {
            target[key] = {};
          }
          deepMergeMutable(target[key], value);
          return;
        }

        target[key] = value;
      });

      return target;
    }

    function getLocalSavePayload() {
      return {
        version: 1,
        savedAt: Date.now(),
        currentFloor,
        currentMapId,
        currentFloorTheme,
        playerX,
        playerY,
        playerDir,
        moveHistory: Array.isArray(moveHistory) ? moveHistory.slice() : [],
        facingHistory: Array.isArray(facingHistory) ? facingHistory.slice() : [],
        openedChests: Array.from(openedChests || []),
        clearedMonsters: Array.from(clearedMonsters || []),
        player: JSON.parse(JSON.stringify(player))
      };
    }

    function saveGameState(immediate = false) {
      if (!saveReady) return;

      const write = () => {
        try {
          window.localStorage.setItem(LOCAL_SAVE_KEY, JSON.stringify(getLocalSavePayload()));
        } catch (err) {
          console.warn("Local save failed:", err);
        }
      };

      if (immediate) {
        if (saveTimer) {
          clearTimeout(saveTimer);
          saveTimer = null;
        }
        write();
        return;
      }

      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = window.setTimeout(() => {
        saveTimer = null;
        write();
      }, 250);
    }

    function loadGameState() {
      try {
        const raw = window.localStorage.getItem(LOCAL_SAVE_KEY);
        if (!raw) return false;

        const save = JSON.parse(raw);
        if (!save || typeof save !== "object") return false;

        if (save.player && typeof save.player === "object") {
          // Replace the default starter player with the saved player instead of deep-merging into it.
          // This prevents re-granting starter gear/consumables after they were sold or used.
          Object.keys(player).forEach(key => delete player[key]);
          deepMergeMutable(player, save.player);
        }

        currentFloor = Math.max(1, Math.floor(Number(save.currentFloor) || 1));

        // Deliberately do NOT restore the active map, position, opened chests,
        // cleared monster rooms, movement history, or floor theme.
        // On every page load, the character keeps progression/inventory/floor,
        // but starts a freshly generated floor at the entrance.
        currentMapId = "";
        currentMap = null;
        testMap = [];
        currentFloorTheme = "c";
        playerX = 1;
        playerY = 1;
        playerDir = 2;
        moveHistory = [];
      facingHistory = [];
        openedChests.clear();
        clearedMonsters.clear();
        triggeredTraps.clear();
        disabledTraps.clear();

        return true;
      } catch (err) {
        console.warn("Local save load failed:", err);
        return false;
      }
    }

    function clearLocalSave() {
      try {
        window.localStorage.removeItem(LOCAL_SAVE_KEY);
      } catch (err) {
        console.warn("Local save clear failed:", err);
      }
    }

    window.addEventListener("beforeunload", () => saveGameState(true));

    // =========================
    // INVENTORY SHAPE / EQUIPMENT HELPERS
    // =========================

    function ensureFullInventoryShape() {
      if (typeof ensureInventoryShape === "function") {
        ensureInventoryShape(player);
      }

      if (!player.inventory.equipment) player.inventory.equipment = {};
      if (typeof ensureRuneInventory === "function") ensureRuneInventory(player);
      if (!player.inventory.gems) player.inventory.gems = {};
      if (!player.inventory.fragments) player.inventory.fragments = {};
      if (!player.inventory.skills) player.inventory.skills = {};
      ensureLeaderboardStats();
    }

    function getOwnedEquipmentRecord(itemId) {
      ensureFullInventoryShape();
      return player.inventory.equipment[itemId] || null;
    }


    function normalizeEquipmentSockets(itemId) {
      const item = getEquipItem(itemId);
      const record = getOwnedEquipmentRecord(itemId);

      if (!item || !record) return;

      if (!Array.isArray(record.sockets)) {
        record.sockets = [];
      }

      const maxSockets = item.maxSockets || 0;

      if (record.socketsUnlocked === undefined) {
        record.socketsUnlocked = Math.min(maxSockets, maxSockets > 0 ? 1 : 0);
      }

      record.socketsUnlocked = Math.max(0, Math.min(maxSockets, Number(record.socketsUnlocked) || 0));

      while (record.sockets.length < record.socketsUnlocked) {
        record.sockets.push(null);
      }

      if (record.sockets.length > record.socketsUnlocked) {
        record.sockets.length = record.socketsUnlocked;
      }
    }

    function getOrCreateEquipmentRecord(itemId) {
      ensureFullInventoryShape();

      if (!player.inventory.equipment[itemId]) {
        player.inventory.equipment[itemId] = {
          owned: true,
          level: 0,
          pending: 0,
          socketsUnlocked: 0,
          sockets: []
        };
      }

      normalizeEquipmentSockets(itemId);
      return player.inventory.equipment[itemId];
    }

    function getSocketSummary(itemId) {
      const item = getEquipItem(itemId);
      const record = getOwnedEquipmentRecord(itemId);

      if (!item || !record || (item.slot !== "weapon" && item.slot !== "armor")) return "";

      normalizeEquipmentSockets(itemId);

      const filled = record.sockets.filter(socket => socket && socket.runeId).length;
      const total = record.socketsUnlocked || 0;
      const max = item.maxSockets || 0;

      return `Runes ${filled}/${total} · Max ${max}`;
    }

    function getEquippedRuneRecords() {
      const records = [];

      ["weapon", "armor"].forEach(slot => {
        const itemId = player.equipment[slot];
        const record = getOwnedEquipmentRecord(itemId);
        if (record) records.push(record);
      });

      return records;
    }

    function getRuneBonusTotals() {
      if (typeof getRuneBonusTotalsFromRecords !== "function") {
        return {
          goldFindPct: 0,
          attackPct: 0,
          piercePct: 0,
          magicPct: 0,
          speedPct: 0,
          fireWeaponPct: 0,
          lifeStealPct: 0,
          shockWeaponPct: 0,
          slowChancePct: 0,
          lightBonusPct: 0,
          defensePct: 0,
          undeadBonusPct: 0
        };
      }

      return getRuneBonusTotalsFromRecords(player, getEquippedRuneRecords());
    }

    function ownsEquipment(itemId) {
      const record = getOwnedEquipmentRecord(itemId);
      return !!(record && record.owned);
    }

    function getEquipmentLevel(itemId) {
      const record = getOwnedEquipmentRecord(itemId);
      return record ? (record.level || 0) : 0;
    }

    function getEquipmentPending(itemId) {
      const record = getOwnedEquipmentRecord(itemId);
      return record ? (record.pending || 0) : 0;
    }

    function getEquipItem(itemId) {
      if (!itemId || typeof getEquipmentById !== "function") return null;
      return getEquipmentById(itemId);
    }

    function getEquipName(itemId) {
      if (!itemId) return "None";

      const level = getEquipmentLevel(itemId);

      if (typeof getEquipmentDisplayName === "function") {
        return getEquipmentDisplayName(itemId, level);
      }

      const item = getEquipItem(itemId);
      return item ? item.itemName : itemId;
    }

    function getEquipStats(itemId) {
      const item = getEquipItem(itemId);
      if (!item) {
        return {
          hp: 0,
          mp: 0,
          atk: 0,
          mag: 0,
          pdef: 0,
          fireRes: 0,
          iceRes: 0,
          shockRes: 0,
          darkRes: 0,
          speed: 0,
          crit: 0,
          dodge: 0,
          goldFind: 0
        };
      }

      const level = getEquipmentLevel(itemId);

      let rawStats;
      if (typeof getUpgradedEquipmentStats === "function") {
        rawStats = getUpgradedEquipmentStats(item, level);
      } else {
        rawStats = {
          hp: item.hp || item.stats?.hp || 0,
          mp: item.mp || item.stats?.mp || 0,
          atk: item.atk || item.stats?.atk || 0,
          mag: item.mag || item.stats?.mag || 0,
          pdef: item.pdef ?? item.stats?.pdef ?? item.def ?? item.stats?.def ?? 0,
          fireRes: item.fireRes ?? item.stats?.fireRes ?? 0,
          iceRes: item.iceRes ?? item.stats?.iceRes ?? 0,
          shockRes: item.shockRes ?? item.stats?.shockRes ?? 0,
          darkRes: item.darkRes ?? item.stats?.darkRes ?? 0,
          speed: item.speed || item.stats?.speed || 0,
          crit: item.crit || item.stats?.crit || 0,
          dodge: item.dodge || item.stats?.dodge || 0,
          goldFind: item.goldFind || item.stats?.goldFind || 0
        };
      }

      return {
        hp: Number(rawStats.hp || 0),
        mp: Number(rawStats.mp || 0),
        atk: Number(rawStats.atk || 0),
        mag: Number(rawStats.mag || 0),
        pdef: Number(rawStats.pdef ?? rawStats.def ?? 0),
        fireRes: Number(rawStats.fireRes || 0),
        iceRes: Number(rawStats.iceRes || 0),
        shockRes: Number(rawStats.shockRes || 0),
        darkRes: Number(rawStats.darkRes || 0),
        speed: Number(rawStats.speed || 0),
        crit: Number(rawStats.crit || 0),
        dodge: Number(rawStats.dodge || 0),
        goldFind: Number(rawStats.goldFind || 0)
      };
    }

    function getResistanceSummaryLine(stats) {
      if (!stats) return "";
      const values = {
        Fire: Number(stats.fireRes || 0),
        Ice: Number(stats.iceRes || 0),
        Shock: Number(stats.shockRes || 0),
        Dark: Number(stats.darkRes || 0)
      };

      const active = Object.entries(values).filter(([, value]) => value !== 0);
      if (!active.length) return "";

      const unique = [...new Set(active.map(([, value]) => value))];
      if (active.length === 4 && unique.length === 1) {
        return `All Res ${unique[0]}%`;
      }

      return active.map(([name, value]) => `${name} Res ${value}%`).join(" · ");
    }

    function equipmentStatLine(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return "No stats";

      const level = getEquipmentLevel(itemId);
      const pending = getEquipmentPending(itemId);

      let line = "";

      const s = getEquipStats(itemId);
      const parts = [];
      if (s.atk) parts.push(`Atk ${s.atk}`);
      if (s.mag) parts.push(`Mag ${s.mag}`);
      if (s.pdef) parts.push(`PDEF ${s.pdef}%`);
      const resLine = getResistanceSummaryLine(s);
      if (resLine) parts.push(resLine);
      if (s.hp) parts.push(`HP ${s.hp}`);
      if (s.mp) parts.push(`MP ${s.mp}`);
      if (s.speed) parts.push(`Spd ${s.speed}`);
      if (s.dodge) parts.push(`Dodge ${s.dodge}%`);
      if (s.goldFind) parts.push(`Gold ${s.goldFind}%`);
      line = parts.join(" · ") || "No stats";

      const socketText = getSocketSummary(itemId);
      if (socketText) {
        line += ` · ${socketText}`;
      }

      if (pending > 0) {
        line += ` · Pending +${pending}`;
      }

      return line;
    }

    function getEquipmentBonusTotals() {
      const equippedIds = [
        player.equipment.weapon,
        player.equipment.armor,
        player.equipment.necklace,
        player.equipment.ring1,
        player.equipment.ring2,
        player.equipment.ring3,
        player.equipment.ring4
      ].filter(Boolean);

      const totals = {
        hp: 0,
        mp: 0,
        atk: 0,
        mag: 0,
        pdef: 0,
        fireRes: 0,
        iceRes: 0,
        shockRes: 0,
        darkRes: 0,
        speed: 0,
        crit: 0,
        dodge: 0,
        goldFind: 0
      };

      equippedIds.forEach(itemId => {
        const stats = getEquipStats(itemId);

        totals.hp += stats.hp || 0;
        totals.mp += stats.mp || 0;
        totals.atk += stats.atk || 0;
        totals.mag += stats.mag || 0;
        totals.pdef += stats.pdef || 0;
        totals.fireRes += stats.fireRes || 0;
        totals.iceRes += stats.iceRes || 0;
        totals.shockRes += stats.shockRes || 0;
        totals.darkRes += stats.darkRes || 0;
        totals.speed += stats.speed || 0;
        totals.crit += stats.crit || 0;
        totals.dodge += stats.dodge || 0;
        totals.goldFind += stats.goldFind || 0;
      });

      return totals;
    }

    function getTotalGoldFindPct() {
      const equipBonuses = getEquipmentBonusTotals();
      const runeBonuses = getRuneBonusTotals();
      return Math.max(0, (equipBonuses.goldFind || 0) + (runeBonuses.goldFindPct || 0));
    }

    function applyGoldFind(amount) {
      const base = Math.max(0, Math.floor(Number(amount) || 0));
      const goldFindPct = getTotalGoldFindPct();
      return Math.max(0, Math.round(base * (1 + goldFindPct / 100)));
    }

    // =========================
    // PLAYER EXPERIENCE / LEVELING
    // =========================

    const PLAYER_BASE_STATS = {
      str: 8,
      dex: 7,
      magic: 3,
      vitality: 8,
      speed: 6,
      maxHp: 100,
      maxMp: 30
    };

    // Deterministic level-up pattern. This can later become a per-character table.
    const PLAYER_LEVEL_GAIN_PATTERN = [
      { hp: 10, mp: 2, str: 1, dex: 0, magic: 0, vitality: 1, speed: 0 },
      { hp: 8,  mp: 3, str: 0, dex: 1, magic: 0, vitality: 0, speed: 1 },
      { hp: 12, mp: 2, str: 1, dex: 0, magic: 0, vitality: 1, speed: 0 },
      { hp: 8,  mp: 4, str: 0, dex: 1, magic: 1, vitality: 0, speed: 0 },
      { hp: 14, mp: 2, str: 1, dex: 0, magic: 0, vitality: 1, speed: 1 }
    ];

    function getLevelGainForLevel(level) {
      if (level <= 1) {
        return { hp: 0, mp: 0, str: 0, dex: 0, magic: 0, vitality: 0, speed: 0 };
      }

      return PLAYER_LEVEL_GAIN_PATTERN[(level - 2) % PLAYER_LEVEL_GAIN_PATTERN.length];
    }

    function getPlayerLevelBonus(level = player.level) {
      const bonus = { hp: 0, mp: 0, str: 0, dex: 0, magic: 0, vitality: 0, speed: 0 };
      const cappedLevel = Math.max(1, Math.floor(Number(level) || 1));

      for (let lvl = 2; lvl <= cappedLevel; lvl++) {
        const gain = getLevelGainForLevel(lvl);
        bonus.hp += gain.hp || 0;
        bonus.mp += gain.mp || 0;
        bonus.str += gain.str || 0;
        bonus.dex += gain.dex || 0;
        bonus.magic += gain.magic || 0;
        bonus.vitality += gain.vitality || 0;
        bonus.speed += gain.speed || 0;
      }

      return bonus;
    }

    function getExpNeededForLevel(level = player.level) {
      const lvl = Math.max(1, Math.floor(Number(level) || 1));
      return Math.floor(50 + (lvl * lvl * 25));
    }

    function recalcDerivedStats() {
      const bonuses = getEquipmentBonusTotals();
      const levelBonus = getPlayerLevelBonus(player.level);

      player.str = PLAYER_BASE_STATS.str + levelBonus.str;
      player.dex = PLAYER_BASE_STATS.dex + levelBonus.dex;
      player.magic = PLAYER_BASE_STATS.magic + levelBonus.magic;
      player.vitality = PLAYER_BASE_STATS.vitality + levelBonus.vitality;
      player.speed = PLAYER_BASE_STATS.speed + levelBonus.speed + (bonuses.speed || 0);

      player.maxHp = PLAYER_BASE_STATS.maxHp + levelBonus.hp + (bonuses.hp || 0);
      player.maxMp = PLAYER_BASE_STATS.maxMp + levelBonus.mp + (bonuses.mp || 0);

      player.hp = Math.min(player.maxHp, Math.max(1, player.hp));
      player.mp = Math.min(player.maxMp, Math.max(0, player.mp));
    }

    function getMonsterExpReward(monster) {
      if (!monster) return 0;
      const value = monster.exp ?? monster.expReward ?? 0;
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(0, Math.round(n)) : 0;
    }

    function getMonsterGoldRewardMultiplier(monster) {
      const value = monster?.goldRewardMult ?? monster?.rewardMult ?? 1;
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(0.01, n) : 1;
    }

    function scaleMonsterGoldDropAmount(amount, monster) {
      const base = Math.max(0, Number(amount) || 0);
      if (base <= 0) return 0;
      return Math.max(1, Math.round(base * getMonsterGoldRewardMultiplier(monster)));
    }

    function gainExp(amount) {
      const gained = Math.max(0, Math.round(Number(amount) || 0));
      if (!Number.isFinite(player.exp)) player.exp = 0;
      player.exp += gained;
      addLeaderboardXp(gained);

      let levelsGained = 0;

      while (player.exp >= getExpNeededForLevel(player.level)) {
        player.exp -= getExpNeededForLevel(player.level);
        player.level += 1;
        levelsGained += 1;
      }

      if (levelsGained > 0) {
        recalcDerivedStats();
        player.hp = player.maxHp;
        player.mp = player.maxMp;
        updateBars();
      }

      return { gained, levelsGained };
    }

    function isFloorMilestone(floor) {
      const n = Math.max(1, Math.floor(Number(floor) || 1));
      return n > 1 && n % 5 === 0;
    }

    function isMajorFloorMilestone(floor) {
      const n = Math.max(1, Math.floor(Number(floor) || 1));
      return n > 1 && n % 10 === 0;
    }

    function shouldRestrictAdvanceTwoFromFloor(floor) {
      const n = Math.max(1, Math.floor(Number(floor) || 1));
      return n % 5 === 4;
    }

    function getAvailableRuneIdsForReward() {
      if (typeof getRuneById !== "function") return [];

      const sources = [
        typeof RUNES !== "undefined" ? RUNES : null,
        typeof RUNE_DATA !== "undefined" ? RUNE_DATA : null,
        typeof RUNE_DEFS !== "undefined" ? RUNE_DEFS : null,
        typeof RUNE_DEFINITIONS !== "undefined" ? RUNE_DEFINITIONS : null
      ].filter(Boolean);

      for (const source of sources) {
        const ids = Array.isArray(source)
          ? source.map(r => r && (r.runeId || r.id)).filter(Boolean)
          : Object.keys(source);

        const valid = ids.filter(id => getRuneById(id));
        if (valid.length) return valid;
      }

      const fallbackIds = [
        "fehu", "uruz", "thurisaz", "ansuz", "raidho", "kenaz",
        "gebo", "hagalaz", "isa", "eihwaz", "algiz", "sowilo"
      ];

      return fallbackIds.filter(id => getRuneById(id));
    }

    function rollFloorRewardRune(isMajor) {
      if (typeof addRune !== "function" || typeof getRuneDisplayName !== "function") return null;

      const chance = isMajor ? 60 : 25;
      if (Math.random() * 100 >= chance) return null;

      const runeIds = getAvailableRuneIdsForReward();
      const runeId = randomFromList(runeIds);
      if (!runeId) return null;

      addRune(player, runeId, 0, 1);
      return getRuneDisplayName(runeId, 0);
    }

    function awardFloorMilestoneReward(floor) {
      const rewardFloor = Math.max(1, Math.floor(Number(floor) || 1));
      if (!isFloorMilestone(rewardFloor)) return "";

      const major = isMajorFloorMilestone(rewardFloor);
      const goldBase = major
        ? Math.round(90 + rewardFloor * 18)
        : Math.round(40 + rewardFloor * 9);
      const expBase = major
        ? Math.round(55 + rewardFloor * 10)
        : Math.round(25 + rewardFloor * 5);

      const gold = applyGoldFind(goldBase);
      player.gold += gold;

      const expResult = gainExp(expBase);
      const runeName = rollFloorRewardRune(major);

      updateBars();
      saveGameState();

      const label = major ? "Major floor reward" : "Floor reward";
      const pieces = [`${label}: ${gold} gold`, `${expResult.gained} EXP`];

      if (expResult.levelsGained > 0) {
        pieces.push(`Level +${expResult.levelsGained}`);
      }

      if (runeName) {
        pieces.push(`Rune: ${runeName}`);
      }

      return pieces.join(" · ");
    }


    function canEquip(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return false;

      if (typeof canCharacterEquipItem === "function") {
        return canCharacterEquipItem(player, item);
      }

      return true;
    }

    function getEquipmentTierNumber(item) {
      const tierText = String(item && item.tier ? item.tier : "").toLowerCase();
      const match = tierText.match(/mt?(\d+)/);
      if (match) return Number(match[1]);

      const req = Number(item && item.reqLevel ? item.reqLevel : 1);
      if (req >= 9) return 4;
      if (req >= 5) return 3;
      if (req >= 3) return 2;
      return 1;
    }

    function getEquipmentFragmentId(item) {
      const tier = getEquipmentTierNumber(item);
      const kind = item && item.slot === "weapon" ? "weapon" : "armor";
      return `t${tier}_${kind}_fragment`;
    }

    function getFragmentDisplayName(fragmentId) {
      const match = String(fragmentId || "").match(/^t(\d+)_(armor|weapon)_fragment$/);
      if (!match) return fragmentId || "Fragment";
      const kind = match[2] === "weapon" ? "Weapon" : "Armor";
      return `T${match[1]} ${kind} Fragment`;
    }

    function addFragment(fragmentId, amount = 1) {
      ensureFullInventoryShape();
      player.inventory.fragments[fragmentId] = (player.inventory.fragments[fragmentId] || 0) + amount;
    }

    function getFragmentInventoryList() {
      ensureFullInventoryShape();
      return Object.entries(player.inventory.fragments || {})
        .filter(([, quantity]) => quantity > 0)
        .map(([fragmentId, quantity]) => ({
          fragmentId,
          quantity,
          itemName: getFragmentDisplayName(fragmentId),
          description: "Used for same-tier equipment upgrades."
        }));
    }

    function addEquipmentToInventory(itemId) {
      const item = getEquipItem(itemId);

      if (!item) {
        return false;
      }

      ensureFullInventoryShape();

      if (!player.inventory.equipment[itemId] || !player.inventory.equipment[itemId].owned) {
        player.inventory.equipment[itemId] = {
          owned: true,
          level: 0,
          pending: 0,
          socketsUnlocked: Math.min(item.maxSockets || 0, item.maxSockets > 0 ? 1 : 0),
          sockets: []
        };

        normalizeEquipmentSockets(itemId);

        return {
          ok: true,
          message: `Found ${getEquipName(itemId)}.`
        };
      }

      return {
        ok: false,
        duplicate: true,
        message: `Already own ${getEquipName(itemId)}.`
      };
    }

    function addLootItem(itemId) {
      if (getEquipItem(itemId)) {
        return addEquipmentToInventory(itemId);
      }

      if (itemId === "shrine_stone" || (typeof getConsumable === "function" && getConsumable(itemId))) {
        addConsumableSafe(itemId, 1);
        return {
          ok: true,
          message: `Found ${getSafeItemName(itemId)}.`
        };
      }

      if (typeof getKeyItem === "function" && getKeyItem(itemId)) {
        addKeyItem(player, itemId);
        return {
          ok: true,
          message: `Found ${getItemDisplayName(itemId)}.`
        };
      }

      return {
        ok: false,
        message: `Unknown loot: ${itemId}`
      };
    }

    function applyPendingEquipmentUpgrades() {
      ensureFullInventoryShape();

      const messages = [];

      Object.entries(player.inventory.equipment).forEach(([itemId, record]) => {
        if (!record || !record.owned) return;

        const pending = record.pending || 0;

        if (pending <= 0) return;

        record.level = (record.level || 0) + pending;
        record.pending = 0;

        messages.push(`${getEquipName(itemId)} upgraded to +${record.level}.`);
      });

      recalcDerivedStats();
      updateBars();

      return messages;
    }

    function updateFacingAndExits() {
      const badge = document.getElementById("facingBadge");
      if (badge) {
        const dirLabels = ["N", "E", "S", "W"];
        badge.textContent = `Facing ${dirLabels[playerDir] || "S"}`;
      }

      const front = getRelativeTile(0);
      const left = getRelativeTile(-1);

      show("exitLeft", canMoveTo(left.x, left.y), `Left to ${getGridLocationLabel(left.x, left.y)}`);
      show("exitRight", canMoveTo(right.x, right.y), `Right to ${getGridLocationLabel(right.x, right.y)}`);
      show("exitBack", moveHistory.length > 0 && canMoveTo(back.x, back.y), `Back to ${getGridLocationLabel(back.x, back.y)}`);

    function updateDebug() {
      const currentTile = getTile(playerX, playerY);
      const front = getRelativeTile(0);
      const left = getRelativeTile(-1);
      const right = getRelativeTile(1);
      const back = getRelativeTile(2);

      const f = canMoveTo(front.x, front.y) ? "open" : "wall";
      const l = canMoveTo(left.x, left.y) ? "open" : "wall";
      const r = canMoveTo(right.x, right.y) ? "open" : "wall";
      const b = canMoveTo(back.x, back.y) ? "open" : "wall";

      const dirLabels = ["N", "E", "S", "W"];
      document.getElementById("debugLine").textContent =
        `Img:${lastRoomImageName} X:${playerX} Y:${playerY} Face:${dirLabels[playerDir] || "S"} Tile:${currentTile} F:${f} L:${l} R:${r} B:${b}`;
    }

    function getTile(x, y) {
      if (y < 0 || y >= testMap.length) return "#";
      if (x < 0 || x >= testMap[y].length) return "#";
      return testMap[y][x];
    }

    function canMoveTo(x, y) {
      return getTile(x, y) !== "#";
    }

    function isOpenTile(tile) {
      return tile !== "#";
    }

    function getDirOffset(dir) {
      if (dir === 0) return { dx: 0, dy: -1 };
      if (dir === 1) return { dx: 1, dy: 0 };
      if (dir === 2) return { dx: 0, dy: 1 };
      return { dx: -1, dy: 0 };
    }

    function getRelativeTile(relativeDir) {
      // Simulated-turn crawler controls.
      // Default facing is south/down.
      // Moving left/right changes facing to that travel direction.
      // Forward follows current facing.
      // Back is handled by moveBack() using history so it can restore prior facing.
      let absoluteDir = playerDir;

      if (relativeDir === -1) {
        // Screen-left relative to current facing.
        absoluteDir = (playerDir + 3) % 4;
      } else if (relativeDir === 1) {
        // Screen-right relative to current facing.
        absoluteDir = (playerDir + 1) % 4;
      } else if (relativeDir === 2) {
        // Opposite current facing; mostly used for exit display fallback.
        absoluteDir = (playerDir + 2) % 4;
      }

      const offset = getDirOffset(absoluteDir);

      return {
        x: playerX + offset.dx,
        y: playerY + offset.dy,
        dir: absoluteDir,
        tile: getTile(playerX + offset.dx, playerY + offset.dy)
      };
    }

    function getRoomImageNameForType(roomType) {
      return `${roomType}${currentFloorTheme}1`;
    }

    function getRoomImageName() {
      const currentTile = getTile(playerX, playerY);

      // Special rooms only display their special image when standing in that room.
      if (currentTile === "C") return getRoomImageNameForType("chestroom");
      if (currentTile === "B") return getRoomImageNameForType("door");
      if (currentTile === "S") return getRoomImageNameForType("shrine");

      // Image selection is screen-relative to current simulated facing.
      const front = getRelativeTile(0);
      const left = getRelativeTile(-1);
      const right = getRelativeTile(1);
      const back = getRelativeTile(2);

      const frontOpen = canMoveTo(front.x, front.y);
      const leftOpen = canMoveTo(left.x, left.y);
      const rightOpen = canMoveTo(right.x, right.y);
      const backOpen = canMoveTo(back.x, back.y);

      const exitCount =
        Number(frontOpen) +
        Number(leftOpen) +
        Number(rightOpen) +
        Number(backOpen);

      // Any single-exit normal/monster/entrance room is visually a dead-end.
      if (exitCount <= 1) return getRoomImageNameForType("door");

      if (frontOpen && leftOpen && rightOpen) return getRoomImageNameForType("room3way");
      if (frontOpen && leftOpen && !rightOpen) return getRoomImageNameForType("roomfl");
      if (frontOpen && !leftOpen && rightOpen) return getRoomImageNameForType("roomfr");
      if (frontOpen && !leftOpen && !rightOpen) return getRoomImageNameForType("openroom");
      if (!frontOpen && leftOpen && rightOpen) return getRoomImageNameForType("roomlr");
      if (!frontOpen && leftOpen && !rightOpen) return getRoomImageNameForType("roomleft");
      if (!frontOpen && !leftOpen && rightOpen) return getRoomImageNameForType("roomright");

      // Only the back path is open.
      return getRoomImageNameForType("door");
    }

    function getChestStateAt(x, y) {
      const tile = getTile(x, y);
      const key = tileKey(x, y);

      if (tile !== "C") {
        return {
          hasChest: false,
          opened: false,
          mimic: false,
          image: ""
        };
      }

      const isOpened = openedChests.has(key);

      return {
        hasChest: true,
        opened: isOpened,
        mimic: false,
        image: isOpened ? "chestopen1.webp" : "chestclosed1.webp"
      };
    }

    function updateChestLayer() {
      const layer = document.getElementById("chestLayer");
      if (!layer) return;

      const state = getChestStateAt(playerX, playerY);

      if (!state.hasChest) {
        layer.classList.remove("show");
        layer.removeAttribute("src");
        return;
      }

      setImageWithPngFallback(
        layer,
        `assets/chest/${forceWebpFileName(state.image)}`,
        `assets/chest/${String(state.image || "").replace(/\.webp$/i, ".png")}`
      );
      layer.classList.add("show");
    }

    function playChestOpened() {
      document.body.classList.remove("chestOpened");
      void document.body.offsetWidth;
      document.body.classList.add("chestOpened");

      window.setTimeout(() => {
        document.body.classList.remove("chestOpened");
      }, 440);

    function enterTile(tile) {
      const key = tileKey(playerX, playerY);
      updateRoomView();

      if (tile === "E") {
        setMessage("Floor entrance. Use Action for entrance options.");
        return;
      }

      if (tile === "R") {
        setMessage("Moved to room.");
        return;
      }

      if (tile === "M") {
        if (clearedMonsters.has(key)) {
          setMessage("The monster room is clear.");
          return;
        }

        setMessage("You enter a monster room.");
        startEncounter(getCurrentMonsterPoolId(), key, "M");
        return;
      }

      if (tile === "N") {
        setMessage(`${getFloorNpcTitle()} found. Use Action to interact.`);
        return;
      }

      if (tile === "C") {
        if (openedChests.has(key)) {
          setMessage("The chest is empty.");
          return;
        }

        setMessage("You found a chest.");
        return;
      }

      if (tile === "T") {
        setMessage("Moved to room.");
        return;
      }

      if (tile === "B") {
        if (clearedMonsters.has(key)) {
          setMessage("The boss room is clear.");
          return;
        }

        setMessage("A boss blocks the room.");
        startEncounter(getCurrentMonsterPoolId(), key, "B");
        return;
      }

      if (tile === "S") {
        setMessage("You found a shrine.");
        return;
      }

      setMessage("Moved.");
    }

    function saveCurrentPosition() {
      moveHistory.push({
        x: playerX,
        y: playerY,
        dir: playerDir
      });
    }

    function getPreviousPosition() {
      if (!Array.isArray(moveHistory) || moveHistory.length === 0) return null;

      const prev = moveHistory[moveHistory.length - 1];
      if (!prev || typeof prev.x !== "number" || typeof prev.y !== "number") return null;
      if (!canMoveTo(prev.x, prev.y)) return null;

      return prev;
    }

    function moveToRelative(relativeDir, newFacingDir, moveLabel) {
      if (menuIsOpen()) return;
      if (gameMode === "encounter") return;
      if (roomTransitionLocked) return;

      const next = getRelativeTile(relativeDir);

      if (!canMoveTo(next.x, next.y)) {
        updateRoomView();
        setMessage(`No ${moveLabel} path.`);
        return;
      }

      saveCurrentPosition();
      roomTransitionLocked = true;

      if (typeof playSound === "function") playSound(getCurrentThemeWalkSoundId());
      playRoomTransition();

      window.setTimeout(() => {
        playerX = next.x;
        playerY = next.y;

        if (relativeDir === -1 || relativeDir === 1) {
          playerDir = next.dir;
        }

        roomTransitionLocked = false;
        incrementLeaderboardStat("totalRooms", 1);
        enterTile(getTile(playerX, playerY));
      }, ROOM_TRANSITION_DELAY_MS);
    }

    function moveForward() {
      moveToRelative(0, playerDir, "forward");
    }


    function moveBack() {
      if (menuIsOpen()) return;
      if (gameMode === "encounter") return;
      if (roomTransitionLocked) return;

      const previous = getPreviousPosition();

      if (!previous) {
        updateRoomView();
        setMessage("No back path.");
        return;
      }

      roomTransitionLocked = true;
      if (typeof playSound === "function") playSound(getCurrentThemeWalkSoundId());
      playRoomTransition();

      window.setTimeout(() => {
        moveHistory.pop();

        playerX = previous.x;
        playerY = previous.y;
        playerDir = Number.isInteger(previous.dir) ? previous.dir : 2;

        roomTransitionLocked = false;
        incrementLeaderboardStat("totalRooms", 1);
        enterTile(getTile(playerX, playerY));
      }, ROOM_TRANSITION_DELAY_MS);
    }


    function turnLeft() {
      moveToRelative(-1, (playerDir + 3) % 4, "left");
    }


    function turnRight() {
      moveToRelative(1, (playerDir + 1) % 4, "right");

    function getSafeItemName(itemId) {
      if (itemId === "shrine_stone") return "Shrine Stone";
      if (typeof getItemDisplayName === "function") return getItemDisplayName(itemId);
      const item = typeof getConsumable === "function" ? getConsumable(itemId) : null;
      return item ? item.itemName : String(itemId || "Item");
    }

    function addConsumableSafe(itemId, qty = 1) {
      ensureFullInventoryShape();
      ensureShrineStoneData();

      if (typeof addConsumable === "function" && addConsumable(player, itemId, qty)) {
        return true;
      }

      player.inventory.consumables[itemId] = Number(player.inventory.consumables[itemId] || 0) + Number(qty || 1);
      return true;
    }

    function getConsumableSafe(itemId) {
      ensureShrineStoneData();
      if (itemId === "shrine_stone") {
        return {
          itemId: "shrine_stone",
          itemName: "Shrine Stone",
          image: "shrinestone1.webp",
          value: 150,
          price: 150,
          description: "Teleports you directly to the shrine on the current floor."
        };
      }
      return typeof getConsumable === "function" ? getConsumable(itemId) : null;
    }

    function removeConsumableSafe(itemId, qty = 1) {
      ensureFullInventoryShape();
      const current = Number(player.inventory.consumables[itemId] || 0);
      if (current < qty) return false;
      player.inventory.consumables[itemId] = current - qty;
      if (player.inventory.consumables[itemId] <= 0) delete player.inventory.consumables[itemId];
      return true;
    }

    function hashStringToNumber(value) {
      const str = String(value || "");
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

      const key = getFloorNpcKey();

      const requestedDelta = Number(delta) || 0;

      if (requestedDelta > 1 && shouldRestrictAdvanceTwoFromFloor(currentFloor)) {
        setMessage("Advance 2 is disabled before a floor reward milestone.");
        renderShrineContinue();
        return;
      }

      const oldFloor = currentFloor;
      currentFloor = Math.max(1, currentFloor + requestedDelta);
      const reachedFloor = currentFloor;
      const rewardMessage = requestedDelta > 0 ? awardFloorMilestoneReward(reachedFloor) : "";

      setMenuOpen(false);
      gameMode = "roaming";
      startNewFloor();

      if (currentFloor === oldFloor) {
        setMessage("You are already at the lowest floor.");
      } else if (rewardMessage) {
        setMessage(`Moved from Floor ${oldFloor} to Floor ${currentFloor}. ${rewardMessage}`);
      } else {
        setMessage(`Moved from Floor ${oldFloor} to Floor ${currentFloor}.`);
      }
    }

    function regretDecisionAtEntrance() {
      const oldFloor = currentFloor;
      const targetFloor = Math.max(1, currentFloor - 2);
      const cost = Math.floor(player.gold * 0.20);

      if (oldFloor === targetFloor) {
        setMessage("There is nowhere safer to retreat.");
        renderLimitedShrineHome();

      player.gold = Math.max(0, player.gold - cost);
      currentFloor = targetFloor;

      gameMode = "roaming";
      startNewFloor();
      setMessage(`You retreated to Floor ${currentFloor} and lost ${cost} gold.`);
