            </div>
            <div class="shopRowValue">Gold</div>
          </button>

          <button class="shopRow" onclick="renderRuneCombine()">
            ${shopIconHtml("rune1.png", "runes")}
            <div class="shopRowText">
              <div class="shopRowName">Combine Runes</div>
              <div class="shopRowSub">Three matching runes become one higher rune</div>
            </div>
            <div class="shopRowValue">3 → 1</div>
          </button>

          <button class="shopRow" onclick="renderSocketUnlock()">
            ${shopIconHtml("rune6.png", "runes")}
            <div class="shopRowText">
              <div class="shopRowName">Add Sockets</div>
              <div class="shopRowSub">Open locked weapon and armor rune slots</div>
            </div>
            <div class="shopRowValue">Gold</div>
          </button>

          <button class="shopRow" onclick="renderEquipmentUpgrade()">
            ${shopIconHtml("", "items")}
            <div class="shopRowText">
              <div class="shopRowName">Upgrade Equipment</div>
              <div class="shopRowSub">Improve owned weapons and armor with gold</div>
            </div>
            <div class="shopRowValue">Gold</div>
          </button>

          <button class="shopRow shopBackRow" onclick="renderShrineHome()">
            ${shopIconHtml("", "items")}
            <div class="shopRowText">
              <div class="shopRowName">Back</div>
              <div class="shopRowSub">Return to Shrine</div>
            </div>
            <div class="shopRowValue">Shrine</div>
          </button>
        </div>
      `;
    }

    const SHOP_KEY_ITEMS = [
      { itemId: "generic_key", label: "Generic Key" },
      { itemId: "boss_key", label: "Boss Key" }
    ];

    function getAllShopConsumables() {
      if (typeof GAME_CONSUMABLES !== "undefined") {
        return Object.values(GAME_CONSUMABLES).filter(Boolean).map(item => ({ itemId: item.itemId }));
      }

      return [
        { itemId: "potion" },
        { itemId: "copper_potion" },
        { itemId: "silver_potion" },
        { itemId: "gold_potion" },
        { itemId: "mana_potion" },
        { itemId: "copper_mana_potion" },
        { itemId: "silver_mana_potion" },
        { itemId: "gold_mana_potion" },
        { itemId: "antidote" },
        { itemId: "smoke_bomb" },
        { itemId: "rejuvenation_potion" }
      ];
    }

    let currentShopGearStock = [];
    let currentShopGearIndex = 0;

    const SHOP_CATEGORIES = ["Consumables", "Equipment", "Keys"];
    const SHOP_PAGE_SIZE = 4;
    let shopBuyCategoryIndex = 0;
    let shopSellCategoryIndex = 0;
    let shopBuyPages = {};
    let shopSellPages = {};

    function getShopCategoryCycleHtml(mode, currentIndex) {
      const label = SHOP_CATEGORIES[currentIndex] || SHOP_CATEGORIES[0];
      return `
        <div class="itemCategoryCycle">
          <button class="statusCycleButton" onclick="cycleShopCategory('${mode}', -1)">‹</button>
          <div class="itemCategoryLabel">${label}</div>
          <button class="statusCycleButton" onclick="cycleShopCategory('${mode}', 1)">›</button>
        </div>
      `;
    }

    function cycleShopCategory(mode, delta) {
      const total = SHOP_CATEGORIES.length;

      if (mode === "buy") {
        shopBuyCategoryIndex = (shopBuyCategoryIndex + delta + total) % total;
        renderShrineBuy();
        return;
      }

      if (mode === "sell") {
        shopSellCategoryIndex = (shopSellCategoryIndex + delta + total) % total;
        renderShrineSell();
      }
    }

    function getShopCategoryKey(index) {
      return SHOP_CATEGORIES[index] || SHOP_CATEGORIES[0];
    }

    function getShopPageStore(mode) {
      return mode === "buy" ? shopBuyPages : shopSellPages;
    }

    function getShopPage(mode, category, itemCount) {
      const store = getShopPageStore(mode);
      const maxPage = Math.max(0, Math.ceil(Math.max(0, itemCount) / SHOP_PAGE_SIZE) - 1);
      const current = Math.max(0, Math.min(Number(store[category] || 0), maxPage));
      store[category] = current;
      return current;
    }

    function setShopPage(mode, delta) {
      const categoryIndex = mode === "buy" ? shopBuyCategoryIndex : shopSellCategoryIndex;
      const category = getShopCategoryKey(categoryIndex);
      const store = getShopPageStore(mode);
      store[category] = Math.max(0, Number(store[category] || 0) + delta);

      if (mode === "buy") {
        renderShrineBuy();
      } else {
        renderShrineSell();
      }
    }

    function getShopPageControlsHtml(mode, category, itemCount) {
      const maxPage = Math.max(0, Math.ceil(Math.max(0, itemCount) / SHOP_PAGE_SIZE) - 1);
      const current = getShopPage(mode, category, itemCount);
      const prevDisabled = current <= 0 ? "disabled" : "";
      const nextDisabled = current >= maxPage ? "disabled" : "";

      return `
        <div class="shopPageControls">
          <button class="uiButton" onclick="setShopPage('${mode}', -1)" ${prevDisabled}>‹</button>
          <div class="shopPageText">Page ${current + 1} / ${maxPage + 1}</div>
          <button class="uiButton" onclick="setShopPage('${mode}', 1)" ${nextDisabled}>›</button>
        </div>
      `;
    }

    function getShopPageItems(mode, category, entries) {
      const list = Array.isArray(entries) ? entries : [];
      const page = getShopPage(mode, category, list.length);
      const start = page * SHOP_PAGE_SIZE;
      return list.slice(start, start + SHOP_PAGE_SIZE);
    }

    function getItemBaseValue(itemId) {
      const consumable = typeof getConsumable === "function" ? getConsumable(itemId) : null;
      if (consumable && Number(consumable.value || consumable.price || consumable.goldValue)) {
        return Number(consumable.value || consumable.price || consumable.goldValue);
      }

      const equipment = getEquipItem(itemId);
      if (equipment && Number(equipment.value)) {
        return Number(equipment.value);
      }

      return 10;
    }

    function getBuyPrice(itemId) {
      return Math.max(1, Math.round(getItemBaseValue(itemId)));
    }

    function getSellPrice(itemId) {
      return Math.max(1, Math.floor(getItemBaseValue(itemId) * 0.5));
    }

    function getEquipmentShopIconHtml(item) {
      if (!item) return `<span class="shopIcon empty"></span>`;

      const iconPath = typeof getEquipmentIconPath === "function"
        ? getEquipmentIconPath(item)
        : (item.icon || item.image || "");

      if (!iconPath) return `<span class="shopIcon empty"></span>`;

      const finalPath = iconPath.startsWith("assets/") ? iconPath : `assets/${getEquipmentImageFolder(item)}/${iconPath}`;
      return `<img class="shopIcon" src="${finalPath}" alt="" onerror="this.style.display='none';">`;
    }

    function getRandomShopGearStock(count = 4) {
      const allEquipment = typeof getAllEquipment === "function" ? getAllEquipment() : [];
      const allowedCharacters = ["all", player.character].filter(Boolean);

      const candidates = allEquipment.filter(item => {
        if (!item || (item.slot !== "weapon" && item.slot !== "armor")) return false;
        if (item.character && !allowedCharacters.includes(String(item.character).toLowerCase())) return false;
        return true;
      });

      const pool = candidates.slice();
      const picks = [];

      while (pool.length && picks.length < count) {
        const index = Math.floor(Math.random() * pool.length);
        picks.push(pool.splice(index, 1)[0]);
      }

      return picks;
    }

    function ensureShopGearStock() {
      if (!Array.isArray(currentShopGearStock) || currentShopGearStock.length < 4) {
        currentShopGearStock = getRandomShopGearStock(4);
      }
      return currentShopGearStock;
    }

    function resetShopGearStock() {
      currentShopGearStock = getRandomShopGearStock(4);
      currentShopGearIndex = 0;
    }

    function renderShopBuySupplyRow(entry) {
      const item = typeof getConsumable === "function" ? getConsumable(entry.itemId) : null;
      if (!item) return "";
      const name = entry.label || item.itemName;
      const image = item.image || "";
      const price = getBuyPrice(entry.itemId);

      return `
        <button class="shopRow" onclick="buyShopItem('${entry.itemId}', ${price})">
          ${shopIconHtml(image, "items")}
          <div class="shopRowText">
            <div class="shopRowName">${name}</div>
            <div class="shopRowSub">${item.description || "Consumable"}</div>
          </div>
          <div class="shopRowValue">${price}g</div>
        </button>
      `;
    }

    function renderShopBuyKeyRow(entry) {
      const item = typeof getKeyItem === "function" ? getKeyItem(entry.itemId) : null;
      if (!item) return "";
      const price = Math.max(1, Number(item.value || 25) || 25);
      return `
        <button class="shopRow" onclick="buyShopKeyItem('${entry.itemId}', ${price})">
          ${shopIconHtml(item.image || "", "items")}
          <div class="shopRowText">
            <div class="shopRowName">${entry.label || item.itemName}</div>
            <div class="shopRowSub">${item.description || "Key item"}</div>
          </div>
          <div class="shopRowValue">${price}g</div>
        </button>
      `;
    }

    function renderShopBuyEquipmentRow(item) {
      const price = getBuyPrice(item.itemId);
      const owned = ownsEquipment(item.itemId);

      return `
        <button class="shopRow" onclick="buyShopEquipment('${item.itemId}', ${price})">
          ${getEquipmentShopIconHtml(item)}
          <div class="shopRowText">
            <div class="shopRowName">${item.itemName}</div>
            <div class="shopRowSub">${item.slot.toUpperCase()} · Req Lv ${item.reqLevel || 1} · ${owned ? "Owned" : "New"}</div>
          </div>
          <div class="shopRowValue">${price}g</div>
        </button>
      `;
    }
    function renderShopBuyEquipmentSelector(gearStock) {
      if (!Array.isArray(gearStock) || !gearStock.length) {
        return `<div class="smallNote">No equipment offers available.</div>`;
      }

      currentShopGearIndex = Math.max(0, Math.min(currentShopGearIndex, gearStock.length - 1));
      const item = gearStock[currentShopGearIndex];

      return `
        <div class="shopGearPager">
          <button class="uiButton shopGearArrow" onclick="shopGearPrev()" aria-label="Previous shop gear">‹</button>
          ${renderShopBuyEquipmentRow(item)}
          <button class="uiButton shopGearArrow" onclick="shopGearNext()" aria-label="Next shop gear">›</button>
        </div>
        <div class="shopGearCounter">Offer ${currentShopGearIndex + 1} / ${gearStock.length}</div>
      `;
    }

    function renderShopRerollGearRow() {
      return `
        <button class="shopRow shopBackRow" onclick="resetShopGearStock(); renderShrineBuy();">
          ${shopIconHtml("", "items")}
          <div class="shopRowText">
            <div class="shopRowName">Reroll Gear</div>
            <div class="shopRowSub">Refresh the four random weapon/armor offers</div>
          </div>
          <div class="shopRowValue">Free</div>
        </button>
      `;
    }

    function renderShopBuyEquipmentEntry(entry) {
      if (!entry) return "";
      if (entry.type === "reroll") return renderShopRerollGearRow();
      return renderShopBuyEquipmentRow(entry);
    }

    function shopGearPrev() {
      const stock = ensureShopGearStock();
      if (!stock.length) return;
      currentShopGearIndex = (currentShopGearIndex - 1 + stock.length) % stock.length;
      renderShrineBuy();
    }

    function shopGearNext() {
      const stock = ensureShopGearStock();
      if (!stock.length) return;
      currentShopGearIndex = (currentShopGearIndex + 1) % stock.length;
      renderShrineBuy();
    }


    function renderShrineBuy() {
      setOverlayTitle("Buy");
      hideInventoryTabs();

      const content = document.getElementById("inventoryContent");
      content.style.overflowY = "hidden";

      const gearStock = ensureShopGearStock();
      const consumables = getAllShopConsumables();
      const category = getShopCategoryKey(shopBuyCategoryIndex);

      let entries = [];
      let categoryHtml = "";

      if (category === "Consumables") {
        entries = consumables;
        const visible = getShopPageItems("buy", category, entries);
        categoryHtml = visible.length
          ? visible.map(renderShopBuySupplyRow).join("")
          : `<div class="smallNote">No consumables available.</div>`;
      } else if (category === "Equipment") {
        entries = gearStock.concat([{ type: "reroll" }]);
        const visible = getShopPageItems("buy", category, entries);
        categoryHtml = visible.length
          ? visible.map(renderShopBuyEquipmentEntry).join("")
          : `<div class="smallNote">No equipment offers available.</div>`;
      } else if (category === "Keys") {
        entries = SHOP_KEY_ITEMS;
        const visible = getShopPageItems("buy", category, entries);
        categoryHtml = visible.length
          ? visible.map(renderShopBuyKeyRow).join("")
          : `<div class="smallNote">No key items available.</div>`;
      }

      let html = `
        ${shrineHeroHtml("merchant")}
        <div class="menuHeader">
          <span>Buy</span>
          <span>Gold: ${player.gold}</span>
        </div>
        ${getShopCategoryCycleHtml("buy", shopBuyCategoryIndex)}
        <div class="shopPagedList">
          ${categoryHtml}
        </div>
        ${getShopPageControlsHtml("buy", category, entries.length)}
        <div class="shopMenuList">
          <button class="shopRow shopBackRow" onclick="renderOllieShop()">
            ${shopIconHtml("", "items")}
            <div class="shopRowText">
              <div class="shopRowName">Back</div>
              <div class="shopRowSub">Return to Shop</div>
            </div>
            <div class="shopRowValue">Shop</div>
          </button>
        </div>
      `;

      content.innerHTML = html;
    }

    function buyShopItem(itemId, price) {
      if (player.gold < price) {
        setMessage("Not enough gold.");
        return;
      }

      if (typeof addConsumable !== "function" || !addConsumable(player, itemId, 1)) {
        setMessage("That item is not available.");
        return;
      }

      player.gold -= price;
      setMessage(`Bought ${getItemDisplayName(itemId)} for ${price} gold.`);
      renderShrineBuy();
    }

    function buyShopKeyItem(itemId, price) {
      if (player.gold < price) {
        setMessage("Not enough gold.");
        return;
      }

      if (typeof addKeyItem !== "function" || !addKeyItem(player, itemId)) {
        setMessage("That key is not available.");
        return;
      }

      player.gold -= price;
      setMessage(`Bought ${getItemDisplayName(itemId)} for ${price} gold.`);
      renderShrineBuy();
    }

    function buyShopEquipment(itemId, price) {
      if (player.gold < price) {
        setMessage("Not enough gold.");
        return;
      }

      const item = getEquipItem(itemId);
      if (!item) {
        setMessage("That equipment is not available.");
        return;
      }

      if (ownsEquipment(itemId)) {
        setMessage(`You already own ${getEquipName(itemId)}.`);
        return;
      }

      player.gold -= price;
      const result = addEquipmentToInventory(itemId);
      setMessage(result && result.message ? result.message : `Bought ${getEquipName(itemId)}.`);
      renderShrineBuy();
    }

    function getSellableConsumableEntries() {
      ensureFullInventoryShape();
      return Object.entries(player.inventory.consumables || {})
        .filter(([, quantity]) => Number(quantity) > 0)
        .map(([itemId, quantity]) => ({ itemId, quantity, type: "consumable" }));
    }

    function isEquipmentCurrentlyEquipped(itemId) {
      return Object.values(player.equipment || {}).includes(itemId);
    }

    function getSellableEquipmentEntries() {
      ensureFullInventoryShape();
      return Object.entries(player.inventory.equipment || {})
        .filter(([itemId, record]) => record && record.owned && !isEquipmentCurrentlyEquipped(itemId))
        .map(([itemId, record]) => ({ itemId, record, type: "equipment" }));
    }


    function getSellableKeyEntries() {
      ensureFullInventoryShape();
      return Object.keys(player.inventory.keyitems || {})
        .filter(itemId => {
          const item = typeof getKeyItem === "function" ? getKeyItem(itemId) : null;
          return item && Number(item.value || 0) > 0;
        })
        .map(itemId => ({ itemId, type: "keyitem" }));
    }

    function renderSellConsumableRow(entry) {
      const item = typeof getConsumable === "function" ? getConsumable(entry.itemId) : null;
      const name = item ? item.itemName : entry.itemId;
      const image = item ? item.image : "";
      const price = getSellPrice(entry.itemId);

      return `
        <button class="shopRow" onclick="sellShopConsumable('${entry.itemId}', ${price})">
          ${shopIconHtml(image, "items")}
          <div class="shopRowText">
            <div class="shopRowName">${name}</div>
            <div class="shopRowSub">Owned x${entry.quantity}</div>
          </div>
          <div class="shopRowValue">${price}g</div>
        </button>
      `;
    }

    function renderSellEquipmentRow(entry) {
      const item = getEquipItem(entry.itemId);
      if (!item) return "";

      const price = getSellPrice(entry.itemId);
      const level = Number(entry.record.level || 0);
      const levelText = level > 0 ? ` +${level}` : "";

      return `
        <button class="shopRow" onclick="sellShopEquipment('${entry.itemId}', ${price})">
          ${getEquipmentShopIconHtml(item)}
          <div class="shopRowText">
            <div class="shopRowName">${item.itemName}${levelText}</div>
            <div class="shopRowSub">${item.slot.toUpperCase()} · Unequipped</div>
          </div>
          <div class="shopRowValue">${price}g</div>
        </button>
      `;
    }

    function renderSellKeyRow(entry) {
      const item = typeof getKeyItem === "function" ? getKeyItem(entry.itemId) : null;
      if (!item) return "";
      const price = Math.max(1, Math.floor(Number(item.value || 0) * 0.5));
      return `
        <button class="shopRow" onclick="sellShopKeyItem('${entry.itemId}', ${price})">
          ${shopIconHtml(item.image || "", "items")}
          <div class="shopRowText">
            <div class="shopRowName">${item.itemName}</div>
            <div class="shopRowSub">${item.description || "Key item"}</div>
          </div>
          <div class="shopRowValue">${price}g</div>
        </button>
      `;
    }

    function renderShrineSell() {
      setOverlayTitle("Sell");
      hideInventoryTabs();

      const content = document.getElementById("inventoryContent");
      content.style.overflowY = "hidden";

      const consumables = getSellableConsumableEntries();
      const equipment = getSellableEquipmentEntries();
      const keys = getSellableKeyEntries();
      const category = getShopCategoryKey(shopSellCategoryIndex);

      let entries = [];
      let categoryHtml = "";

      if (category === "Consumables") {
        entries = consumables;
        const visible = getShopPageItems("sell", category, entries);
        categoryHtml = visible.length
          ? visible.map(renderSellConsumableRow).join("")
          : `<div class="smallNote">No consumables to sell.</div>`;
      } else if (category === "Equipment") {
        entries = equipment;
        const visible = getShopPageItems("sell", category, entries);
        categoryHtml = visible.length
          ? visible.map(renderSellEquipmentRow).join("")
          : `<div class="smallNote">No unequipped equipment to sell.</div>`;
      } else if (category === "Keys") {
        entries = keys;
        const visible = getShopPageItems("sell", category, entries);
        categoryHtml = visible.length
          ? visible.map(renderSellKeyRow).join("")
          : `<div class="smallNote">No sellable keys.</div>`;
      }

      let html = `
        ${shrineHeroHtml("merchant")}
        <div class="menuHeader">
          <span>Sell</span>
          <span>Gold: ${player.gold}</span>
        </div>
        ${getShopCategoryCycleHtml("sell", shopSellCategoryIndex)}
        <div class="shopPagedList">
          ${categoryHtml}
        </div>
        ${getShopPageControlsHtml("sell", category, entries.length)}
        <div class="shopMenuList">
          <button class="shopRow shopBackRow" onclick="renderOllieShop()">
            ${shopIconHtml("", "items")}
            <div class="shopRowText">
              <div class="shopRowName">Back</div>
              <div class="shopRowSub">Return to Shop</div>
            </div>
            <div class="shopRowValue">Shop</div>
          </button>
        </div>
      `;

      content.innerHTML = html;
    }

    function sellShopConsumable(itemId, price) {
      ensureFullInventoryShape();
      const quantity = Number(player.inventory.consumables[itemId] || 0);

      if (quantity <= 0) {
        setMessage("You do not have that item.");
        renderShrineSell();
        return;
      }

      player.inventory.consumables[itemId] = quantity - 1;
      if (player.inventory.consumables[itemId] <= 0) delete player.inventory.consumables[itemId];

      player.gold += price;
      setMessage(`Sold ${getItemDisplayName(itemId)} for ${price} gold.`);
      renderShrineSell();
    }

    function sellShopKeyItem(itemId, price) {
      ensureFullInventoryShape();

      if (!player.inventory.keyitems[itemId]) {
        setMessage("You do not own that key.");
        renderShrineSell();
        return;
      }

      delete player.inventory.keyitems[itemId];
      player.gold += price;
      setMessage(`Sold ${getItemDisplayName(itemId)} for ${price} gold.`);
      renderShrineSell();
    }

    function sellShopEquipment(itemId, price) {
      ensureFullInventoryShape();

      if (isEquipmentCurrentlyEquipped(itemId)) {
        setMessage("Unequip that item before selling it.");
        renderShrineSell();
        return;
      }

      const record = player.inventory.equipment[itemId];
      if (!record || !record.owned) {
        setMessage("You do not own that item.");
        renderShrineSell();
        return;
      }

      delete player.inventory.equipment[itemId];
      player.gold += price;
      setMessage(`Sold ${getEquipName(itemId)} for ${price} gold.`);
      renderShrineSell();
    }

    function getCombinableRuneEntries() {
      if (typeof getRuneInventoryList !== "function") return [];

      return getRuneInventoryList(player)
        .map(normalizeVisibleRuneEntry)
        .filter(entry => entry.level < 3 && entry.available >= 3);
    }

    function renderRuneCombine() {
      setOverlayTitle("Combine Runes");
      hideInventoryTabs();

      const content = document.getElementById("inventoryContent");
      content.style.overflowY = "auto";
      const entries = getCombinableRuneEntries();

      let html = `
        ${shrineHeroHtml("merchant")}
        <div class="menuHeader">
          <span>Rune Combining</span>
          <span>3 matching → +1</span>
        </div>
        <div class="shopMenuList">
      `;

      if (!entries.length) {
        html += `
          <div class="smallNote">No rune stacks are ready to combine.</div>
        `;
      } else {
        html += entries.map(entry => `
          <button class="shopRow" onclick="combineRune('${entry.runeId}', ${entry.level})">
            ${shopIconHtml(entry.image, "runes")}
            <div class="shopRowText">
              <div class="shopRowName">${entry.displayName}</div>
              <div class="shopRowSub">${entry.statLine}</div>
            </div>
            <div class="shopRowValue">x${entry.quantity}</div>
          </button>
        `).join("");
      }

      html += `
          <button class="shopRow shopBackRow" onclick="renderOllieShop()">
            ${shopIconHtml("", "items")}
            <div class="shopRowText">
              <div class="shopRowName">Back</div>
              <div class="shopRowSub">Return to Ollie</div>
            </div>
            <div class="shopRowValue">Shop</div>
          </button>
        </div>
      `;

      content.innerHTML = html;
    }

    function combineRune(runeId, level) {
      if (level >= 3) {
        setMessage("That rune is already at maximum level.");
        return;
      }

      if (getRuneQuantity(player, runeId, level) < 3) {
        setMessage("You need three matching runes.");
        renderRuneCombine();
        return;
      }

      removeRune(player, runeId, level, 3);
      addRune(player, runeId, level + 1, 1);

      setMessage(`Combined into ${getRuneDisplayName(runeId, level + 1)}.`);
      renderRuneCombine();
    }

    function getUpgradeableEquipmentEntries() {
      ensureFullInventoryShape();
      return Object.entries(player.inventory.equipment || {})
        .filter(([itemId, record]) => {
          const item = getEquipItem(itemId);
          return record && record.owned && item && (item.slot === "weapon" || item.slot === "armor");
        })
        .map(([itemId, record]) => {
          const item = getEquipItem(itemId);
          const level = Number(record.level || 0);
          const tier = getEquipmentTierNumber(item);
          const cost = Math.max(10, Math.round((item.value || 10) * 0.75 + (level + 1) * tier * 25));
          return { itemId, item, record, level, cost };
        });
    }

    function renderEquipmentUpgrade() {
      setOverlayTitle("Upgrade Equipment");

      const content = document.getElementById("inventoryContent");

          <span>Gold: ${player.gold}</span>
        </div>
        <div class="oneColList">

        html += `<div class="smallNote">No owned weapons or armor to upgrade.</div>`;

    function upgradeEquipmentItem(itemId, cost) {
      const item = getEquipItem(itemId);
      const record = getOwnedEquipmentRecord(itemId);

      if (!item || !record || !record.owned) {
        setMessage("You do not own that equipment.");
        renderEquipmentUpgrade();
        return;
      }

      if (player.gold < cost) {
        setMessage("Not enough gold.");
        return;
      }

      player.gold -= cost;
      record.level = Number(record.level || 0) + 1;
      record.pending = 0;
      recalcDerivedStats();
      updateBars();
      setMessage(`${item.itemName} upgraded to +${record.level}.`);
      renderEquipmentUpgrade();
    }

    function renderSocketUnlock() {
      setOverlayTitle("Unlock Sockets");
      hideInventoryTabs();

      const content = document.getElementById("inventoryContent");
      content.style.overflowY = "auto";

      const rows = ["weapon", "armor"].map(slot => {
        const itemId = player.equipment[slot];
        if (!itemId) return null;

        const item = getEquipItem(itemId);
        const record = getOrCreateEquipmentRecord(itemId);
        normalizeEquipmentSockets(itemId);

        if (!item || !item.maxSockets) return null;

        const unlocked = record.socketsUnlocked || 0;
        const max = item.maxSockets || 0;
        const canUnlock = unlocked < max;
        const cost = 50 * (unlocked + 1);

        return { slot, itemId, item, record, unlocked, max, canUnlock, cost };
      }).filter(Boolean);

      let html = `
        ${shrineHeroHtml("merchant")}
        <div class="menuHeader">
          <span>Weapon / Armor Sockets</span>
          <span>Gold: ${player.gold}</span>
        </div>
        <div class="shopMenuList">
      `;

      if (!rows.length) {
        html += `<div class="smallNote">No socketable equipment is equipped.</div>`;
      } else {
        html += rows.map(row => `
          <button class="shopRow" ${row.canUnlock ? `onclick="unlockSocket('${row.slot}', ${row.cost})"` : ""}>
            ${shopIconHtml("rune6.png", "runes")}
            <div class="shopRowText">
              <div class="shopRowName">${getEquipName(row.itemId)}</div>
              <div class="shopRowSub">${row.unlocked}/${row.max} sockets unlocked</div>
            </div>
            <div class="shopRowValue">${row.canUnlock ? row.cost + "g" : "Max"}</div>
          </button>
        `).join("");
      }

      html += `
          <button class="shopRow shopBackRow" onclick="renderOllieShop()">
            ${shopIconHtml("", "items")}
            <div class="shopRowText">
              <div class="shopRowName">Back</div>
              <div class="shopRowSub">Return to Ollie</div>
            </div>
            <div class="shopRowValue">Shop</div>
          </button>
        </div>
      `;

      content.innerHTML = html;
    }

    function unlockSocket(slot, cost) {
      const itemId = player.equipment[slot];
      if (!itemId) return;

      const item = getEquipItem(itemId);
      const record = getOrCreateEquipmentRecord(itemId);

      normalizeEquipmentSockets(itemId);

      if (!item || !item.maxSockets) {
        setMessage("This item cannot hold runes.");
        return;
      }

      if ((record.socketsUnlocked || 0) >= item.maxSockets) {
        setMessage("All sockets are already unlocked.");
        renderSocketUnlock();
        return;
      }

      if (player.gold < cost) {
        setMessage("Not enough gold.");
        return;
      }

      player.gold -= cost;
      record.socketsUnlocked += 1;
      normalizeEquipmentSockets(itemId);

      setMessage(`Unlocked a socket on ${getEquipName(itemId)}.`);
      renderSocketUnlock();
    }

    function randomFromList(list) {
      if (!Array.isArray(list) || !list.length) return null;
      return list[Math.floor(Math.random() * list.length)];
    }

    function getChestConsumablePool() {
      const ids = ["potion", "copper_potion", "mana_potion", "copper_mana_potion", "antidote"];
      if (currentFloor >= 4) ids.push("silver_potion", "silver_mana_potion", "smoke_bomb");
      if (currentFloor >= 8) ids.push("gold_potion", "gold_mana_potion", "rejuvenation_potion");
      return ids.filter(id => typeof getConsumable === "function" && getConsumable(id));
    }

    function getChestEquipmentPool() {
      const allEquipment = typeof getAllEquipment === "function" ? getAllEquipment() : [];
      const allowedCharacters = ["all", player.character].filter(Boolean);
      return allEquipment.filter(item => {
        if (!item || (item.slot !== "weapon" && item.slot !== "armor")) return false;
        if (item.character && !allowedCharacters.includes(String(item.character).toLowerCase())) return false;
        return Number(item.reqLevel || 1) <= currentFloor + 2;
      });
    }

    function openCurrentChestLoot() {
      const messages = [];
      const baseGoldAmount = Math.max(5, Math.round(8 + Math.random() * 12 + currentFloor * (3 + Math.random() * 3)));
      const goldAmount = applyGoldFind(baseGoldAmount);
      player.gold += goldAmount;
      messages.push(`${goldAmount} gold`);

      const consumableId = randomFromList(getChestConsumablePool());
      if (consumableId && typeof addConsumable === "function") {
        addConsumable(player, consumableId, 1);
        messages.push(getItemDisplayName(consumableId));
      }

      if (Math.random() < 0.20) {
        const keyId = Math.random() < 0.82 ? "generic_key" : "boss_key";
        if (typeof addKeyItem === "function" && getKeyItem(keyId)) {
          addKeyItem(player, keyId);
          messages.push(getItemDisplayName(keyId));
        }
      }

      if (Math.random() < 0.30) {
        const item = randomFromList(getChestEquipmentPool());
        if (item) {
          const result = addEquipmentToInventory(item.itemId);
          if (result && result.ok) messages.push(item.itemName);
          else {
            const bonusGold = Math.max(1, getSellPrice(item.itemId));
            player.gold += bonusGold;
            messages.push(`${bonusGold} bonus gold`);
          }
        }
      }

      if (typeof getRuneInventoryList === "function" && typeof addRune === "function" && Math.random() < 0.25) {
        const runeIds = ["fehu", "uruz", "thurisaz", "ansuz", "raidho", "kenaz", "gebo", "hagalaz", "isa", "eihwaz", "algiz", "sowilo"]
          .filter(id => typeof getRuneById === "function" && getRuneById(id));
        const runeId = randomFromList(runeIds);
        if (runeId) {
          addRune(player, runeId, 0, 1);
          messages.push(getRuneDisplayName(runeId, 0));
        }
      }

      return messages;
    }

    function doAction() {
      if (menuIsOpen()) return;
      if (gameMode === "encounter") return;

      const currentTile = getTile(playerX, playerY);
      const key = tileKey(playerX, playerY);

      if (currentTile === "T") {
        if (triggeredTraps.has(key)) {
          setMessage("The trap has already been sprung.");
          return;
        }

        if (disabledTraps.has(key)) {
          setMessage("The trap is already disabled.");
          return;
        }

        disabledTraps.add(key);
        saveGameState();
        setMessage("Trap disabled.");
        return;
      }

      if (currentTile === "E") {
        openLimitedShrineMenu();
        return;
      }

      if (currentTile === "C") {
        if (openedChests.has(key)) {
          setMessage("The chest is already empty.");
          return;
        }

        openedChests.add(key);

        const lootMessages = openCurrentChestLoot();

        updateRoomView();
        playChestOpened();
        setMessage(`You opened the chest. Found ${lootMessages.join(", ")}.`);
        return;
      }
      if (currentTile === "S") {
        openShrineMenu();
        return;
      }

      const front = getRelativeTile(0);

      if (front.tile === "#") {
        setMessage("You inspect the wall.");
        return;
      }

      setMessage("You inspect the room.");
    }

    // =========================
    // ENCOUNTER TEST
    // =========================


    const COMBAT_TICK_MS = 250;
    let combatTimer = null;
    let playerAttackMeter = 100;
    let enemyAttackMeter = 0;

    function clampNumber(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function getPlayerSpeedValue() {
      const bonuses = typeof getEquipmentBonusTotals === "function" ? getEquipmentBonusTotals() : {};
      const base = Number(player.speed || player.spd || 0);
      const bonus = Number(bonuses.speed || bonuses.spd || 0);
      return Math.max(0, base + bonus);
    }

    function getMonsterSpeedValue(monster) {
      if (!monster) return 0;
      const value = monster.speed ?? monster.spd ?? monster.SPD ?? monster.Speed ?? 0;
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(0, n) : 0;
    }

    function getMonsterLevelValue(monster) {
      if (!monster) return 1;
      const value = monster.level ?? monster.lv ?? monster.monLevel ?? monster.Level ?? 1;
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(1, Math.floor(n)) : 1;
    }

    function getMonsterMaxHpValue(monster) {
      if (!monster) return 1;
      const value = monster.maxHp ?? monster.hp ?? monster.HP ?? monster.life ?? 1;
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(1, Math.floor(n)) : 1;
    }

    function getMonsterCurrentHpValue(monster) {
      if (!monster) return 0;
      const value = monster.currentHp ?? monster.hp ?? monster.HP ?? monster.life ?? 1;
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(0, Math.floor(n)) : 0;
    }

    function attackIntervalFromSpeed(speed) {
      // Slower base pacing, Speed still reduces delay, and there is no hard min/max cap.
      // Extreme Speed builds are allowed to break the curve by design.
      return 2600 / (1 + Math.max(0, Number(speed) || 0) * 0.04);
    }

    function meterGainForSpeed(speed) {
      return (COMBAT_TICK_MS / attackIntervalFromSpeed(speed)) * 100;
    }

    function updateMonsterHud() {
      const hudName = document.getElementById("monsterNameText");
      const hudLevel = document.getElementById("monsterLevelText");
      const hpBar = document.getElementById("monsterHpBar");
      const hpText = document.getElementById("monsterHpText");

      if (!currentEnemy) {
        if (hudName) hudName.textContent = "Monster";
        if (hudLevel) hudLevel.textContent = "Lv. 1";
        if (hpBar) hpBar.style.width = "0%";
        if (hpText) hpText.textContent = "HP 0 / 0";
        return;
      }

      const currentHp = getMonsterCurrentHpValue(currentEnemy);
      const maxHp = getMonsterMaxHpValue(currentEnemy);
      const level = getMonsterLevelValue(currentEnemy);
      const speed = getMonsterSpeedValue(currentEnemy);

      if (hudName) hudName.textContent = currentEnemy.monName || currentEnemy.name || "Monster";
      if (hudLevel) hudLevel.textContent = `Lv. ${level}`;
      if (hpBar) hpBar.style.width = `${clampNumber(currentHp / maxHp * 100, 0, 100)}%`;
      if (hpText) hpText.textContent = `HP ${currentHp} / ${maxHp} · SPD ${speed}`;
    }

    function updateCombatMetersUI() {
      const meter = document.getElementById("playerAttackMeter");
      const readyText = document.getElementById("attackReadyText");
      const attackButton = document.getElementById("attackButton");
      const enemyMeter = document.getElementById("monsterAttackMeter");
      const enemyAttackText = document.getElementById("monsterAttackText");

      const ready = playerAttackMeter >= 100;
      const enemyReadyPct = clampNumber(enemyAttackMeter, 0, 100);

      if (meter) meter.style.width = `${clampNumber(playerAttackMeter, 0, 100)}%`;
      if (readyText) readyText.textContent = ready ? "Ready" : "Wait";
      if (attackButton) {
        attackButton.classList.toggle("notReady", !ready);
        attackButton.textContent = ready ? "Attack" : "Wait";
      }

      if (enemyMeter) enemyMeter.style.width = `${enemyReadyPct}%`;
      if (enemyAttackText) enemyAttackText.textContent = `Attack ${Math.floor(enemyReadyPct)}%`;

      updateMonsterHud();
    }

    function stopCombatTimer() {
      if (combatTimer) {
        clearInterval(combatTimer);
        combatTimer = null;
      }
      playerAttackMeter = 100;
      enemyAttackMeter = 0;
      updateCombatMetersUI();
    }

    function startCombatTimer() {
      stopCombatTimer();
      playerAttackMeter = 100;
      enemyAttackMeter = 0;
      updateCombatMetersUI();

      combatTimer = window.setInterval(() => {
        if (gameMode !== "encounter" || !currentEnemy) {
          stopCombatTimer();
          return;
        }

        playerAttackMeter = Math.min(100, playerAttackMeter + meterGainForSpeed(getPlayerSpeedValue()));
        enemyAttackMeter += meterGainForSpeed(getMonsterSpeedValue(currentEnemy));

        if (enemyAttackMeter >= 100) {
          enemyAttackMeter -= 100;
          enemyAttack("");
        }

        updateCombatMetersUI();
      }, COMBAT_TICK_MS);
    }


    function startEncounter(poolId, encounterKey, tileType = "M") {
      let rolledMonster = null;

      // Preferred current loader: select by theme + floor directly.
      // This prevents errors like "No monster found for c15" when older pool ids are interpreted literally.
      if (typeof getRandomMonsterForTheme === "function") {
        rolledMonster = getRandomMonsterForTheme(currentFloorTheme, tileType, currentFloor);
      } else if (typeof getRandomMonsterFromPool === "function") {
        // Backward-compatible fallback for older monsterLoader.js.
        rolledMonster = getRandomMonsterFromPool(poolId, tileType);
      } else {
        setMessage("Monster loader not found. Check script load order.");
        return;
      }

      if (!rolledMonster) {
        setMessage(`No monster found for ${currentFloorTheme} floor ${currentFloor}.`);
        return;
      }

      currentEnemy = { ...rolledMonster };
      currentEnemyTileKey = encounterKey || null;

      currentEnemy.maxHp = getMonsterMaxHpValue(currentEnemy);
      currentEnemy.currentHp = getMonsterCurrentHpValue(currentEnemy);
      if (currentEnemy.currentHp <= 0 || currentEnemy.currentHp > currentEnemy.maxHp) {
        currentEnemy.currentHp = currentEnemy.maxHp;
      }

      const monsterImg = document.getElementById("monsterLayer");
      monsterImg.src = `assets/monsters/${currentEnemy.image}`;

      setMode("encounter");
      updateMonsterHud();
      startCombatTimer();
      showEncounterNotice(`${currentEnemy.monName} Lv ${currentEnemy.level || 1} appeared.`);
    }

    function getBaseAttackValue() {
      const bonuses = getEquipmentBonusTotals();
      return Math.max(1, 4 + Math.floor(player.str || 0) + (bonuses.atk || 0));
    }

    function getPlayerAttackValue() {
      const runeBonuses = getRuneBonusTotals();
      return Math.floor(getBaseAttackValue() * (1 + runeBonuses.attackPct / 100));
    }

    function getPlayerDefenseValue() {
      const bonuses = getEquipmentBonusTotals();
      const runeBonuses = getRuneBonusTotals();
      const base = Math.floor((player.vitality || 0) / 4) + (bonuses.def || 0);
      return Math.floor(base * (1 + runeBonuses.defensePct / 100));
    }

    function getMonsterType(monster) {
      return (monster.monsterType || monster.MonsterType || monster.type || "normal").toLowerCase();
    }

    function getMonsterResistance(monster, key) {
      if (monster[key] === undefined) return 0;
      const n = Number(monster[key]);
      return Number.isFinite(n) ? n : 0;
    }

    function applyResistance(amount, resistancePct) {
      return Math.max(0, Math.floor(amount * (1 - resistancePct / 100)));
    }

    function calculateAttackDamage(monster) {
      const runeBonuses = getRuneBonusTotals();
      const weaponAttack = getBaseAttackValue();
      const attack = getPlayerAttackValue();

      const enemyDefense = monster.defense || monster.MonDef || 0;
      const effectiveDefense = Math.floor(enemyDefense * (1 - runeBonuses.piercePct / 100));
      const physical = Math.max(1, attack - effectiveDefense);

      const fireBase = Math.floor(weaponAttack * runeBonuses.fireWeaponPct / 100);
      const shockBase = Math.floor(weaponAttack * runeBonuses.shockWeaponPct / 100);

      const fire = applyResistance(fireBase, getMonsterResistance(monster, "fireRes"));
      const shock = applyResistance(shockBase, getMonsterResistance(monster, "shockRes"));

      const monsterType = getMonsterType(monster);
      const typeBonusBase =
        (monsterType === "undead" ? runeBonuses.undeadBonusPct : 0) +
        (monsterType === "light" ? runeBonuses.lightBonusPct : 0);

      const typeBonus = Math.floor(weaponAttack * typeBonusBase / 100);
      const total = physical + fire + shock + typeBonus;

      return {
        physical,
        fire,
        shock,
        typeBonus,
        total,
        lifeSteal: Math.floor(total * runeBonuses.lifeStealPct / 100)
      };
    }


    const COMBAT_EFFECTS = {
      physical: ["slashwhite1.png", "slashwhite2.png"],
      fire: ["impactfire1.png", "impactfire2.png"],
      holy: ["impactgold1.png", "impactgold2.png"],
      ice: ["slashice1.png", "slashice2.png"]
    };

    function pickRandom(list) {
      if (!Array.isArray(list) || !list.length) return "";
      return list[Math.floor(Math.random() * list.length)];
    }

    function getAttackEffectType(damage) {
      if (damage && damage.fire > 0) return "fire";
      if (damage && damage.typeBonus > 0) return "holy";
      if (damage && damage.shock > 0) return "ice";
      return "physical";
    }

    function playCombatEffect(effectType = "physical", damageText = "") {
      const layer = document.getElementById("effectLayer");
      if (!layer) return;

      const effectFile = pickRandom(COMBAT_EFFECTS[effectType]) || pickRandom(COMBAT_EFFECTS.physical);
      layer.classList.remove("show");
      void layer.offsetWidth;
      layer.src = `assets/effects/${effectFile}`;
      layer.classList.add("show");

      window.setTimeout(() => {
        layer.classList.remove("show");
      }, 360);

      if (damageText) {
        showDamageNumber(damageText);
      }
    }

    function showDamageNumber(text) {
      const el = document.getElementById("damageNumber");
      if (!el) return;

      el.textContent = text;
      el.classList.remove("show");
      void el.offsetWidth;
      el.classList.add("show");

      window.setTimeout(() => {
        el.classList.remove("show");
      }, 680);
    }

    function playMonsterHit() {
      document.body.classList.remove("monsterHit");
      void document.body.offsetWidth;
      document.body.classList.add("monsterHit");

      window.setTimeout(() => {
        document.body.classList.remove("monsterHit");
      }, 280);
    }

    function playMonsterAttack() {
      document.body.classList.remove("monsterAttack");
      void document.body.offsetWidth;
      document.body.classList.add("monsterAttack");

      window.setTimeout(() => {
        document.body.classList.remove("monsterAttack");
      }, 280);
    }

    function playPlayerHit() {
      document.body.classList.remove("playerHit");
      void document.body.offsetWidth;
      document.body.classList.add("playerHit");

      window.setTimeout(() => {
        document.body.classList.remove("playerHit");
      }, 240);
    }

    function playerAttack() {
      if (!currentEnemy) return;

      if (playerAttackMeter < 100) {
        updateCombatMetersUI();
        return;
      }

      playerAttackMeter = 0;

      const damage = calculateAttackDamage(currentEnemy);
      currentEnemy.currentHp -= damage.total;

      playCombatEffect(getAttackEffectType(damage), String(damage.total));
      playMonsterHit();

      if (damage.lifeSteal > 0) {
        player.hp = Math.min(player.maxHp, player.hp + damage.lifeSteal);
        updateBars();
      }

      updateMonsterHud();
      updateCombatMetersUI();

      if (currentEnemy.currentHp <= 0) {
        defeatEnemy();
        return;
      }

      // Hit feedback is handled by the damage number/effect layer during encounters.
    }

    function playerDefend() {
      if (!currentEnemy) return;
      playerAttackMeter = Math.min(100, playerAttackMeter + 35);
      updateCombatMetersUI();
    }

    function runAway() {
      stopCombatTimer();
      stopCombatTimer();
      currentEnemy = null;
      currentEnemyTileKey = null;
      setMode("roaming");
      updateRoomView();
      setMessage("You ran away.");
    }

    function handlePlayerDeath() {
      stopCombatTimer();
      setMode("roaming");
      currentEnemy = null;
      currentEnemyTileKey = null;
      currentEnemyDefeatedThisTurn = false;

      ensureFullInventoryShape();

      const goldBefore = Math.max(0, Math.floor(Number(player.gold) || 0));
      const goldPenalty = Math.floor(goldBefore * 0.25);
      player.gold = Math.max(0, goldBefore - goldPenalty);

      if (!player.inventory.consumables) player.inventory.consumables = {};
      player.inventory.consumables.potion = Number(player.inventory.consumables.potion || 0) + 10;

      player.hp = player.maxHp;
      player.mp = player.maxMp;

      startNewFloor();
      updateBars();
      updateHud();
      saveGameState();

      setMessage(`You were defeated. Lost ${goldPenalty} gold and received 10 Potions.`);
    }

    function enemyAttack(prefix) {
      if (!currentEnemy) return;

      playMonsterAttack();

      const damage = Math.max(1, currentEnemy.attack - getPlayerDefenseValue());
      player.hp -= damage;
      playPlayerHit();
      updateBars();

      if (player.hp <= 0) {
        handlePlayerDeath();
        return;
      }

      showDamageNumber(`-${damage}`);
    }

    function defeatEnemy() {
      const defeatedId = currentEnemy.monId;
      const defeatedName = currentEnemy.monName;
      const exp = getMonsterExpReward(currentEnemy);
      const expResult = gainExp(exp);

      if (currentEnemyTileKey) {
        clearedMonsters.add(currentEnemyTileKey);
      }

      let drops = [];
      if (typeof rollMonsterDrops === "function") {
        drops = rollMonsterDrops(defeatedId);
      }

      const foundMessages = [];

      drops.forEach(drop => {
        if (drop.type === "gold") {
          const goldAmount = applyGoldFind(drop.amount);
          player.gold += goldAmount;
          foundMessages.push(`${goldAmount} gold`);
        } else {
          const result = addLootItem(drop.id);
          foundMessages.push(result && result.message ? result.message : drop.name);
        }
      });

      const dropText = foundMessages.length ? foundMessages.join(", ") : "nothing";
      const levelText = expResult.levelsGained > 0
        ? ` Level up! Now level ${player.level}.`
        : "";

      stopCombatTimer();
      currentEnemy = null;
      currentEnemyTileKey = null;
      setMode("roaming");
      updateRoomView();
      updateBars();
      setMessage(`${defeatedName} defeated. Gained ${exp} EXP.${levelText} Found ${dropText}.`);
    }

    let activeItemCategory = "consumables";

    function getInventoryPage(category, totalItems) {
      const maxPage = Math.max(0, Math.ceil(totalItems / INVENTORY_PAGE_SIZE) - 1);
      inventoryPage[category] = Math.max(0, Math.min(inventoryPage[category] || 0, maxPage));
      return inventoryPage[category];
    }

    function setInventoryPage(category, direction) {
      inventoryPage[category] = (inventoryPage[category] || 0) + direction;
      renderItemsTab();
    }

    function renderPager(category, totalItems) {
      const maxPage = Math.max(0, Math.ceil(totalItems / INVENTORY_PAGE_SIZE) - 1);
      const current = getInventoryPage(category, totalItems);

      if (maxPage <= 0) return "";

      return `
        <div class="pageControls">
          <button class="uiButton" onclick="setInventoryPage('${category}', -1)" ${current <= 0 ? "disabled" : ""}>Prev</button>
          <div class="pageText">${current + 1} / ${maxPage + 1}</div>
          <button class="uiButton" onclick="setInventoryPage('${category}', 1)" ${current >= maxPage ? "disabled" : ""}>Next</button>
        </div>
      `;
    }

    function sliceInventoryPage(category, list) {
      const page = getInventoryPage(category, list.length);
      const start = page * INVENTORY_PAGE_SIZE;
      return list.slice(start, start + INVENTORY_PAGE_SIZE);
    }

    function setStatusPage(page) {
      statusPage = STATUS_PAGES.includes(page) ? page : "core";
      renderStatusTab();
    }

    function cycleStatusPage(direction) {
      const currentIndex = STATUS_PAGES.indexOf(statusPage);
      const safeIndex = currentIndex >= 0 ? currentIndex : 0;
      const nextIndex = (safeIndex + direction + STATUS_PAGES.length) % STATUS_PAGES.length;
      statusPage = STATUS_PAGES[nextIndex];
      renderStatusTab();
    }

    function renderStatusCycle() {
      return `
        <div class="statusCycleRow">
          <button class="statusCycleButton" onclick="cycleStatusPage(-1)">&lt;</button>

    function getSlotPage(slot, totalItems) {

    function getPrimaryItemValue(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return "";
      const stats = getEquipStats(itemId);

      if (item.slot === "weapon") {
        const parts = [];
        if (stats.atk) parts.push(`Atk ${stats.atk}`);
        if (stats.mag) parts.push(`Mag ${stats.mag}`);
        if (item.maxSockets) parts.push(`${item.maxSockets}S`);
        return parts.join(" · ");
      }

      if (item.slot === "armor") {
        const parts = [];
        if (stats.def) parts.push(`Def ${stats.def}`);
        if (stats.mdef) parts.push(`MDef ${stats.mdef}`);
        if (item.maxSockets) parts.push(`${item.maxSockets}S`);
        return parts.join(" · ");
      }

      const parts = [];
      if (stats.atk) parts.push(`Atk ${stats.atk}`);
      if (stats.def) parts.push(`Def ${stats.def}`);
      if (stats.mag) parts.push(`Mag ${stats.mag}`);
      if (stats.mdef) parts.push(`MDef ${stats.mdef}`);
      if (stats.hp) parts.push(`HP ${stats.hp}`);
      if (stats.mp) parts.push(`MP ${stats.mp}`);
      if (stats.speed) parts.push(`Spd ${stats.speed}`);
      return parts.slice(0, 2).join(" · ");
    }

    function detailSection(title, bodyHtml) {
      return `

          ${title ? `<div class="detailBlockTitle">${title}</div>` : ""}
          ${bodyHtml}
        </div>
      `;

    function titleCaseText(value) {
      return String(value || "")
        .replace(/[_-]+/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function getEquipmentDetailTitle(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return getEquipName(itemId);

      const reqLevel = item.reqLevel || 1;
      const upgradeLevel = getEquipmentLevel(itemId);
      const upgradeText = upgradeLevel > 0 ? ` +${upgradeLevel}` : "";
      return `${item.itemName}${upgradeText} Lv${reqLevel}`;
    }

    function getEquipmentBaseStat(item, key) {
      if (!item) return 0;
      return Number(item[key] || 0) || 0;
    }

    function getEquipmentTotalStat(itemId, key) {
      const stats = getEquipStats(itemId);
      return Number(stats[key] || 0) || 0;
    }

    function equipmentBreakdownLine(label, item, itemId, key, suffix = "") {
      const base = getEquipmentBaseStat(item, key);
      const total = getEquipmentTotalStat(itemId, key);
      if (!base && !total) return "";

      const bonus = total - base;
      const bonusText = bonus >= 0 ? `+ ${bonus}` : `- ${Math.abs(bonus)}`;
      return detailLine(label, `${base}${suffix} ${bonusText}${suffix} = ${total}${suffix}`);
    }

    function renderEquipmentStatBreakdown(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return detailLine("Stats", "No stats");

      const rows = [
        equipmentBreakdownLine("Atk", item, itemId, "atk"),
        equipmentBreakdownLine("Mag", item, itemId, "mag"),
        equipmentBreakdownLine("Def", item, itemId, "def"),
        equipmentBreakdownLine("MDef", item, itemId, "mdef"),
        equipmentBreakdownLine("HP", item, itemId, "hp"),
        equipmentBreakdownLine("MP", item, itemId, "mp"),
        equipmentBreakdownLine("Speed", item, itemId, "speed"),
        equipmentBreakdownLine("Crit", item, itemId, "crit", "%"),
        equipmentBreakdownLine("Dodge", item, itemId, "dodge", "%"),
        equipmentBreakdownLine("Gold Find", item, itemId, "goldFind", "%")
      ].filter(Boolean).join("");

      return rows || detailLine("Stats", "No stats");
    }

    function renderEquipmentSocketDetail(itemId) {
      const item = getEquipItem(itemId);
      const record = getOwnedEquipmentRecord(itemId);

      if (!item || !item.maxSockets) {
        return detailSection("Sockets", detailLine("Sockets", "None"));
      }

      if (record) normalizeEquipmentSockets(itemId);

      const current = record ? (record.socketsUnlocked || 0) : 0;
      const max = item.maxSockets || 0;

      return detailSection("Sockets", detailLine("Current / Max", `${current} / ${max}`));
    }

    function renderEquipmentRunesDetail(itemId) {
      const item = getEquipItem(itemId);
      const record = getOwnedEquipmentRecord(itemId);

      if (!item || !item.maxSockets) {
        return detailSection("Runes", `<div class="smallNote">No rune sockets.</div>`);
      }

      if (record) normalizeEquipmentSockets(itemId);

      const current = record ? (record.socketsUnlocked || 0) : 0;
      const max = item.maxSockets || 0;
      const rows = [];

      for (let i = 0; i < max; i++) {
        const socket = record && i < current ? record.sockets[i] : null;
        let text = "Locked";

        if (i < current) {
          text = socket && socket.runeId
            ? `${getRuneDisplayName(socket.runeId, socket.level || 0)} — ${getShortRuneStatLine(socket.runeId, socket.level || 0).replace("Attack", "Atk").replace("Defense", "Def").replace("Magic", "Mag").replace("Speed", "Spd")}`
            : "Empty";
        }

        rows.push(`
          <div class="detailRuneRow">
            <span class="detailLabel">${i + 1}</span>
            <span class="detailValue">${text}</span>
          </div>
        `);
      }

      return detailSection("Runes", `<div class="detailRuneList">${rows.join("")}</div>`);
    }

    function getEquipmentDescriptionText(item) {
      if (!item) return "No description available.";
      const direct = item.description || item.desc || item.flavorText || item.flavor;
      if (direct) return direct;

      const rarity = titleCaseText(item.rarity || "common");
      const tier = titleCaseText(item.tier || "");
      const slot = titleCaseText(item.slot || "equipment");
      const owner = item.character && item.character !== "all" ? ` for ${titleCaseText(item.character)}` : "";
      const tierText = tier ? `${tier} ` : "";
      return `${rarity} ${tierText}${slot}${owner}.`;
