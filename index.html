<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dungeon Test</title>

  <style>
    :root {
      --app-width: 390px;
      --game-body-height: 680px;

      --accent: #d6a84f;
      --text-main: #ffffff;

      --button-bg: rgba(0,0,0,0.58);
      --button-border: 1px solid rgba(214,168,79,0.85);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #050505;
      color: var(--text-main);
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 8px;
      overflow-x: hidden;
    }

    .pageShell {
      width: min(var(--app-width), 96vw);
      margin: 0 auto;
    }

    .gameBody {
      position: relative;
      width: 100%;
      height: var(--game-body-height);
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }

    .dungeonStage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    .roomLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }

    .layer-room { z-index: 1; }

    .layer-monster {
      z-index: 5;
      object-fit: fill;
      transform: none;
      transform-origin: center center;
      display: none;
    }

    .layer-border { z-index: 20; display: none; }

    .moveZone {
      position: absolute;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      z-index: 30;
    }

    .moveForward { top: 0; left: 24%; width: 52%; height: 32%; }

    .moveLeft { top: 28%; left: 0; width: 28%; height: 44%; }

    .moveRight { top: 28%; right: 0; width: 28%; height: 44%; }

    .moveBack { left: 24%; bottom: 0; width: 52%; height: 28%; }

    .messageBox {
      position: absolute;
      left: 38px;
      right: 38px;
      bottom: 118px;
      z-index: 65;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid rgba(214,168,79,0.5);
      border-radius: 10px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 13px;
      line-height: 1.3;
      text-align: center;
      text-shadow: 0 0 4px #000;
      pointer-events: none;
    }

    .hud {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 30px;
      z-index: 60;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      pointer-events: none;
    }

    .statBlock,
    .actionBlock,
    .combatBlock {
      pointer-events: auto;
      color: #fff;
      text-shadow: 0 0 4px #000;
      font-size: 14px;
      line-height: 1.35;
    }

    .statBlock {
      display: grid;
      gap: 6px;
      align-content: end;
      text-align: left;
    }

    .statLine {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: center;
    }

    .bar {
      height: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 0 4px rgba(0,0,0,0.7);
    }

    .barFill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
    }

    #hpBar {
      background: linear-gradient(90deg, rgba(150,18,18,0.96), rgba(245,70,52,0.96));
    }

    #mpBar {
      background: linear-gradient(90deg, rgba(30,76,170,0.96), rgba(85,164,255,0.96));
    }

    .actionBlock {
      display: grid;
      gap: 8px;
      align-content: end;
      justify-items: center;
    }

    .combatBlock {
      display: none;
    }

    .combatMainButtons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-self: end;
    }

    .combatBeltColumn {
      display: grid;
      grid-template-rows: repeat(4, 34px) 24px;
      gap: 5px;
      align-self: end;
    }

    .combatRunButton {
      min-height: 24px;
      padding: 2px 4px;
      font-size: 11px;
      border-radius: 6px;
    }

    .beltButton {
      position: relative;
      min-height: 34px;
      width: 42px;
      padding: 2px;
      font-size: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .beltButton.empty {
      opacity: 0.18;
      border-color: rgba(214,168,79,0.12);
      background: rgba(0,0,0,0.12);
    }

    .beltItemIcon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.9));
      pointer-events: none;
    }

    .beltQtyBadge {
      position: absolute;
      right: 2px;
      bottom: 1px;
      min-width: 14px;
      padding: 0 3px;
      border-radius: 999px;
      background: rgba(0,0,0,0.76);
      color: #fff;
      font-size: 9px;
      line-height: 13px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.25);
      pointer-events: none;
    }

    .uiButton {
      width: 100%;
      min-height: 32px;
      padding: 6px 8px;
      border: var(--button-border);
      border-radius: 8px;
      background: var(--button-bg);
      color: var(--accent);
      font-weight: bold;
      cursor: pointer;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.65);
    }

    .uiButton:active { transform: scale(0.98); }

    .debugLine {
      position: absolute;
      top: 12px;
      left: 28px;
      right: 28px;
      z-index: 61;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(0,0,0,0.5);
      color: rgba(255,255,255,0.75);
      font-size: 11px;
      text-align: center;
      pointer-events: none;
    }


    /* Patch: remove room/debug/facing UI from normal play. */
    .debugLine,
    .facingBadge {
      display: none !important;
    }

    .overlay {
      position: absolute;
      inset: 6px;
      z-index: 90;
      display: none;
      padding: 8px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      background: rgba(0,0,0,0.92);
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      color: #fff;
    }

    .overlay.show { display: block; }

    .overlayTitle {
      color: var(--accent);
      font-weight: bold;
      font-size: 18px;
      text-align: center;
      margin-bottom: 6px;
      padding: 0 36px;
      line-height: 26px;
      min-height: 26px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .tabContent {
      height: 520px;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 5px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      font-size: 13px;
      line-height: 1.35;
      white-space: normal;
    }

    .menuHeader {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      color: rgba(255,255,255,0.82);
      font-size: 12px;
    }

    .sotnRow {
      width: 100%;
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 8px;
      align-items: center;
      min-height: 34px;
      margin: 0 0 5px 0;
      padding: 7px 8px;
      border: 1px solid rgba(214,168,79,0.35);
      border-radius: 7px;
      background: rgba(0,0,0,0.34);
      color: #fff;
      text-align: left;
      cursor: pointer;
    }

    .sotnRow:active { transform: scale(0.99); }

    .sotnSlot {
      color: var(--accent);
      font-weight: bold;
      font-size: 12px;
    }

    .sotnValue {
      color: #fff;
      font-size: 12px;
      line-height: 1.25;
    }

    .itemRow {
      width: 100%;
      display: block;
      min-height: 42px;
      margin: 0 0 6px 0;
      padding: 8px;
      border: 1px solid rgba(214,168,79,0.42);
      border-radius: 7px;
      background: rgba(0,0,0,0.36);
      color: #fff;
      text-align: left;
      cursor: pointer;
    }

    .itemRow.equipped {
      border-color: #fff;
      background: rgba(214,168,79,0.20);
    }

    .itemRow.locked {
      opacity: 0.45;
      border-color: rgba(255,255,255,0.18);
    }

    .itemNameLine {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--accent);
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .itemDescLine {
      color: rgba(255,255,255,0.82);
      font-size: 12px;
      line-height: 1.35;
    }

    .smallNote {
      color: rgba(255,255,255,0.72);
      font-size: 12px;
      margin: 6px 0;
    }


    .pagedList {
      display: grid;
      gap: 3px;
    }

    .twoColList {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 5px;
      row-gap: 3px;
    }

    .oneColList {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .oneColList .compactRow {
      grid-template-columns: 48px 1fr;
      min-height: 44px;
    }

    .oneColList .compactIcon {
      width: 40px;
      height: 40px;
    }

    .compactRow {
      width: 100%;
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 5px;
      align-items: center;
      min-height: 40px;
      margin: 0 0 3px 0;
      padding: 3px 5px;
      border: 1px solid rgba(214,168,79,0.35);
      border-radius: 4px;
      background: rgba(0,0,0,0.28);
      color: #fff;
      text-align: left;
      cursor: pointer;
    }

    .compactRow.locked {
      opacity: 0.45;
      border-color: rgba(255,255,255,0.18);
    }

    .compactRow.equipped {
      border-color: #fff;
      background: rgba(214,168,79,0.20);
    }

    .compactIcon {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 0 3px rgba(0,0,0,0.85));
    }

    .compactIcon.empty {
      opacity: 0.28;
    }

    .compactName {
      color: #fff;
      font-weight: normal;
      font-size: 12px;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0.2px;
    }

    .compactSub {
      display: block;
      color: rgba(255,255,255,0.68);
      font-size: 10.5px;
      line-height: 1.15;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compactQty {
      display: none;
    }


    .compactIconWrap {
      position: relative;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .compactIconWrap .compactIcon,
    .compactIconWrap .equipIcon {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .compactQtyBadge {
      position: absolute;
      right: -2px;
      bottom: -2px;
      min-width: 15px;
      height: 15px;
      padding: 0 3px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.38);
      background: rgba(0,0,0,0.82);
      color: #fff;
      font-size: 9px;
      line-height: 13px;
      text-align: center;
      font-weight: bold;
      pointer-events: none;
    }

    .pageControls {
      display: grid;
      grid-template-columns: 58px auto 58px;
      justify-content: center;
      gap: 5px;
      align-items: center;
      margin: 5px 0 0;
    }

    .pageText {
      color: rgba(255,255,255,0.78);
      font-size: 12px;
      text-align: center;
      min-width: 70px;
    }


    .statusPageTabs {
      display: none;
    }

    .statusCard {
      position: relative;
      height: 100%;
      min-height: 100%;
      margin-bottom: 0;
      max-width: 100%;
      overflow: hidden;
      background-image: var(--status-pose, none);
      background-size: auto 100%;
      background-position: left bottom;
      background-repeat: no-repeat;
    }

    .statusPoseBox,
    .statusPose {
      display: none;
    }

    .statusPoseFallback {
      color: rgba(255,255,255,0.55);
      font-weight: bold;
      font-size: 18px;
      text-align: center;
    }

    .statusInfoBox {
      position: absolute;
      top: 0;
      right: 0;
      width: 38%;
      max-width: 156px;
      border: 1px solid rgba(214,168,79,0.35);
      border-radius: 7px;
      background: rgba(0,0,0,0.42);
      padding: 7px;
      min-width: 0;
      overflow: hidden;
      backdrop-filter: blur(1px);
    }

    .statusName {
      color: var(--accent);
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .statusLevel {
      color: rgba(255,255,255,0.86);
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .statusStatGrid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
      font-size: 12px;
      line-height: 1.1;
    }

    .statusStat {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 3px;
      align-items: center;
    }

    .statusLabel {
      color: rgba(255,255,255,0.66);
      font-weight: bold;
    }

    .statusValue {
      color: #fff;
      text-align: right;
      min-width: 34px;
    }

    .statusCycleRow {
      display: grid;
      grid-template-columns: 28px 1fr 28px;
      gap: 4px;
      align-items: center;
      margin-top: 10px;
    }

    .statusCycleButton {
      min-height: 25px;
      padding: 2px 0;
      border: 1px solid rgba(214,168,79,0.55);
      border-radius: 5px;
      background: rgba(0,0,0,0.32);
      color: var(--accent);
      font-weight: bold;
      cursor: pointer;
    }

    .statusCycleLabel {
      color: var(--accent);
      text-align: center;
      font-size: 12px;
      font-weight: bold;
    }


    .itemCategoryCycle {
      display: grid;
      grid-template-columns: 32px 1fr 32px;
      gap: 5px;
      align-items: center;
      margin: 6px 0 8px;
    }

    .itemCategoryLabel {
      color: var(--accent);
      text-align: center;
      font-size: 13px;
      font-weight: bold;
    }

    .statusEquipList {
      display: grid;
      gap: 3px;
    }

    .statusEquipRow {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 6px;
      align-items: center;
      min-height: 25px;
      padding: 3px 6px;
      border: 1px solid rgba(214,168,79,0.25);
      border-radius: 4px;
      background: rgba(0,0,0,0.22);
      font-size: 12px;
    }

    .statusGridPage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .statusMetric {
      min-height: 35px;
      padding: 6px;
      border: 1px solid rgba(214,168,79,0.28);
      border-radius: 5px;
      background: rgba(0,0,0,0.24);
    }

    .statusMetricName {
      color: rgba(255,255,255,0.66);
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .statusMetricValue {
      color: #fff;
      font-size: 13px;
    }


    .equipGrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 8px;
    }

    .equipGridButton {
      position: relative;
      min-height: 74px;
      padding: 5px 4px;
      border: 1px solid rgba(214,168,79,0.38);
      border-radius: 7px;
      background: rgba(0,0,0,0.30);
      color: #fff;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .equipGridButton.wideLeft,
    .equipGridButton.wideRight {
      min-height: 165px;
    }

    .equipGridButton.wideLeft { grid-column: 1 / span 2; }
    .equipGridButton.wideRight { grid-column: 3 / span 2; }

    .equipGridButton.wideLeft .equipGridIcon,
    .equipGridButton.wideLeft .equipGridIcon.empty {
      width: 116px;
      height: 116px;
    }

    .equipGridButton.wideRight .equipGridIcon,
    .equipGridButton.wideRight .equipGridIcon.empty {
      width: 154px;
      height: 154px;
    }

    .equipGridLabel {
      position: relative;
      z-index: 2;
      width: 100%;
      color: var(--accent);
      font-size: 10.5px;
      font-weight: bold;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 0 4px #000, 0 0 6px #000;
    }

    .equipGridName {
      position: relative;
      z-index: 2;
      width: 100%;
      color: rgba(255,255,255,0.92);
      font-size: 10.5px;
      font-weight: bold;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 4px #000, 0 0 7px #000;
    }

    .equipGridIcon {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 50%;
      width: 46px;
      height: 46px;
      object-fit: contain;
      opacity: 0.92;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.95));
      pointer-events: none;
    }

    .equipGridIcon.empty {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 5px;
      opacity: 0.18;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .equipCompactList {
      display: grid;
      gap: 4px;
    }

    .equipSlotRow {
      width: 100%;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 6px;
      align-items: center;
      min-height: 30px;
      padding: 4px 6px;
      border: 1px solid rgba(214,168,79,0.38);
      border-radius: 5px;
      background: rgba(0,0,0,0.30);
      color: #fff;
      text-align: left;
      cursor: pointer;
    }

    .equipSlotLabel {
      color: var(--accent);
      font-size: 12px;
      font-weight: bold;
    }

    .equipSlotValue {
      color: #fff;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .closeButton {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 34px;
      min-height: 28px;
      padding: 2px 0;
      z-index: 100;
      font-size: 16px;
      line-height: 1;
    }

    body.encounterMode .layer-monster { display: block; }
    body.encounterMode .actionBlock { display: none; }
    body.encounterMode .combatBlock { display: contents; }

    body.encounterMode .hud {
      grid-template-columns: 1fr 46px;
      grid-template-rows: auto auto auto;
      column-gap: 8px;
      row-gap: 0;
      align-items: end;
      bottom: 22px;
      left: 18px;
      right: 18px;
    }

    body.encounterMode .statBlock {
      grid-column: 1;
      grid-row: 1;
      gap: 3px;
      padding: 5px 8px 2px;
      border: 1px solid rgba(213,170,62,0.42);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      background: rgba(0,0,0,0.28);
      box-shadow: 0 0 10px rgba(0,0,0,0.35);
    }

    body.encounterMode .statLine {
      grid-template-columns: 34px 1fr;
      gap: 7px;
      font-size: 12px;
      color: #fff;
      text-shadow: 0 0 4px #000;
    }

    body.encounterMode .attackMeterWrap {
      grid-column: 1;
      grid-row: 2;
      align-self: end;
      padding: 2px 8px 5px;
      border: 1px solid rgba(213,170,62,0.42);
      border-top: none;
      border-radius: 0 0 10px 10px;
      background: rgba(0,0,0,0.28);
      grid-template-columns: 34px 1fr;
    }

    body.encounterMode .combatMainButtons {
      grid-column: 1;
      grid-row: 3;
      margin-top: 5px;
    }

    body.encounterMode .combatBeltColumn {
      grid-column: 2;
      grid-row: 1 / 4;
      align-self: start;
      justify-items: end;
      transform: translateY(-70px);
    }

    body.encounterMode .moveZone,
    body.encounterMode .helpButton,
    body.encounterMode .exitMarker,
    body.encounterMode .facingBadge {
      display: none;
      pointer-events: none;
    }

    body.encounterMode .messageBox {
      display: none;
    }

    body.encounterMode .messageBox.combatNotice {
      display: block;
      bottom: 152px;
      left: 42px;
      right: 42px;
      min-height: 30px;
      padding: 6px 8px;
      font-size: 12px;
      opacity: 0.92;
    }
  
    .helpButton {
      position: absolute;
      top: 12px;
      right: 28px;
      z-index: 62;
      width: 58px;
      min-height: 26px;
      padding: 3px 6px;
      border: 1px solid rgba(214,168,79,0.75);
      border-radius: 7px;
      background: rgba(0,0,0,0.55);

    .layer-effect {
      z-index: 12;
      object-fit: contain;
      display: none;
      opacity: 0;
      transform: translateY(16px) scale(0.92);
      pointer-events: none;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.65));
    }

    .layer-effect.show {
      display: block;
      animation: effectFlash 340ms ease-out forwards;
    }

    @keyframes effectFlash {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(0.70) rotate(-3deg);
      }
      18% {
        opacity: 1;
        transform: translateY(16px) scale(0.96) rotate(1deg);

      100% {
        opacity: 0;
        transform: translateY(16px) scale(1.12) rotate(4deg);
      }

    body.monsterAttack .layer-monster {
      animation: monsterLunge 260ms ease-out;
    }

    body.playerHit .dungeonStage {
      animation: playerHitShake 220ms ease-out;
    }

    @keyframes monsterHitJolt {
      0% { transform: translateX(0) scale(1) rotate(0deg); }
      30% { transform: translateX(-5px) scale(1.015) rotate(-0.8deg); }
      65% { transform: translateX(4px) scale(0.995) rotate(0.8deg); }
      100% { transform: translateX(0) scale(1) rotate(0deg); }
    }

    @keyframes monsterLunge {
      0% { transform: scale(1); }
      45% { transform: scale(1.045); }
      100% { transform: scale(1); }
    }

    @keyframes playerHitShake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-2px); }
      100% { transform: translateX(0); }

    @keyframes damageFloat {

      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
      100% { opacity: 0; transform: translate(-50%, -92%) scale(1); }

    body.roomMoving .layer-room {

    @keyframes roomStepTransition {

        filter: brightness(0.62);
      }
      100% {

        filter: brightness(1);
      }
    }

    @keyframes monsterIdleBob {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.006); }
      100% { transform: translateY(0) scale(1); }
    }

    body.monsterHit .layer-monster {

    body.monsterAttack .layer-monster {

    .layer-chest {

              <button class="uiButton beltButton empty" onclick="useBeltSlot('belt2')" aria-label="P2"></button>
              <button class="uiButton beltButton empty" onclick="useBeltSlot('belt3')" aria-label="P3"></button>
              <button class="uiButton beltButton empty" onclick="useBeltSlot('belt4')" aria-label="P4"></button>

          <div class="tabs" id="inventoryTabs">

            <button class="uiButton" onclick="showInventoryTab('items')">Items</button>

  </div>

  <!-- Map data file. -->
  <script src="maps.js"></script>

  <!-- Monster data files. -->
  <script src="monster.js"></script>
  <script src="monloc.js"></script>

  <!-- Equipment data files. -->
  <script src="weapons.js"></script>
  <script src="armor.js"></script>
  <script src="cloaks.js"></script>
  <script src="necklace.js"></script>
  <script src="rings.js"></script>

  <!-- Item data files. -->
  <script src="consumables.js"></script>
  <script src="keyitems.js"></script>
  <script src="itemLoader.js"></script>

  <!-- Rune data files. -->
  <script src="runes.js"></script>
  <script src="runeLoader.js"></script>

  <script>
    
    const GAME_VERSION = "v0.4.3";
// =========================
    // MAP / FLOOR STATE
    // =========================

    const FLOOR_THEMES = ["c", "b", "f"]; // c = castle, b = beach, f = forest

    let currentFloor = 1;
    let currentMapId = "";
    let currentMap = null;
    let currentFloorTheme = "c";
    let testMap = [];

    let playerX = 1;
    let playerY = 1;
    let playerDir = 2;
    let moveHistory = []; // kept only for save compatibility
    let facingHistory = []; // restores view direction after a back-step

    const dirNames = ["N", "E", "S", "W"];
    const openedChests = new Set();
    const clearedMonsters = new Set();
    const triggeredTraps = new Set();
    const disabledTraps = new Set();

    function dungeonRandomChoice(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function getMonsterFloorLevel(floor) {
      return Math.max(1, Math.floor(Number(floor) || 1));
    }

    function getCurrentMonsterPoolId() {
      // Theme-only fallback id. The current monsterLoader reads currentFloor separately in startEncounter().
      return currentFloorTheme || "c";
    }

    function findEntrancePosition(grid) {
      for (let y = 0; y < grid.length; y++) {
        const x = grid[y].indexOf("E");
        if (x !== -1) return { x, y };
      }

      return { x: 1, y: 1 };
    }


    function findShrinePosition(grid = testMap) {
      for (let y = 0; y < grid.length; y++) {
        const x = grid[y].indexOf("S");
        if (x !== -1) return { x, y };
      }

      return null;
    }

    function getWorldDirectionToShrine() {
      const shrine = findShrinePosition(testMap);
      if (!shrine) return null;

      const dx = shrine.x - playerX;
      const dy = shrine.y - playerY;

      if (dx === 0 && dy === 0) return "HERE";

      if (Math.abs(dx) > Math.abs(dy)) {
        return dx > 0 ? "E" : "W";
      }

      return dy > 0 ? "S" : "N";
    }

    function getRelativeShrineArrow() {
      const worldDir = getWorldDirectionToShrine();
      if (!worldDir) return "·";
      if (worldDir === "HERE") return "◆";

      // Fixed-view crawler: player view always faces south/down the grid.
      if (worldDir === "S") return "↑";
      if (worldDir === "E") return "→";
      if (worldDir === "N") return "↓";
      if (worldDir === "W") return "←";
      return "·";
    }

    function updateTopHud() {
      const floorEl = document.getElementById("floorIndicator");
      if (floorEl) floorEl.textContent = `Floor ${currentFloor}`;

      const shrineEl = document.getElementById("shrineCompass");
      if (shrineEl) shrineEl.textContent = `Shrine ${getRelativeShrineArrow()}`;

      const mapEl = document.getElementById("mapIndicator");
      if (mapEl) {
        const mapName = currentMap && currentMap.name ? currentMap.name : currentMapId || "fallback";
        mapEl.textContent = `Map: ${mapName}  |  Loc: ${getGridLocationLabel(playerX, playerY)}`;
      }

      const versionEl = document.getElementById("versionIndicator");
      if (versionEl) versionEl.textContent = GAME_VERSION;
    }



    function preloadFloorThemeImages() {
      const theme = currentFloorTheme || "c";
      const roomTypes = [
        "chestroom", "door", "openroom", "room3way", "roomfl", "roomfr",
        "roomleft", "roomlr", "roomright", "shrine"
      ];

      roomTypes.forEach(type => {
        const img = new Image();
        img.src = `assets/rooms/${type}${theme}1.png`;
      });
    }

    function startNewFloor() {
      // Starting or reloading a floor is a safe rest point.
      player.hp = player.maxHp;
      player.mp = player.maxMp;

      if (typeof MAPS === "undefined") {
        console.warn("MAPS is missing. Check maps.js load order.");
        testMap = [
          "##########",
          "#E#######",
          "#S#######",
          "##########"
        ];
        currentMapId = "fallback";
      } else {
        const mapIds = Object.keys(MAPS);
        currentMapId = dungeonRandomChoice(mapIds);
        currentMap = MAPS[currentMapId];
        testMap = currentMap.grid;
      }

      currentFloorTheme = dungeonRandomChoice(FLOOR_THEMES);

      const start = findEntrancePosition(testMap);
      playerX = start.x;
      playerY = start.y;
      playerDir = 2;
      moveHistory = [];
      facingHistory = [];
      openedChests.clear();
      clearedMonsters.clear();
      triggeredTraps.clear();
      disabledTraps.clear();

      preloadFloorThemeImages();
      updateRoomView();
      updateTopHud();
      updateBars();

      const themeName = currentFloorTheme === "c" ? "Castle" : currentFloorTheme === "b" ? "Beach" : "Forest";
      setMessage(`${themeName} floor ${currentFloor} loaded.`);
    }

    // =========================
    // BASIC STATE
    // =========================

    let gameMode = "roaming";
    let currentEnemy = null;
    let currentEnemyTileKey = null;
    let inventoryMode = "main";
    let activeEquipSlot = null;

    const player = {
      character: "maya",
      name: "Maya",
      level: 1,
      exp: 0,

      str: 8,
      dex: 7,
      magic: 3,
      vitality: 8,
      speed: 6,

      hp: 100,
      maxHp: 100,
      mp: 30,
      maxMp: 30,
      gold: 0,

      statusEffects: {
        poison: false
      },

      inventory: {
        consumables: {
          potion: 3,
          mana_potion: 1
        },

        equipment: {
          rusty_sword: { owned: true, level: 0, pending: 0, socketsUnlocked: 1, sockets: [{ runeId: "kenaz", level: 0 }] },
          iron_sword: { owned: true, level: 0, pending: 0, socketsUnlocked: 1, sockets: [] },
          maya_cloth: { owned: true, level: 0, pending: 0, socketsUnlocked: 1, sockets: [{ runeId: "algiz", level: 0 }] },
          torn_cloak: { owned: true, level: 0, pending: 0 },
          traveler_cloak: { owned: true, level: 0, pending: 0 },
          copper_necklace: { owned: true, level: 0, pending: 0 },
          copper_ring: { owned: true, level: 0, pending: 0 },
          iron_ring: { owned: true, level: 0, pending: 0 }
        },

        keyitems: {
          generic_key: true
        },

        runes: {
          fehu: { 0: 1, 1: 0, 2: 0, 3: 0 },
          uruz: { 0: 1, 1: 0, 2: 0, 3: 0 },
          kenaz: { 0: 2, 1: 0, 2: 0, 3: 0 },
          algiz: { 0: 1, 1: 0, 2: 0, 3: 0 },
          sowilo: { 0: 1, 1: 0, 2: 0, 3: 0 }
        },

        gems: {},
        fragments: {}
      },

      equipment: {
        weapon: "rusty_sword",
        armor: "maya_cloth",
        necklace: null,
        ring1: "copper_ring",
        ring2: null,
        ring3: null,
        ring4: null,
        belt1: "potion",
        belt2: "mana_potion",
        belt3: null,
        belt4: null
      }
    };



    // =========================
    // LOCAL SAVE
    // =========================

    const LOCAL_SAVE_KEY = "dungeonCrawlerLocalSave_v1";
    let saveReady = false;
    let saveTimer = null;

    function deepMergeMutable(target, source) {
      if (!source || typeof source !== "object") return target;

      Object.keys(source).forEach(key => {
        const value = source[key];

        if (Array.isArray(value)) {
          target[key] = value.slice();
          return;
        }

        if (value && typeof value === "object") {
          if (!target[key] || typeof target[key] !== "object" || Array.isArray(target[key])) {
            target[key] = {};
          }
          deepMergeMutable(target[key], value);
          return;
        }

        target[key] = value;
      });

      return target;
    }

    function getLocalSavePayload() {
      return {
        version: 1,
        savedAt: Date.now(),
        currentFloor,
        currentMapId,
        currentFloorTheme,
        playerX,
        playerY,
        playerDir,
        moveHistory: Array.isArray(moveHistory) ? moveHistory.slice() : [],
        facingHistory: Array.isArray(facingHistory) ? facingHistory.slice() : [],
        openedChests: Array.from(openedChests || []),
        clearedMonsters: Array.from(clearedMonsters || []),
        player: JSON.parse(JSON.stringify(player))
      };
    }

    function saveGameState(immediate = false) {
      if (!saveReady) return;

      const write = () => {
        try {
          window.localStorage.setItem(LOCAL_SAVE_KEY, JSON.stringify(getLocalSavePayload()));
        } catch (err) {
          console.warn("Local save failed:", err);
        }
      };

      if (immediate) {
        if (saveTimer) {
          clearTimeout(saveTimer);
          saveTimer = null;
        }
        write();
        return;
      }

      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = window.setTimeout(() => {
        saveTimer = null;
        write();
      }, 250);
    }

    function loadGameState() {
      try {
        const raw = window.localStorage.getItem(LOCAL_SAVE_KEY);
        if (!raw) return false;

        const save = JSON.parse(raw);
        if (!save || typeof save !== "object") return false;

        if (save.player && typeof save.player === "object") {
          // Replace the default starter player with the saved player instead of deep-merging into it.
          // This prevents re-granting starter gear/consumables after they were sold or used.
          Object.keys(player).forEach(key => delete player[key]);
          deepMergeMutable(player, save.player);
        }

        currentFloor = Math.max(1, Math.floor(Number(save.currentFloor) || 1));

        // Deliberately do NOT restore the active map, position, opened chests,
        // cleared monster rooms, movement history, or floor theme.
        // On every page load, the character keeps progression/inventory/floor,
        // but starts a freshly generated floor at the entrance.
        currentMapId = "";
        currentMap = null;
        testMap = [];
        currentFloorTheme = "c";
        playerX = 1;
        playerY = 1;
        playerDir = 2;
        moveHistory = [];
      facingHistory = [];
        openedChests.clear();
        clearedMonsters.clear();
        triggeredTraps.clear();
        disabledTraps.clear();

        return true;
      } catch (err) {
        console.warn("Local save load failed:", err);
        return false;
      }
    }

    function clearLocalSave() {
      try {
        window.localStorage.removeItem(LOCAL_SAVE_KEY);
      } catch (err) {
        console.warn("Local save clear failed:", err);
      }
    }

    window.addEventListener("beforeunload", () => saveGameState(true));

    // =========================
    // INVENTORY SHAPE / EQUIPMENT HELPERS
    // =========================

    function ensureFullInventoryShape() {
      if (typeof ensureInventoryShape === "function") {
        ensureInventoryShape(player);
      }

      if (!player.inventory.equipment) {
        player.inventory.equipment = {};
      }

      if (typeof ensureRuneInventory === "function") {
        ensureRuneInventory(player);
      }

      if (!player.inventory.gems) {
        player.inventory.gems = {};
      }

      if (!player.inventory.fragments) {
        player.inventory.fragments = {};
      }
    }

    function getOwnedEquipmentRecord(itemId) {
      ensureFullInventoryShape();
      return player.inventory.equipment[itemId] || null;
    }


    function normalizeEquipmentSockets(itemId) {
      const item = getEquipItem(itemId);
      const record = getOwnedEquipmentRecord(itemId);

      if (!item || !record) return;

      if (!Array.isArray(record.sockets)) {
        record.sockets = [];
      }

      const maxSockets = item.maxSockets || 0;

      if (record.socketsUnlocked === undefined) {
        record.socketsUnlocked = Math.min(maxSockets, maxSockets > 0 ? 1 : 0);
      }

      record.socketsUnlocked = Math.max(0, Math.min(maxSockets, Number(record.socketsUnlocked) || 0));

      while (record.sockets.length < record.socketsUnlocked) {
        record.sockets.push(null);
      }

      if (record.sockets.length > record.socketsUnlocked) {
        record.sockets.length = record.socketsUnlocked;
      }
    }

    function getOrCreateEquipmentRecord(itemId) {
      ensureFullInventoryShape();

      if (!player.inventory.equipment[itemId]) {
        player.inventory.equipment[itemId] = {
          owned: true,
          level: 0,
          pending: 0,
          socketsUnlocked: 0,
          sockets: []
        };
      }

      normalizeEquipmentSockets(itemId);
      return player.inventory.equipment[itemId];
    }

    function getSocketSummary(itemId) {
      const item = getEquipItem(itemId);
      const record = getOwnedEquipmentRecord(itemId);

      if (!item || !record || (item.slot !== "weapon" && item.slot !== "armor")) return "";

      normalizeEquipmentSockets(itemId);

      const filled = record.sockets.filter(socket => socket && socket.runeId).length;
      const total = record.socketsUnlocked || 0;
      const max = item.maxSockets || 0;

      return `Runes ${filled}/${total} · Max ${max}`;
    }

    function getEquippedRuneRecords() {
      const records = [];

      ["weapon", "armor"].forEach(slot => {
        const itemId = player.equipment[slot];
        const record = getOwnedEquipmentRecord(itemId);
        if (record) records.push(record);
      });

      return records;
    }

    function getRuneBonusTotals() {
      if (typeof getRuneBonusTotalsFromRecords !== "function") {
        return {
          goldFindPct: 0,
          attackPct: 0,
          piercePct: 0,
          magicPct: 0,
          speedPct: 0,
          fireWeaponPct: 0,
          lifeStealPct: 0,
          shockWeaponPct: 0,
          slowChancePct: 0,
          lightBonusPct: 0,
          defensePct: 0,
          undeadBonusPct: 0
        };
      }

      return getRuneBonusTotalsFromRecords(player, getEquippedRuneRecords());
    }

    function ownsEquipment(itemId) {
      const record = getOwnedEquipmentRecord(itemId);
      return !!(record && record.owned);
    }

    function getEquipmentLevel(itemId) {
      const record = getOwnedEquipmentRecord(itemId);
      return record ? (record.level || 0) : 0;
    }

    function getEquipmentPending(itemId) {
      const record = getOwnedEquipmentRecord(itemId);
      return record ? (record.pending || 0) : 0;
    }

    function getEquipItem(itemId) {
      if (!itemId || typeof getEquipmentById !== "function") return null;
      return getEquipmentById(itemId);
    }

    function getEquipName(itemId) {
      if (!itemId) return "None";

      const level = getEquipmentLevel(itemId);

      if (typeof getEquipmentDisplayName === "function") {
        return getEquipmentDisplayName(itemId, level);
      }

      const item = getEquipItem(itemId);
      return item ? item.itemName : itemId;
    }

    function getEquipStats(itemId) {
      const item = getEquipItem(itemId);
      if (!item) {
        return {
          hp: 0,
          mp: 0,
          atk: 0,
          mag: 0,
          def: 0,
          mdef: 0,
          speed: 0,
          crit: 0,
          dodge: 0,
          goldFind: 0
        };
      }

      const level = getEquipmentLevel(itemId);

      if (typeof getUpgradedEquipmentStats === "function") {
        return getUpgradedEquipmentStats(item, level);
      }

      return {
        hp: item.hp || 0,
        mp: item.mp || 0,
        atk: item.atk || 0,
        mag: item.mag || 0,
        def: item.def || 0,
        mdef: item.mdef || 0,
        speed: item.speed || 0,
        crit: item.crit || 0,
        dodge: item.dodge || 0,
        goldFind: item.goldFind || 0
      };
    }

    function equipmentStatLine(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return "No stats";

      const level = getEquipmentLevel(itemId);
      const pending = getEquipmentPending(itemId);

      let line = "";

      if (typeof getEquipmentStatLine === "function") {
        line = getEquipmentStatLine(item, level);
      } else {
        const s = getEquipStats(itemId);
        const parts = [];
        if (s.atk) parts.push(`Atk ${s.atk}`);
        if (s.mag) parts.push(`Mag ${s.mag}`);
        if (s.def) parts.push(`Def ${s.def}`);
        if (s.mdef) parts.push(`MDef ${s.mdef}`);
        if (s.hp) parts.push(`HP ${s.hp}`);
        if (s.mp) parts.push(`MP ${s.mp}`);
        if (s.speed) parts.push(`Speed ${s.speed}`);
        line = parts.join(" · ") || "No stats";
      }

      const socketText = getSocketSummary(itemId);
      if (socketText) {
        line += ` · ${socketText}`;
      }

      if (pending > 0) {
        line += ` · Pending +${pending}`;
      }

      return line;
    }

    function getEquipmentBonusTotals() {
      const equippedIds = [
        player.equipment.weapon,
        player.equipment.armor,
        player.equipment.necklace,
        player.equipment.ring1,
        player.equipment.ring2,
        player.equipment.ring3,
        player.equipment.ring4
      ].filter(Boolean);

      const totals = {
        hp: 0,
        mp: 0,
        atk: 0,
        mag: 0,
        def: 0,
        mdef: 0,
        speed: 0,
        goldFind: 0
      };

      equippedIds.forEach(itemId => {
        const stats = getEquipStats(itemId);

        totals.hp += stats.hp || 0;
        totals.mp += stats.mp || 0;
        totals.atk += stats.atk || 0;
        totals.mag += stats.mag || 0;
        totals.def += stats.def || 0;
        totals.mdef += stats.mdef || 0;
        totals.speed += stats.speed || 0;
        totals.goldFind += stats.goldFind || 0;
      });

      return totals;
    }

    function getTotalGoldFindPct() {
      const equipBonuses = getEquipmentBonusTotals();
      const runeBonuses = getRuneBonusTotals();
      return Math.max(0, (equipBonuses.goldFind || 0) + (runeBonuses.goldFindPct || 0));
    }

    function applyGoldFind(amount) {
      const base = Math.max(0, Math.floor(Number(amount) || 0));
      const goldFindPct = getTotalGoldFindPct();
      return Math.max(0, Math.round(base * (1 + goldFindPct / 100)));
    }

    // =========================
    // PLAYER EXPERIENCE / LEVELING
    // =========================

    const PLAYER_BASE_STATS = {
      str: 8,
      dex: 7,
      magic: 3,
      vitality: 8,
      speed: 6,
      maxHp: 100,
      maxMp: 30
    };

    // Deterministic level-up pattern. This can later become a per-character table.
    const PLAYER_LEVEL_GAIN_PATTERN = [
      { hp: 10, mp: 2, str: 1, dex: 0, magic: 0, vitality: 1, speed: 0 },
      { hp: 8,  mp: 3, str: 0, dex: 1, magic: 0, vitality: 0, speed: 1 },
      { hp: 12, mp: 2, str: 1, dex: 0, magic: 0, vitality: 1, speed: 0 },
      { hp: 8,  mp: 4, str: 0, dex: 1, magic: 1, vitality: 0, speed: 0 },
      { hp: 14, mp: 2, str: 1, dex: 0, magic: 0, vitality: 1, speed: 1 }
    ];

    function getLevelGainForLevel(level) {
      if (level <= 1) {
        return { hp: 0, mp: 0, str: 0, dex: 0, magic: 0, vitality: 0, speed: 0 };
      }

      return PLAYER_LEVEL_GAIN_PATTERN[(level - 2) % PLAYER_LEVEL_GAIN_PATTERN.length];
    }

    function getPlayerLevelBonus(level = player.level) {
      const bonus = { hp: 0, mp: 0, str: 0, dex: 0, magic: 0, vitality: 0, speed: 0 };
      const cappedLevel = Math.max(1, Math.floor(Number(level) || 1));

      for (let lvl = 2; lvl <= cappedLevel; lvl++) {
        const gain = getLevelGainForLevel(lvl);
        bonus.hp += gain.hp || 0;
        bonus.mp += gain.mp || 0;
        bonus.str += gain.str || 0;
        bonus.dex += gain.dex || 0;
        bonus.magic += gain.magic || 0;
        bonus.vitality += gain.vitality || 0;
        bonus.speed += gain.speed || 0;
      }

      return bonus;
    }

    function getExpNeededForLevel(level = player.level) {
      const lvl = Math.max(1, Math.floor(Number(level) || 1));
      return Math.floor(50 + (lvl * lvl * 25));
    }

    function recalcDerivedStats() {
      const bonuses = getEquipmentBonusTotals();
      const levelBonus = getPlayerLevelBonus(player.level);

      player.str = PLAYER_BASE_STATS.str + levelBonus.str;
      player.dex = PLAYER_BASE_STATS.dex + levelBonus.dex;
      player.magic = PLAYER_BASE_STATS.magic + levelBonus.magic;
      player.vitality = PLAYER_BASE_STATS.vitality + levelBonus.vitality;
      player.speed = PLAYER_BASE_STATS.speed + levelBonus.speed + (bonuses.speed || 0);

      player.maxHp = PLAYER_BASE_STATS.maxHp + levelBonus.hp + (bonuses.hp || 0);
      player.maxMp = PLAYER_BASE_STATS.maxMp + levelBonus.mp + (bonuses.mp || 0);

      player.hp = Math.min(player.maxHp, Math.max(1, player.hp));
      player.mp = Math.min(player.maxMp, Math.max(0, player.mp));
    }

    function getMonsterExpReward(monster) {
      if (!monster) return 0;
      const value = monster.exp ?? monster.expReward ?? 0;
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(0, Math.round(n)) : 0;
    }

    function gainExp(amount) {
      const gained = Math.max(0, Math.round(Number(amount) || 0));
      if (!Number.isFinite(player.exp)) player.exp = 0;
      player.exp += gained;

      let levelsGained = 0;

      while (player.exp >= getExpNeededForLevel(player.level)) {
        player.exp -= getExpNeededForLevel(player.level);
        player.level += 1;
        levelsGained += 1;
      }

      if (levelsGained > 0) {
        recalcDerivedStats();
        player.hp = player.maxHp;
        player.mp = player.maxMp;
        updateBars();
      }

      return { gained, levelsGained };
    }

    function canEquip(itemId) {
      const item = getEquipItem(itemId);
      if (!item) return false;

      if (typeof canCharacterEquipItem === "function") {
        return canCharacterEquipItem(player, item);
      }

      return true;
    }

    function getEquipmentTierNumber(item) {
      const tierText = String(item && item.tier ? item.tier : "").toLowerCase();
      const match = tierText.match(/mt?(\d+)/);
      if (match) return Number(match[1]);

      const req = Number(item && item.reqLevel ? item.reqLevel : 1);
      if (req >= 9) return 4;
      if (req >= 5) return 3;
      if (req >= 3) return 2;
      return 1;
    }

    function getEquipmentFragmentId(item) {
      const tier = getEquipmentTierNumber(item);
      const kind = item && item.slot === "weapon" ? "weapon" : "armor";
      return `t${tier}_${kind}_fragment`;
    }

    function getFragmentDisplayName(fragmentId) {
      const match = String(fragmentId || "").match(/^t(\d+)_(armor|weapon)_fragment$/);
      if (!match) return fragmentId || "Fragment";
      const kind = match[2] === "weapon" ? "Weapon" : "Armor";
      return `T${match[1]} ${kind} Fragment`;
    }

    function addFragment(fragmentId, amount = 1) {
      ensureFullInventoryShape();
      player.inventory.fragments[fragmentId] = (player.inventory.fragments[fragmentId] || 0) + amount;
    }

    function getFragmentInventoryList() {
      ensureFullInventoryShape();
      return Object.entries(player.inventory.fragments || {})
        .filter(([, quantity]) => quantity > 0)
        .map(([fragmentId, quantity]) => ({
          fragmentId,
          quantity,
          itemName: getFragmentDisplayName(fragmentId),
          description: "Used for same-tier equipment upgrades."
        }));
    }

    function addEquipmentToInventory(itemId) {
      const item = getEquipItem(itemId);

      if (!item) {
        return false;
      }

      ensureFullInventoryShape();

      if (!player.inventory.equipment[itemId] || !player.inventory.equipment[itemId].owned) {
        player.inventory.equipment[itemId] = {
          owned: true,
          level: 0,
          pending: 0,
          socketsUnlocked: Math.min(item.maxSockets || 0, item.maxSockets > 0 ? 1 : 0),
          sockets: []
        };

        normalizeEquipmentSockets(itemId);

        return {
          ok: true,
          message: `Found ${getEquipName(itemId)}.`
        };
      }

      return {
        ok: false,
        duplicate: true,
        message: `Already own ${getEquipName(itemId)}.`
      };
    }

    function addLootItem(itemId) {
      if (getEquipItem(itemId)) {
        return addEquipmentToInventory(itemId);
      }

      if (typeof getConsumable === "function" && getConsumable(itemId)) {
        addConsumable(player, itemId, 1);
        return {
          ok: true,
          message: `Found ${getItemDisplayName(itemId)}.`
        };
      }

      if (typeof getKeyItem === "function" && getKeyItem(itemId)) {
        addKeyItem(player, itemId);
        return {
          ok: true,
          message: `Found ${getItemDisplayName(itemId)}.`
        };
      }

      if (typeof getRuneById === "function" && getRuneById(itemId)) {
        addRune(player, itemId, 0, 1);
        return {
          ok: true,
          message: `Found ${getRuneDisplayName(itemId, 0)}.`
        };
      }

      return {
        ok: false,
        message: `Unknown item: ${itemId}`
      };
    }

    function applyPendingEquipmentUpgrades() {
      ensureFullInventoryShape();

      const messages = [];

      Object.entries(player.inventory.equipment).forEach(([itemId, record]) => {
        if (!record || !record.owned) return;

        const pending = record.pending || 0;

        if (pending <= 0) return;

        record.level = (record.level || 0) + pending;
        record.pending = 0;

        messages.push(`${getEquipName(itemId)} upgraded to +${record.level}.`);
      });

      recalcDerivedStats();
      updateBars();

      return messages;
    }

    function getTile(x, y) {
      if (y < 0 || y >= testMap.length) return "#";
      if (x < 0 || x >= testMap[y].length) return "#";
      return testMap[y][x];
    }

    function canMoveTo(x, y) {
      return getTile(x, y) !== "#";
    }

    function isOpenTile(tile) {
      return tile !== "#";
    }

    function getDirOffset(dir) {
      if (dir === 0) return { dx: 0, dy: -1 };
      if (dir === 1) return { dx: 1, dy: 0 };
      if (dir === 2) return { dx: 0, dy: 1 };
      return { dx: -1, dy: 0 };
    }

    function getRelativeTile(relativeDir) {
      // Relative movement without a pivot step.
      // Clicking Left/Right immediately enters that visible room and faces that way.
      // Clicking Back steps backward, then restores the prior view direction.
      let absoluteDir = playerDir;

      // Screen-relative controls:
      // Left means the visible left branch, not compass-left math.
      // With the starting south-facing view, Left must go west and Right must go east.
      if (relativeDir === -1) absoluteDir = (playerDir + 1) % 4;
      else if (relativeDir === 1) absoluteDir = (playerDir + 3) % 4;
      else if (relativeDir === 2) absoluteDir = (playerDir + 2) % 4;

      const offset = getDirOffset(absoluteDir);

      return {
        x: playerX + offset.dx,
        y: playerY + offset.dy,
        dir: absoluteDir,
        tile: getTile(playerX + offset.dx, playerY + offset.dy)
      };
    }

    function getForwardTile() {
      return getRelativeTile(0);
    }

    function getBackwardTile() {
      return getRelativeTile(2);
    }

    function getRoomImageName() {
      const currentTile = getTile(playerX, playerY);

      // Entrance uses the original floor entrance/room view.
      // It still has Action options, but it is not visually a shrine.

      // Special rooms only display their special image when the player is standing in that room.
      if (currentTile === "C") return getRoomImageNameForType("chestroom");
      if (currentTile === "B") return getRoomImageNameForType("door");
      if (currentTile === "S") return getRoomImageNameForType("shrine");

      const front = getRelativeTile(0);
      const left = getRelativeTile(-1);
      const right = getRelativeTile(1);

      const frontOpen = canMoveTo(front.x, front.y);
      const leftOpen = canMoveTo(left.x, left.y);
      const rightOpen = canMoveTo(right.x, right.y);

      if (frontOpen && leftOpen && rightOpen) return getRoomImageNameForType("room3way");
      if (frontOpen && leftOpen && !rightOpen) return getRoomImageNameForType("roomfl");
      if (frontOpen && !leftOpen && rightOpen) return getRoomImageNameForType("roomfr");
      if (frontOpen && !leftOpen && !rightOpen) return getRoomImageNameForType("openroom");
      if (!frontOpen && leftOpen && rightOpen) return getRoomImageNameForType("roomlr");
      if (!frontOpen && leftOpen && !rightOpen) return getRoomImageNameForType("roomleft");
      if (!frontOpen && !leftOpen && rightOpen) return getRoomImageNameForType("roomright");

      return getRoomImageNameForType("openroom");
    }

    function enterTile(tile) {
      const key = tileKey(playerX, playerY);
      updateRoomView();

      if (tile === "E") {
        setMessage("Floor entrance. Use Action for entrance options.");
        return;
      }

      if (tile === "R") {
        setMessage("Moved to room.");
        return;
      }

      if (tile === "M") {
        if (clearedMonsters.has(key)) {
          setMessage("The monster room is clear.");
          return;
        }

        setMessage("You enter a monster room.");
        startEncounter(getCurrentMonsterPoolId(), key, "M");
        return;
      }

      if (tile === "C") {
        if (openedChests.has(key)) {
          setMessage("The chest is empty.");
          return;
        }

        setMessage("You found a chest.");
        return;
      }

      if (tile === "T") {
        if (triggeredTraps.has(key)) {
          setMessage("The spent trap is quiet.");
          return;
        }

        if (disabledTraps.has(key)) {
          setMessage("The disabled trap is safe.");
          return;
        }

        triggeredTraps.add(key);
        player.hp = Math.max(1, player.hp - 10);
        updateBars();
        saveGameState();
        setMessage("A trap hits you for 10 damage.");
        return;
      }

      if (tile === "B") {
        if (clearedMonsters.has(key)) {
          setMessage("The boss room is clear.");
          return;
        }

        setMessage("A boss blocks the room.");
        startEncounter(getCurrentMonsterPoolId(), key, "B");
        return;
      }

      if (tile === "S") {
        setMessage("You found a shrine.");
        return;
      }

      setMessage("Moved.");
    }

    function saveCurrentPosition() {

    function getPreviousPosition() {
      if (!Array.isArray(moveHistory) || moveHistory.length === 0) return null;
      const prev = moveHistory[moveHistory.length - 1];
      if (!prev || typeof prev.x !== "number" || typeof prev.y !== "number") return null;
      if (!canMoveTo(prev.x, prev.y)) return null;
      return prev;
    }

    function moveToRelative(relativeDir, newFacingDir, moveLabel) {
      if (menuIsOpen()) return;
      if (gameMode === "encounter") return;

      const oldDir = playerDir;
      const next = getRelativeTile(relativeDir);

      if (!canMoveTo(next.x, next.y)) {
        updateRoomView();
        setMessage(`No ${moveLabel} path.`);
        return;
      }

      playRoomTransition();

      playerX = next.x;
      playerY = next.y;

      if (relativeDir === 2) {
        // Back-step: move opposite current view, then restore the previous view.
        // This prevents side-room backtracking from leaving the player turned around.
        if (Array.isArray(facingHistory) && facingHistory.length > 0) {
          playerDir = facingHistory.pop();
        } else {
          playerDir = oldDir;
        }
      } else {
        // Forward/left/right immediately enter the visible destination room
        // and face the direction just moved. No pivot-only step occurs.
        if (!Array.isArray(facingHistory)) facingHistory = [];
        facingHistory.push(oldDir);
        playerDir = next.dir;
      }

      enterTile(getTile(playerX, playerY));
    }

    function moveForward() {
      moveToRelative(0, 2, "forward");
    }


    function moveBack() {
      moveToRelative(2, 2, "back");

    function shrineRest() {

    function shrineApplyUpgrades() {

        setMessage("No pending gear upgrades.");

    function renderOllieShop() {
      setOverlayTitle("Shop");
      hideInventoryTabs();

      const content = document.getElementById("inventoryContent");
      content.style.overflowY = "auto";

      content.innerHTML = `
        ${shrineHeroHtml("merchant")}

        <div class="shopMenuList">
          <button class="shopRow" onclick="renderShrineBuy()">
            ${shopIconHtml("hpot1.png", "items")}
            <div class="shopRowText">
              <div class="shopRowName">Buy</div>

          <button class="shopRow" onclick="renderShrineSell()">
            ${shopIconHtml("", "items")}
            <div class="shopRowText">
