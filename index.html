    const SHOP_KEY_ITEMS = [
      { itemId: "generic_key", label: "Generic Key" },
      { itemId: "boss_key", label: "Boss Key" }
    ];

    function getAllShopConsumables() {
      ensureShrineStoneData();

      if (typeof GAME_CONSUMABLES !== "undefined") {
        const entries = Object.values(GAME_CONSUMABLES)
          .filter(Boolean)
          .map(item => ({ itemId: item.itemId }));

        if (!entries.some(entry => entry.itemId === "shrine_stone")) {
          entries.push({ itemId: "shrine_stone" });
        }

        return entries;
      }

      return [
        { itemId: "potion" },
        { itemId: "copper_potion" },
        { itemId: "silver_potion" },
        { itemId: "gold_potion" },
        { itemId: "mana_potion" },
        { itemId: "copper_mana_potion" },
        { itemId: "silver_mana_potion" },
        { itemId: "gold_mana_potion" },
        { itemId: "antidote" },
        { itemId: "smoke_bomb" },
        { itemId: "shrine_stone" },
        { itemId: "rejuvenation_potion" }
      ];
    }

    let currentShopGearStock = { Weapons: [], Armor: [] };
    let currentShopGearIndex = 0;
    let currentShopRuneStock = [];
    let currentFloorNpcState = {};
    let shopFreeRerollUsedFloor = null;
    let activeShopContext = "shrine";

    const SHOP_BUY_CATEGORIES = ["Consumables", "Skills", "Weapons", "Armor", "Keys"];
    const SHOP_SELL_CATEGORIES = ["Consumables", "Equipment", "Keys"];
    const SHOP_PAGE_SIZE = 3;
    const SHOP_RUNE_IDS = ["fehu", "uruz", "thurisaz", "ansuz", "raidho", "kenaz", "gebo", "hagalaz", "isa", "eihwaz", "algiz", "sowilo"];

    let shopBuyCategoryIndex = 0;
    let shopSellCategoryIndex = 0;
    let shopBuyPages = {};
    let shopSellPages = {};
    let shopFloorPages = {};

    function getShopCategories(mode) {
      if (mode === "sell") return SHOP_SELL_CATEGORIES;
      return SHOP_BUY_CATEGORIES;
    }

    function getShopCategoryCycleHtml(mode, currentIndex) {
      const categories = getShopCategories(mode);
      const label = categories[currentIndex] || categories[0];
      return `
        <div class="itemCategoryCycle">
          <button class="statusCycleButton" onclick="cycleShopCategory('${mode}', -1)">‹</button>
          <div class="itemCategoryLabel">${label}</div>
          <button class="statusCycleButton" onclick="cycleShopCategory('${mode}', 1)">›</button>
        </div>
      `;
    }

    function cycleShopCategory(mode, delta) {
      const categories = getShopCategories(mode);
      const total = categories.length;

      if (mode === "buy") {
        shopBuyCategoryIndex = (shopBuyCategoryIndex + delta + total) % total;
        renderShrineBuy();
        return;
      }

      if (mode === "sell") {
        shopSellCategoryIndex = (shopSellCategoryIndex + delta + total) % total;
        renderShrineSell();
      }
    }

    function getShopCategoryKey(index, mode = "buy") {
      const categories = getShopCategories(mode);
      return categories[index] || categories[0];
    }

    function getShopPageStore(mode) {
      if (String(mode).startsWith("floor_")) return shopFloorPages;
      return mode === "sell" ? shopSellPages : shopBuyPages;
    }

    function getShopPage(mode, category, itemCount) {
      const store = getShopPageStore(mode);
      const key = `${mode}:${category}`;
      const maxPage = Math.max(0, Math.ceil(Math.max(0, itemCount) / SHOP_PAGE_SIZE) - 1);
      const current = Math.max(0, Math.min(Number(store[key] || 0), maxPage));
      store[key] = current;
      return current;
    }

    function setShopPage(mode, delta) {
      const categoryIndex = mode === "sell" ? shopSellCategoryIndex : shopBuyCategoryIndex;
      const category = String(mode).startsWith("floor_")
        ? (mode === "floor_runes" ? "Runes" : (mode.includes("skills") ? "Skills" : "Consumables"))
        : getShopCategoryKey(categoryIndex, mode);
      const store = getShopPageStore(mode);
      const key = `${mode}:${category}`;
      store[key] = Math.max(0, Number(store[key] || 0) + delta);

      if (mode === "buy") {
        renderShrineBuy();
      } else if (mode === "sell") {
        renderShrineSell();
      } else if (mode === "floor_runes") {
        renderFloorRuneShop();
      } else if (mode === "floor_consumables") {
        renderFloorConsumableShop();
      } else if (mode === "floor_skills") {
        renderFloorSkillShop(false);
      } else if (mode === "floor_secret_skills") {
        renderFloorSkillShop(true);
      }
    }

    function getShopPageControlsHtml(mode, category, itemCount) {
      const maxPage = Math.max(0, Math.ceil(Math.max(0, itemCount) / SHOP_PAGE_SIZE) - 1);
      const current = getShopPage(mode, category, itemCount);
      const prevDisabled = current <= 0 ? "disabled" : "";
      const nextDisabled = current >= maxPage ? "disabled" : "";

      return `
        <div class="shopPageControls">
          <button class="uiButton" onclick="setShopPage('${mode}', -1)" ${prevDisabled}>‹</button>
          <div class="shopPageText">Page ${current + 1} / ${maxPage + 1}</div>
          <button class="uiButton" onclick="setShopPage('${mode}', 1)" ${nextDisabled}>›</button>
        </div>
      `;
    }

    function getShopPageItems(mode, category, entries) {
      const list = Array.isArray(entries) ? entries : [];
      const page = getShopPage(mode, category, list.length);
      const start = page * SHOP_PAGE_SIZE;
      return list.slice(start, start + SHOP_PAGE_SIZE);
    }

    function getItemBaseValue(itemId) {
      if (itemId === "shrine_stone") return 150;

      const consumable = getConsumableSafe(itemId);
      if (consumable && Number(consumable.value || consumable.price || consumable.goldValue)) {
        return Number(consumable.value || consumable.price || consumable.goldValue);
      }

      const equipment = getEquipItem(itemId);
      if (equipment && Number(equipment.value)) {
        return Number(equipment.value);
      }

      return 10;
    }

    function getBuyPrice(itemId) {
      return Math.max(1, Math.round(getItemBaseValue(itemId)));
    }

    function getSellPrice(itemId) {
      return Math.max(1, Math.floor(getItemBaseValue(itemId) * 0.5));
    }

    function getEquipmentShopIconHtml(item) {
      if (!item) return `<span class="shopIcon empty"></span>`;

      const iconPath = typeof getEquipmentIconPath === "function"
        ? getEquipmentIconPath(item)
        : (item.icon || item.image || "");

      if (!iconPath) return `<span class="shopIcon empty"></span>`;

      const finalPath = iconPath.startsWith("assets/") ? iconPath : `assets/${getEquipmentImageFolder(item)}/${iconPath}`;
      return `<img class="shopIcon" src="${finalPath}" alt="" onerror="this.style.display='none';">`;
    }

    function isSpecialRestrictedGear(item) {
      const text = `${item?.itemId || ""} ${item?.itemName || ""}`.toLowerCase();
      return text.includes("jade") || text.includes("black") || text.includes("white");
    }

    function getShopGearCandidates(category = "Weapons") {
      const allEquipment = typeof getAllEquipment === "function" ? getAllEquipment() : [];
      const slot = category === "Armor" ? "armor" : "weapon";
      const allowedCharacters = ["all", player.character].filter(Boolean);

      return allEquipment.filter(item => {
        if (!item || item.slot !== slot) return false;
        if (isSpecialRestrictedGear(item)) return false;
        if (item.character && !allowedCharacters.includes(String(item.character).toLowerCase())) return false;
        return true;
      });
    }

    function getRandomShopGearStock(category = "Weapons", count = 9) {
      const pool = getShopGearCandidates(category).slice();
      const picks = [];

      while (pool.length && picks.length < count) {
        const index = Math.floor(Math.random() * pool.length);
        picks.push(pool.splice(index, 1)[0]);
      }

      return picks;
    }

    function getOrderedShopGearStock(category = "Weapons") {
      return getShopGearCandidates(category).slice().sort((a, b) => {
        const aReq = Number(a.reqLevel || a.level || 1);
        const bReq = Number(b.reqLevel || b.level || 1);
        if (aReq !== bReq) return aReq - bReq;

        const aValue = Number(a.value || 0);
        const bValue = Number(b.value || 0);
        if (aValue !== bValue) return aValue - bValue;

        return String(a.itemName || a.itemId || "").localeCompare(String(b.itemName || b.itemId || ""));
      });
    }

    function ensureShopGearStock(category = "Weapons") {
      const key = category === "Armor" ? "Armor" : "Weapons";
      if (!currentShopGearStock || Array.isArray(currentShopGearStock)) {
        currentShopGearStock = { Weapons: [], Armor: [] };
      }

      if (!Array.isArray(currentShopGearStock[key]) || currentShopGearStock[key].length < 1) {
        // Ollie's weapon/armor stock is ordered from lowest tier to highest.
        // Jade, Black, and White gear are still excluded by getShopGearCandidates().
        currentShopGearStock[key] = getOrderedShopGearStock(key);
      }

      return currentShopGearStock[key];
    }

    function resetShopGearStock(category = "") {
      if (!currentShopGearStock || Array.isArray(currentShopGearStock)) {
        currentShopGearStock = { Weapons: [], Armor: [] };
      }

      if (!category || category === "Weapons") currentShopGearStock.Weapons = getOrderedShopGearStock("Weapons");
      if (!category || category === "Armor") currentShopGearStock.Armor = getOrderedShopGearStock("Armor");
      currentShopGearIndex = 0;
    }

    function renderShopBuySupplyRow(entry) {
      const item = getConsumableSafe(entry.itemId);
      if (!item) return "";
      const name = entry.label || item.itemName || getSafeItemName(entry.itemId);
      const image = item.image || "";
      const price = getBuyPrice(entry.itemId);

      return `
        <button class="shopRow" onclick="buyShopItem('${entry.itemId}', ${price})">
          ${shopIconHtml(image, "items")}
          <div class="shopRowText">
            <div class="shopRowName">${name}</div>
            <div class="shopRowSub">${item.description || "Consumable"}</div>
          </div>
          <div class="shopRowValue">${price}g</div>
        </button>
      `;
    }

    function renderShopBuyKeyRow(entry) {
      const item = typeof getKeyItem === "function" ? getKeyItem(entry.itemId) : null;
      if (!item) return "";
      const price = Math.max(1, Number(item.value || 25) || 25);
      return `
        <button class="shopRow" onclick="buyShopKeyItem('${entry.itemId}', ${price})">
          ${shopIconHtml(item.image || "", "items")}
          <div class="shopRowText">
            <div class="shopRowName">${entry.label || item.itemName}</div>
            <div class="shopRowSub">${item.description || "Key item"}</div>
          </div>
          <div class="shopRowValue">${price}g</div>
        </button>
      `;
    }

    function renderShopBuyEquipmentRow(item, priceMultiplier = 1) {
      if (!item) return "";
      const owned = ownsEquipment(item.itemId);
      const price = Math.max(1, Math.floor(getBuyPrice(item.itemId) * Number(priceMultiplier || 1)));
      const discountText = priceMultiplier < 1 ? " · Discount" : "";

      return `
        <button class="shopRow" onclick="buyShopEquipment('${item.itemId}', ${price})">
          ${getEquipmentShopIconHtml(item)}
          <div class="shopRowText">
            <div class="shopRowName">${item.itemName}</div>
            <div class="shopRowSub">${item.slot.toUpperCase()} · Req Lv ${item.reqLevel || 1} · ${owned ? "Owned" : "New"}${discountText}</div>
          </div>
          <div class="shopRowValue">${price}g</div>
        </button>
      `;
    }
    function renderShopBuyEquipmentSelector(gearStock) {
      const stock = Array.isArray(gearStock) ? gearStock : [];
      if (!stock.length) return `<div class="smallNote">No equipment offers available.</div>`;
      return stock.map(item => renderShopBuyEquipmentRow(item)).join("");
    }

    function renderShopRerollGearRow(category) {
      const freeUsed = shopFreeRerollUsedFloor === currentFloor;
      const cost = Math.max(10, currentFloor * 25);

      return `
        <button class="shopRow shopBackRow" onclick="rerollShopGear('${category}')">
          ${shopIconHtml("", "items")}
          <div class="shopRowText">
            <div class="shopRowName">Reroll ${category}</div>
            <div class="shopRowSub">${freeUsed ? "Free reroll used this floor." : "First reroll is free once per floor."}</div>
          </div>
          <div class="shopRowValue">${freeUsed ? cost + "g" : "Free"}</div>
        </button>
      `;
    }

    function renderShopBuyEquipmentEntry(entry) {
      if (!entry) return "";
      return renderShopBuyEquipmentRow(entry);
    }

    function shopGearPrev() {
      setShopPage("buy", -1);
    }

    function shopGearNext() {
      setShopPage("buy", 1);
    }



    function ensureShopRuneStock() {
      if (!Array.isArray(currentShopRuneStock) || currentShopRuneStock.length < 1) {
        const pool = SHOP_RUNE_IDS
          .filter(id => typeof getRuneById !== "function" || getRuneById(id))
          .map(runeId => ({ runeId, level: Math.random() < 0.10 && currentFloor >= 10 ? 1 : 0 }));

        const picks = [];
        while (pool.length && picks.length < 6) {
          const index = Math.floor(Math.random() * pool.length);
          picks.push(pool.splice(index, 1)[0]);
        }
        currentShopRuneStock = picks;
      }

      return currentShopRuneStock;
    }

    function getRuneBuyPrice(entry) {
      const level = Number(entry.level || 0);
      return Math.max(25, Math.round(40 + currentFloor * 4 + level * 120));
    }

    function renderShopBuyRuneRow(entry) {
      const rune = typeof getRuneById === "function" ? getRuneById(entry.runeId) : null;
      const image = rune && rune.image ? rune.image : "rune1.png";
      const name = typeof getRuneDisplayName === "function" ? getRuneDisplayName(entry.runeId, entry.level || 0) : entry.runeId;
      const price = getRuneBuyPrice(entry);

      return `
        <button class="shopRow" onclick="buyShopRune('${entry.runeId}', ${Number(entry.level || 0)}, ${price})">
          ${shopIconHtml(image, "runes")}
          <div class="shopRowText">
            <div class="shopRowName">${name}</div>
            <div class="shopRowSub">Random rune stock</div>
          </div>
          <div class="shopRowValue">${price}g</div>
        </button>
      `;
    }

    function buyShopRune(runeId, level, price) {
      if (player.gold < price) {
        setMessage("Not enough gold.");
        return;
      }

      if (typeof addRune !== "function") {
        setMessage("Rune loader not found.");
        return;
      }

      player.gold -= price;
      addRune(player, runeId, level, 1);
      setMessage(`Bought ${typeof getRuneDisplayName === "function" ? getRuneDisplayName(runeId, level) : runeId}.`);

      if (gameMode === "shrine") {
        if (document.getElementById("inventoryTitle")?.textContent === "Rune Peddler") renderFloorRuneShop();
        else renderShrineBuy();
      }
    }

    function rerollShopGear(category) {
      const key = category === "Armor" ? "Armor" : "Weapons";
      const freeUsed = shopFreeRerollUsedFloor === currentFloor;
      const cost = Math.max(10, currentFloor * 25);

      if (freeUsed) {
        if (player.gold < cost) {
          setMessage("Not enough gold to reroll.");
          return;
        }
        player.gold -= cost;
      } else {
        shopFreeRerollUsedFloor = currentFloor;
      }

      currentShopGearStock[key] = getRandomShopGearStock(key, 9);
      shopBuyPages[`buy:${key}`] = 0;
      setMessage(`${key} offers rerolled${freeUsed ? ` for ${cost} gold` : " for free"}.`);
      renderShrineBuy();

    function getSkillShopEntries(secretOnly = false) {
      ensurePlayerSkills();
      return getAllSkillList()
        .filter(skill => !ownsSkill(skill.skillId))
        .filter(skill => secretOnly ? skill.secret : !skill.secret && skill.shop !== "starter")
        .filter(skill => Number(player.level || 1) >= Math.max(1, Number(skill.levelReq || 1) - 2))
        .sort((a, b) => a.levelReq !== b.levelReq ? a.levelReq - b.levelReq : String(a.name).localeCompare(String(b.name)));
    }

    function getSkillBuyPrice(skill, secretOnly = false) {
      const base = Number(skill.price || 0) || (60 + Number(skill.levelReq || 1) * 35 + Number(skill.mpCost || 0) * 4);
      return Math.max(20, Math.floor(base * (secretOnly ? 1.25 : 1)));
    }

    function renderShopBuySkillRow(skill, secretOnly = false) {
      if (!skill) return "";
      const price = getSkillBuyPrice(skill, secretOnly);
      const locked = Number(player.level || 1) < Number(skill.levelReq || 1);
      return `
        <button class="shopRow ${locked ? "locked" : ""}" ${locked ? "" : `onclick="buyShopSkill('${skill.skillId}', ${price}, ${secretOnly ? "true" : "false"})"`}>
          ${shopIconHtml("", "items")}
          <div class="shopRowText">
            <div class="shopRowName">${skill.name}</div>
            <div class="shopRowSub">Req Lv ${skill.levelReq} · ${skill.description || "Skill"}</div>
          </div>
          <div class="shopRowValue">${locked ? "Locked" : price + "g"}</div>
        </button>`;
    }

    function buyShopSkill(skillId, price, secretOnly = false) {
      ensurePlayerSkills();
      const skill = normalizeSkillForList(skillId);
      if (!skill) { setMessage("That skill is not available."); return; }
      if (ownsSkill(skillId)) { setMessage(`You already know ${skill.name}.`); return; }
      if (Number(player.level || 1) < Number(skill.levelReq || 1)) { setMessage(`${skill.name} requires Level ${skill.levelReq}.`); return; }
      if (player.gold < price) { setMessage("Not enough gold."); return; }
      player.gold -= price;
      unlockSkill(skillId, true);
      saveGameState();
      setMessage(`Learned ${skill.name}.`);
      const title = document.getElementById("inventoryTitle")?.textContent || "";
      if (title === "Skill Trainer") renderFloorSkillShop(false);
      else if (title === "Hidden Skill Seller") renderFloorSkillShop(true);
      else renderShrineBuy();
    }

    function renderFloorSkillShop(secretOnly = false) {
      const title = secretOnly ? "Hidden Skill Seller" : "Skill Trainer";
      setOverlayTitle(title);
      hideInventoryTabs();
      const entries = getSkillShopEntries(secretOnly);
      const mode = secretOnly ? "floor_secret_skills" : "floor_skills";
      const visible = getShopPageItems(mode, "Skills", entries);
      const content = document.getElementById("inventoryContent");
      content.style.overflowY = "hidden";
      content.innerHTML = `
        ${floorNpcHeroHtml(title, secretOnly ? "Rare techniques, expensive lessons." : "Common combat techniques and support skills.")}
        <div class="menuHeader"><span>Buy Skills</span><span>Gold: ${player.gold}</span></div>
        <div class="shopPagedList">
          ${visible.map(skill => renderShopBuySkillRow(skill, secretOnly)).join("") || `<div class="smallNote">No skills available.</div>`}
        </div>
        ${getShopPageControlsHtml(mode, "Skills", entries.length)}
        <div class="shopMenuList">${renderFloorNpcBackRow()}</div>`;
    }

    function renderShrineBuy() {
      setOverlayTitle("Buy");
      hideInventoryTabs();
      ensureShrineStoneData();

      const content = document.getElementById("inventoryContent");
      content.style.overflowY = "hidden";

      const consumables = getAllShopConsumables();
      const category = getShopCategoryKey(shopBuyCategoryIndex, "buy");

      let entries = [];
      let categoryHtml = "";
      let afterPageHtml = "";

      if (category === "Consumables") {
        entries = consumables;
        const visible = getShopPageItems("buy", category, entries);

          ? visible.map(renderShopBuySupplyRow).join("")
          : `<div class="smallNote">No consumables available.</div>`;

        entries = SHOP_KEY_ITEMS;

        categoryHtml = visible.length
          ? visible.map(renderShopBuyKeyRow).join("")
          : `<div class="smallNote">No key items available.</div>`;
      }

      let html = `
        ${shrineHeroHtml("merchant")}
        <div class="menuHeader">
          <span>Buy</span>
          <span>Gold: ${player.gold}</span>
        </div>

        <div class="shopPagedList">

      if (player.gold < price) {
        setMessage("Not enough gold.");
        return;
      }

      if (!addConsumableSafe(itemId, 1)) {
        setMessage("That item is not available.");
        return;
      }

      player.gold -= price;
      setMessage(`Bought ${getSafeItemName(itemId)} for ${price} gold.`);

      const title = document.getElementById("inventoryTitle")?.textContent || "";
      if (title === "Field Supplier") renderFloorConsumableShop();
      else renderShrineBuy();
    }

    function buyShopKeyItem(itemId, price) {
      if (player.gold < price) {
        setMessage("Not enough gold.");
        return;
      }

      if (typeof addKeyItem !== "function" || !addKeyItem(player, itemId)) {
        setMessage("That key is not available.");
        return;
      }

      player.gold -= price;
      setMessage(`Bought ${getItemDisplayName(itemId)} for ${price} gold.`);

      if (player.gold < price) {
        setMessage("Not enough gold.");
        return;

      const item = getEquipItem(itemId);
      if (!item) {
        setMessage("That equipment is not available.");
        return;
      }

      if (ownsEquipment(itemId)) {
        setMessage(`You already own ${getEquipName(itemId)}.`);
        return;
      }

      player.gold -= price;

      setMessage(result && result.message ? result.message : `Bought ${getEquipName(itemId)}.`);
      renderShrineBuy();

      return Object.entries(player.inventory.consumables || {})
        .filter(([, quantity]) => Number(quantity) > 0)
        .map(([itemId, quantity]) => ({ itemId, quantity, type: "consumable" }));

    function isEquipmentCurrentlyEquipped(itemId) {
      return Object.values(player.equipment || {}).includes(itemId);

    function getSellableEquipmentEntries() {
      ensureFullInventoryShape();

    function getSellableKeyEntries() {
      ensureFullInventoryShape();
      return Object.keys(player.inventory.keyitems || {})
        .filter(itemId => {
          const item = typeof getKeyItem === "function" ? getKeyItem(itemId) : null;
          return item && Number(item.value || 0) > 0;
        })
        .map(itemId => ({ itemId, type: "keyitem" }));
    }

    function renderSellConsumableRow(entry) {
      const item = getConsumableSafe(entry.itemId);

    function sellShopConsumable(itemId, price) {
      ensureFullInventoryShape();
      const quantity = Number(player.inventory.consumables[itemId] || 0);

      if (quantity <= 0) {
        setMessage("You do not have that item.");
        renderShrineSell();
        return;
      }

      if (!confirmAction(`Sell ${getSafeItemName(itemId)} for ${price} gold?`)) {
        setMessage("Sale cancelled.");
        renderShrineSell();
        return;
      }

      player.inventory.consumables[itemId] = quantity - 1;
      if (player.inventory.consumables[itemId] <= 0) delete player.inventory.consumables[itemId];

      player.gold += price;
      addLeaderboardGold(price);
      setMessage(`Sold ${getSafeItemName(itemId)} for ${price} gold.`);
      renderShrineSell();
    }

    function sellShopKeyItem(itemId, price) {
      ensureFullInventoryShape();

      if (!player.inventory.keyitems[itemId]) {
        setMessage("You do not own that key.");
        renderShrineSell();
        return;
      }

      if (!confirmAction(`Sell ${getSafeItemName(itemId)} for ${price} gold?`)) {
        setMessage("Sale cancelled.");
        renderShrineSell();
        return;
      }

      delete player.inventory.keyitems[itemId];
      player.gold += price;
      addLeaderboardGold(price);
      setMessage(`Sold ${getSafeItemName(itemId)} for ${price} gold.`);
      renderShrineSell();
    }

    function sellShopEquipment(itemId, price) {
      ensureFullInventoryShape();

      if (isEquipmentCurrentlyEquipped(itemId)) {
        setMessage("Unequip that item before selling it.");
        renderShrineSell();
        return;
      }

      const record = player.inventory.equipment[itemId];
      if (!record || !record.owned) {
        setMessage("You do not own that item.");
        renderShrineSell();
        return;
      }

      if (!confirmAction(`Sell ${getEquipName(itemId)} for ${price} gold?`)) {
        setMessage("Sale cancelled.");
        renderShrineSell();
        return;
      }

      delete player.inventory.equipment[itemId];
      player.gold += price;
      addLeaderboardGold(price);
      setMessage(`Sold ${getEquipName(itemId)} for ${price} gold.`);
      renderShrineSell();
    }

          <span>2 matching → +1</span>

        <div class="shopMenuList">

        html += `
          <div class="smallNote">No rune stacks are ready to combine.</div>

            ${shopIconHtml(entry.image, "runes")}
            <div class="shopRowText">
              <div class="shopRowName">${entry.displayName}</div>
              <div class="shopRowSub">${entry.statLine}</div>

    function combineRune(runeId, level) {
      if (level >= 3) {
        setMessage("That rune is already at maximum level.");
        return;
      }

      if (getRuneQuantity(player, runeId, level) < 2) {
        setMessage("You need two matching runes.");
        renderRuneCombine();
        return;
      }

      if (!confirmAction(`Combine 2 matching runes into ${getRuneDisplayName(runeId, level + 1)}?`)) {
        setMessage("Rune combine cancelled.");
        renderRuneCombine();
        return;
      }

      removeRune(player, runeId, level, 2);
      addRune(player, runeId, level + 1, 1);

      setMessage(`Combined into ${getRuneDisplayName(runeId, level + 1)}.`);
      renderRuneCombine();
    }

    function getUpgradeableEquipmentEntries() {
      ensureFullInventoryShape();
      return Object.entries(player.inventory.equipment || {})
        .filter(([itemId, record]) => {
          const item = getEquipItem(itemId);
          return record && record.owned && item && (item.slot === "weapon" || item.slot === "armor");
        })
        .map(([itemId, record]) => {
          const item = getEquipItem(itemId);
          const level = Number(record.level || 0);
          const tier = getEquipmentTierNumber(item);
          const cost = Math.max(10, Math.round((item.value || 10) * 0.75 + (level + 1) * tier * 25));
          return { itemId, item, record, level, cost };
        });
    }

      const rows = getUpgradeableEquipmentEntries();

      let html = `
        ${shrineHeroHtml("merchant")}
        <div class="menuHeader">
          <span>Equipment Upgrade</span>
          <span>Gold: ${player.gold}</span>
        </div>
        <div class="oneColList">
      `;

        html += `<div class="smallNote">No owned weapons or armor to upgrade.</div>`;
      } else {

          <button class="shopRow" onclick="upgradeEquipmentItem('${row.itemId}', ${row.cost})">
            ${getEquipmentShopIconHtml(row.item)}
            <div class="shopRowText">
              <div class="shopRowName">${row.item.itemName} +${row.level}</div>
              <div class="shopRowSub">${row.item.slot.toUpperCase()} · Upgrade to +${row.level + 1}</div>

            <div class="shopRowValue">${row.cost}g</div>
          </button>
        `).join("");
      }

      html += `
        </div>
        <div class="shopMenuList">
          <button class="shopRow shopBackRow" onclick="returnFromServiceShop()">
            ${shopIconHtml("", "items")}
            <div class="shopRowText">
              <div class="shopRowName">Back</div>
              <div class="shopRowSub">Return to Ollie</div>
            </div>
            <div class="shopRowValue">Shop</div>
          </button>
        </div>

    function upgradeEquipmentItem(itemId, cost) {
      const item = getEquipItem(itemId);
      const record = getOwnedEquipmentRecord(itemId);

      if (!item || !record || !record.owned) {
        setMessage("You do not own that equipment.");
        renderEquipmentUpgrade();
        return;
      }

      if (player.gold < cost) {
        setMessage("Not enough gold.");
        return;
      }

      player.gold -= cost;
      record.level = Number(record.level || 0) + 1;
      record.pending = 0;
      recalcDerivedStats();
      updateBars();
      setMessage(`${item.itemName} upgraded to +${record.level}.`);
      renderEquipmentUpgrade();

    function renderSocketUnlock() {
      setOverlayTitle("Unlock Sockets");
      hideInventoryTabs();

      const content = document.getElementById("inventoryContent");
      content.style.overflowY = "auto";

      const rows = ["weapon", "armor"].map(slot => {
        const itemId = player.equipment[slot];
        if (!itemId) return null;

        const item = getEquipItem(itemId);
        const record = getOrCreateEquipmentRecord(itemId);
        normalizeEquipmentSockets(itemId);

        if (!item || !item.maxSockets) return null;

        const unlocked = record.socketsUnlocked || 0;
        const max = item.maxSockets || 0;
        const canUnlock = unlocked < max;
        const cost = 50 * (unlocked + 1);

        return { slot, itemId, item, record, unlocked, max, canUnlock, cost };
      }).filter(Boolean);

      let html = `
        ${shrineHeroHtml("merchant")}
        <div class="menuHeader">
          <span>Weapon / Armor Sockets</span>
          <span>Gold: ${player.gold}</span>
        </div>
        <div class="shopMenuList">
      `;

      if (!rows.length) {
        html += `<div class="smallNote">No socketable equipment is equipped.</div>`;
      } else {
        html += rows.map(row => `
          <button class="shopRow" ${row.canUnlock ? `onclick="unlockSocket('${row.slot}', ${row.cost})"` : ""}>
            ${shopIconHtml("rune6.png", "runes")}
            <div class="shopRowText">
              <div class="shopRowName">${getEquipName(row.itemId)}</div>
              <div class="shopRowSub">${row.unlocked}/${row.max} sockets unlocked</div>
            </div>
            <div class="shopRowValue">${row.canUnlock ? row.cost + "g" : "Max"}</div>
          </button>
        `).join("");
      }

      html += `
          <button class="shopRow shopBackRow" onclick="returnFromServiceShop()">
            ${shopIconHtml("", "items")}
            <div class="shopRowText">
              <div class="shopRowName">Back</div>
              <div class="shopRowSub">Return to Ollie</div>
            </div>
            <div class="shopRowValue">Shop</div>
          </button>
        </div>
      `;

      content.innerHTML = html;
    }

    function unlockSocket(slot, cost) {
      const itemId = player.equipment[slot];
      if (!itemId) return;

      const item = getEquipItem(itemId);
      const record = getOrCreateEquipmentRecord(itemId);

      normalizeEquipmentSockets(itemId);

      if (!item || !item.maxSockets) {
        setMessage("This item cannot hold runes.");
        return;
      }

      if ((record.socketsUnlocked || 0) >= item.maxSockets) {
        setMessage("All sockets are already unlocked.");
        renderSocketUnlock();
        return;
      }

      if (player.gold < cost) {
        setMessage("Not enough gold.");
        return;
      }

      player.gold -= cost;
      record.socketsUnlocked += 1;
      normalizeEquipmentSockets(itemId);

      setMessage(`Unlocked a socket on ${getEquipName(itemId)}.`);
      renderSocketUnlock();
    }

    function randomFromList(list) {
      if (!Array.isArray(list) || !list.length) return null;
      return list[Math.floor(Math.random() * list.length)];
    }

    function getChestConsumablePool() {
      const ids = ["potion", "copper_potion", "mana_potion", "copper_mana_potion", "antidote"];
      if (currentFloor >= 4) ids.push("silver_potion", "silver_mana_potion", "smoke_bomb");
      if (currentFloor >= 6) ids.push("shrine_stone");
      if (currentFloor >= 8) ids.push("gold_potion", "gold_mana_potion", "rejuvenation_potion");
      return ids.filter(id => id === "shrine_stone" || (typeof getConsumable === "function" && getConsumable(id)));
    }

    function getChestEquipmentPool() {
      const allEquipment = typeof getAllEquipment === "function" ? getAllEquipment() : [];
      const allowedCharacters = ["all", player.character].filter(Boolean);
      return allEquipment.filter(item => {
        if (!item || (item.slot !== "weapon" && item.slot !== "armor")) return false;
        if (item.character && !allowedCharacters.includes(String(item.character).toLowerCase())) return false;
        return Number(item.reqLevel || 1) <= currentFloor + 2;
      });
    }

    function openCurrentChestLoot() {
      const messages = [];
      const baseGoldAmount = Math.max(5, Math.round(8 + Math.random() * 12 + currentFloor * (3 + Math.random() * 3)));
      const goldAmount = applyGoldFind(baseGoldAmount);
      player.gold += goldAmount;
      addLeaderboardGold(goldAmount);
      messages.push(`${goldAmount} gold`);

      const consumableId = randomFromList(getChestConsumablePool());
      if (consumableId) {
        addConsumableSafe(consumableId, 1);
        messages.push(getSafeItemName(consumableId));
      }

      if (Math.random() < 0.20) {
        const keyId = Math.random() < 0.82 ? "generic_key" : "boss_key";
        if (typeof addKeyItem === "function" && getKeyItem(keyId)) {
          addKeyItem(player, keyId);
          messages.push(getItemDisplayName(keyId));
        }
      }

      if (Math.random() < 0.30) {
        const item = randomFromList(getChestEquipmentPool());
        if (item) {
          const result = addEquipmentToInventory(item.itemId);
          if (result && result.ok) messages.push(item.itemName);
          else {
            const bonusGold = Math.max(1, getSellPrice(item.itemId));
            player.gold += bonusGold;
            addLeaderboardGold(bonusGold);
            messages.push(`${bonusGold} bonus gold`);
          }
        }
      }

      if (typeof getRuneInventoryList === "function" && typeof addRune === "function" && Math.random() < 0.25) {
        const runeIds = ["fehu", "uruz", "thurisaz", "ansuz", "raidho", "kenaz", "gebo", "hagalaz", "isa", "eihwaz", "algiz", "sowilo"]
          .filter(id => typeof getRuneById === "function" && getRuneById(id));
        const runeId = randomFromList(runeIds);
        if (runeId) {
          addRune(player, runeId, 0, 1);
          messages.push(getRuneDisplayName(runeId, 0));
        }
      }

      return messages;
    }

    function doAction() {
      if (menuIsOpen()) return;
      if (gameMode === "encounter") return;

      const currentTile = getTile(playerX, playerY);
      const key = tileKey(playerX, playerY);

      if (currentTile === "E") {
        if (typeof playSound === "function") playSound("ui_click");
        openLimitedShrineMenu();
        return;
      }

      if (currentTile === "C") {
        if (openedChests.has(key)) {
          setMessage("The chest is already empty.");
          return;
        }

        openedChests.add(key);

        const lootMessages = openCurrentChestLoot();

        updateRoomView();
        if (typeof playSound === "function") playSound("chest_open");
        playChestOpened();
        setMessage(`You opened the chest. Found ${lootMessages.join(", ")}.`);
        return;
      }
      if (currentTile === "S") {
        if (typeof playSound === "function") playSound("ui_click");
        openShrineMenu();
        return;
      }

      if (currentTile === "N") {
        if (typeof playSound === "function") playSound("ui_click");
        openFloorNpcMenu();
        return;
      }

      const front = getRelativeTile(0);

      if (front.tile === "#") {
        setMessage("You inspect the wall.");
        return;
      }

      setMessage("You inspect the room.");
    }

    // =========================
    // ENCOUNTER TEST
    // =========================



    const SKILL_DATA = (typeof window !== "undefined" && window.SKILL_DATA) ? window.SKILL_DATA : {
      blade_rush: { id:"blade_rush", name:"Blade Rush", type:"monster", category:"physical", levelReq:1, mpCost:10, ownedDefault:true, baseMultiplier:1.55, ultimateMultiplier:3.25, piercePct:20, ultimatePiercePct:55, description:"Fast physical attack." },
      armor_break: { id:"armor_break", name:"Armor Break", type:"monster", category:"physical", levelReq:1, mpCost:8, ownedDefault:true, baseMultiplier:1.25, ultimateMultiplier:2.35, piercePct:45, ultimatePiercePct:80, description:"Physical attack with armor pierce." },
      vampiric_slash: { id:"vampiric_slash", name:"Vampiric Slash", type:"monster", category:"physical", levelReq:1, mpCost:12, ownedDefault:true, baseMultiplier:1.15, ultimateMultiplier:2.25, piercePct:10, ultimatePiercePct:30, lifeStealPct:35, ultimateLifeStealPct:75, description:"Steals health from the enemy." }
    };

    function ensurePlayerSkills() {
      if (!player.skills || typeof player.skills !== "object") player.skills = {};
      ensureFullInventoryShape();

      if (!player.skills.ultimate) player.skills.ultimate = "blade_rush";
      if (!player.skills.base1) player.skills.base1 = "armor_break";
      if (!player.skills.base2) player.skills.base2 = "vampiric_slash";
      if (!Number.isFinite(Number(player.skills.ultimateCharge))) player.skills.ultimateCharge = 0;

      ["blade_rush", "armor_break", "vampiric_slash"].forEach(skillId => unlockSkill(skillId, true));
      player.skills.ultimateCharge = clampNumber(Number(player.skills.ultimateCharge) || 0, 0, 100);
    }

    function getEquippedSkillId(slot) {
      ensurePlayerSkills();
      return player.skills[slot] || "blade_rush";
    }

    function getSkillData(skillId) {
      return SKILL_DATA[skillId] || SKILL_DATA.blade_rush;
    }

    function getSkillNameForSlot(slot) {
      return getSkillData(getEquippedSkillId(slot)).name;
    }

    function getSkillMpCost(slot) {
      const data = getSkillData(getEquippedSkillId(slot));
      return Math.max(0, Number(data.mpCost || 0));
    }

    function getSkillIdList() { return Object.keys(SKILL_DATA || {}); }

    function ownsSkill(skillId) {
      ensureFullInventoryShape();
      if (!skillId || !SKILL_DATA[skillId]) return false;
      const skill = SKILL_DATA[skillId];
      return !!(skill.ownedDefault || player.inventory.skills?.[skillId]);
    }

    function unlockSkill(skillId, silent = false) {
      ensureFullInventoryShape();
      if (!skillId || !SKILL_DATA[skillId]) return false;
      player.inventory.skills[skillId] = true;
      if (!silent) setMessage(`${SKILL_DATA[skillId].name || skillId} learned.`);
      return true;
    }

    function getSkillLevelReq(skillId) {
      const skill = getSkillData(skillId);
      return Math.max(1, Number(skill.levelReq || 1));
    }

    function canUseSkillLevel(skillId) { return Number(player.level || 1) >= getSkillLevelReq(skillId); }

    function normalizeSkillForList(skillId) {
      const skill = getSkillData(skillId);
      if (!skill) return null;
      return {
        skillId,
        name: skill.name || skillId,
        type: skill.type || "monster",
        category: skill.category || "physical",
        levelReq: getSkillLevelReq(skillId),
        mpCost: Number(skill.mpCost || 0),
        baseMultiplier: Number(skill.baseMultiplier || skill.damageMultiplier || 1),
        ultimateMultiplier: Number(skill.ultimateMultiplier || skill.baseMultiplier || skill.damageMultiplier || 1),
        piercePct: Number(skill.piercePct || 0),
        ultimatePiercePct: Number(skill.ultimatePiercePct ?? skill.piercePct ?? 0),
        lifeStealPct: Number(skill.lifeStealPct || 0),
        ultimateLifeStealPct: Number(skill.ultimateLifeStealPct ?? skill.lifeStealPct ?? 0),
        shop: skill.shop || "basic",
        secret: !!skill.secret,
        price: Number(skill.price || 0),
        description: skill.description || "Skill"
      };
    }

    function getAllSkillList() { return getSkillIdList().map(normalizeSkillForList).filter(Boolean); }

    function getOwnedSkillList() {
      ensurePlayerSkills();
      return getSkillIdList().filter(ownsSkill).map(normalizeSkillForList).filter(Boolean);
    }

    function ensureSkillEffects() {
      if (!player.skillEffects || typeof player.skillEffects !== "object") player.skillEffects = {};
      return player.skillEffects;
    }

    function clearSkillEffects() { player.skillEffects = {}; }

    function getActiveSkillEffect(name) {
      const effects = ensureSkillEffects();
      const effect = effects[name];
      if (!effect || Number(effect.ticks || 0) <= 0) return null;
      return effect;
    }

    function tickPlayerSkillEffects() {
      const effects = ensureSkillEffects();
      Object.keys(effects).forEach(key => {
        const effect = effects[key];
        if (!effect) return;
        if (key === "manaRegen" && Number(effect.mpPerTick || 0) > 0) {
          player.mp = Math.min(player.maxMp, player.mp + Number(effect.mpPerTick || 0));
          updateBars();
        }
        effect.ticks = Number(effect.ticks || 0) - 1;
        if (effect.ticks <= 0) delete effects[key];
      });
    }

    function applySelfSkill(skillId, ultimate = false) {
      const skill = getSkillData(skillId);
      if (!skill) return false;
      const effects = ensureSkillEffects();
      const power = ultimate ? Number(skill.ultimatePower ?? skill.power ?? 0) : Number(skill.power ?? 0);
      const durationTicks = ultimate ? Number(skill.ultimateDurationTicks ?? skill.durationTicks ?? 28) : Number(skill.durationTicks ?? 20);

      if (skill.effect === "heal") {
        const amount = Math.max(1, Math.floor(power));
        player.hp = Math.min(player.maxHp, player.hp + amount);
        updateBars();
        showDamageNumber(`+${amount}`);
        setMessage(`${skill.name} restored ${amount} HP.`);
        return true;
      }

      if (skill.effect === "haste") {
        effects.haste = { ticks: durationTicks, speedPct: power, dodgePct: Number(skill.dodgePct || skill.ultimateDodgePct || 0) };
        setMessage(`${skill.name} increased speed.`);
        return true;
      }

      if (skill.effect === "iron_skin") {
        effects.ironSkin = { ticks: durationTicks, defensePct: power };
        setMessage(`${skill.name} hardened your defenses.`);
        return true;
      }

      if (skill.effect === "mana_regen") {
        effects.manaRegen = { ticks: durationTicks, mpPerTick: Math.max(1, Math.floor(power)) };
        setMessage(`${skill.name} started restoring MP.`);
        return true;
      }

      if (skill.effect === "weapon_enchant") {
        effects.weaponEnchant = { ticks: durationTicks, element: skill.element || "fire", elementPct: power };
        setMessage(`${skill.name} empowered your weapon.`);
        return true;
      }
      return false;
    }


    function gainUltimateCharge(amount) {
      ensurePlayerSkills();
      player.skills.ultimateCharge = clampNumber((Number(player.skills.ultimateCharge) || 0) + Number(amount || 0), 0, 100);
      updateCombatMetersUI();
    }

    function calculateSkillDamage(monster, slot, ultimate = false) {
      const skillId = getEquippedSkillId(slot);
      const data = getSkillData(skillId);
      const base = calculateAttackDamage(monster);
      const piercePct = ultimate ? Number(data.ultimatePiercePct ?? data.piercePct ?? 0) : Number(data.piercePct ?? 0);
      const multiplier = ultimate ? Number(data.ultimateMultiplier || 2.5) : Number(data.baseMultiplier || 1.25);
      const hits = ultimate ? Number(data.ultimateHits || data.hits || 1) : Number(data.hits || 1);
      const rawAttack = getPlayerAttackValue();
      const perHitPhysical = applyMitigation(Math.floor(rawAttack * multiplier), getPhysicalMitigationValue(monster, piercePct));
      const physical = Math.max(1, perHitPhysical * Math.max(1, hits));
      let fire = ultimate ? Math.floor(base.fire * 1.5) : base.fire;
      let shock = ultimate ? Math.floor(base.shock * 1.5) : base.shock;
      let ice = ultimate ? Math.floor((base.ice || 0) * 1.5) : (base.ice || 0);
      let holy = ultimate ? Math.floor((base.holy || 0) * 1.5) : (base.holy || 0);
      let dark = ultimate ? Math.floor((base.dark || 0) * 1.5) : (base.dark || 0);
      const typeBonus = ultimate ? Math.floor(base.typeBonus * 1.5) : base.typeBonus;
      if (data.element) {
        const elementPower = Math.floor(getBaseAttackValue() * Number(data.elementPct || 25) / 100);
        if (data.element === "fire") fire += applyElementMitigation(elementPower, monster, "fire");
        if (data.element === "shock") shock += applyElementMitigation(elementPower, monster, "shock");
        if (data.element === "ice") ice += applyElementMitigation(elementPower, monster, "ice");
        if (data.element === "holy") holy += applyElementMitigation(elementPower, monster, "holy");
        if (data.element === "dark") dark += applyElementMitigation(elementPower, monster, "dark");
      }
      const total = physical + fire + shock + ice + holy + dark + typeBonus;
      const stealPct = ultimate ? Number(data.ultimateLifeStealPct ?? data.lifeStealPct ?? 0) : Number(data.lifeStealPct ?? 0);
      return { physical, fire, shock, ice, holy, dark, typeBonus, total, lifeSteal: Math.floor(total * stealPct / 100) };
    }

    function applyPlayerDamageToEnemy(damage, chargeGain = 0) {
      if (!currentEnemy || !damage) return;

      currentEnemy.currentHp -= damage.total;

      if (typeof playPlayerAttackSound === "function") playPlayerAttackSound(player);
      if (damage.fire > 0 && typeof playSound === "function") playSound("fire_attack");

      playCombatEffect(getAttackEffectType(damage), String(damage.total));
      playMonsterHit();

      if (damage.lifeSteal > 0) {
        player.hp = Math.min(player.maxHp, player.hp + damage.lifeSteal);
        updateBars();
      }

      if (chargeGain > 0) gainUltimateCharge(chargeGain);

      updateMonsterHud();
      updateCombatMetersUI();

      if (currentEnemy.currentHp <= 0) {
        defeatEnemy();
      }
    }

    function useBaseSkill(slot) {
      if (!currentEnemy) return;
      if (playerAttackMeter < 100) { updateCombatMetersUI(); return; }
      ensurePlayerSkills();
      const skillId = getEquippedSkillId(slot);
      const skill = getSkillData(skillId);
      const cost = getSkillMpCost(slot);
      if (!ownsSkill(skillId) || !canUseSkillLevel(skillId)) { setMessage(`${skill.name} is not available yet.`); updateCombatMetersUI(); return; }
      if (player.mp < cost) { setMessage(`Not enough MP for ${getSkillNameForSlot(slot)}.`); updateCombatMetersUI(); return; }
      player.mp -= cost;
      playerAttackMeter = 0;
      if (skill.type === "self") { applySelfSkill(skillId, false); gainUltimateCharge(7); }
      else { applyPlayerDamageToEnemy(calculateSkillDamage(currentEnemy, slot, false), 9); }
      updateBars();
      updateCombatMetersUI();
    }

    function useUltimateSkill() {
      if (!currentEnemy) return;
      ensurePlayerSkills();
      const skillId = getEquippedSkillId("ultimate");
      const skill = getSkillData(skillId);
      if (player.skills.ultimateCharge < 100) { updateCombatMetersUI(); return; }
      if (!ownsSkill(skillId) || !canUseSkillLevel(skillId)) { setMessage(`${skill.name} is not available yet.`); updateCombatMetersUI(); return; }
      player.skills.ultimateCharge = 0;
      if (skill.type === "self") applySelfSkill(skillId, true);
      else applyPlayerDamageToEnemy(calculateSkillDamage(currentEnemy, "ultimate", true), 0);
      updateBars();
      updateCombatMetersUI();
    }

    function setMeterButton(button, label, fillPct, ready = true, noMp = false, mpCost = null) {
      if (!button) return;
      const pct = clampNumber(fillPct, 0, 100);
      button.style.setProperty("--fill", `${pct}%`);
      button.classList.toggle("ready", ready);
      button.classList.toggle("notReady", !ready);
      button.classList.toggle("noMp", !!noMp);

      const cost = Number(mpCost);
      const badge = Number.isFinite(cost) && cost > 0
        ? `<span class="skillMpBadge">MP ${Math.floor(cost)}</span>`
        : "";

      button.innerHTML = `<span>${label}</span>${badge}`;
    }

    const COMBAT_TICK_MS = 250;
    let combatTimer = null;
    let playerAttackMeter = 100;
    let enemyAttackMeter = 0;

    function clampNumber(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function getPlayerSpeedValue() {
      const bonuses = typeof getEquipmentBonusTotals === "function" ? getEquipmentBonusTotals() : {};
      const base = Number(player.speed || player.spd || 0);
      const bonus = Number(bonuses.speed || bonuses.spd || 0);
      const haste = getActiveSkillEffect("haste");
      const speedPct = haste ? Number(haste.speedPct || 0) : 0;
      return Math.max(0, Math.floor((base + bonus) * (1 + speedPct / 100)));
    }

    function getPlayerDodgeValue() {
      const bonuses = typeof getEquipmentBonusTotals === "function" ? getEquipmentBonusTotals() : {};
      const baseDodge = Number(bonuses.dodge || 0);
      const haste = getActiveSkillEffect("haste");
      const hasteDodge = haste ? Number(haste.dodgePct || 0) : 0;
      return clampNumber(baseDodge + hasteDodge, 0, 75);
    }


    function getMonsterSpeedValue(monster) {
      if (!monster) return 0;
      const value = monster.speed ?? monster.spd ?? monster.SPD ?? monster.Speed ?? 0;
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(0, n) : 0;
    }

    function getMonsterLevelValue(monster) {
      if (!monster) return 1;
      const value = monster.level ?? monster.lv ?? monster.monLevel ?? monster.Level ?? 1;
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(1, Math.floor(n)) : 1;
    }

    function getMonsterMaxHpValue(monster) {
      if (!monster) return 1;
      const value = monster.maxHp ?? monster.hp ?? monster.HP ?? monster.life ?? 1;
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(1, Math.floor(n)) : 1;
    }

    function getMonsterCurrentHpValue(monster) {
      if (!monster) return 0;
      const value = monster.currentHp ?? monster.hp ?? monster.HP ?? monster.life ?? 1;
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(0, Math.floor(n)) : 0;
    }

    function attackIntervalFromSpeed(speed) {
      // Slower base pacing, Speed still reduces delay, and there is no hard min/max cap. Base wait is about 4600ms.
      // Extreme Speed builds are allowed to break the curve by design.
      return 4600 / (1 + Math.max(0, Number(speed) || 0) * 0.04);
    }

    function meterGainForSpeed(speed) {
      return (COMBAT_TICK_MS / attackIntervalFromSpeed(speed)) * 100;
    }

    function updateMonsterHud() {
      const hudName = document.getElementById("monsterNameText");
      const hudLevel = document.getElementById("monsterLevelText");
      const hpBar = document.getElementById("monsterHpBar");
      const hpText = document.getElementById("monsterHpText");

      if (!currentEnemy) {
        if (hudName) hudName.textContent = "Monster";
        if (hudLevel) hudLevel.textContent = "Lv. 1";
        if (hpBar) hpBar.style.width = "0%";
        if (hpText) hpText.textContent = "HP 0 / 0";
        return;
      }

      const currentHp = getMonsterCurrentHpValue(currentEnemy);
      const maxHp = getMonsterMaxHpValue(currentEnemy);
      const level = getMonsterLevelValue(currentEnemy);
      const speed = getMonsterSpeedValue(currentEnemy);

      if (hudName) hudName.textContent = currentEnemy.monName || currentEnemy.name || "Monster";
      if (hudLevel) hudLevel.textContent = `Lv. ${level}`;
      if (hpBar) hpBar.style.width = `${clampNumber(currentHp / maxHp * 100, 0, 100)}%`;
      if (hpText) hpText.textContent = `HP ${currentHp} / ${maxHp} · SPD ${speed}`;
    }

    function updateCombatMetersUI() {
      ensurePlayerSkills();

      const attackButton = document.getElementById("attackButton");
      const ultimateButton = document.getElementById("ultimateSkillButton");
      const base1Button = document.getElementById("baseSkill1Button");
      const base2Button = document.getElementById("baseSkill2Button");
      const enemyMeter = document.getElementById("monsterAttackMeter");
      const enemyAttackText = document.getElementById("monsterAttackText");

      const waitPct = clampNumber(playerAttackMeter, 0, 100);
      const ready = waitPct >= 100;
      const enemyReadyPct = clampNumber(enemyAttackMeter, 0, 100);

      setMeterButton(attackButton, "Attack", waitPct, ready, false);

      const base1Cost = getSkillMpCost("base1");
      const base2Cost = getSkillMpCost("base2");
      setMeterButton(base1Button, getSkillNameForSlot("base1"), waitPct, ready && player.mp >= base1Cost, player.mp < base1Cost, base1Cost);
      setMeterButton(base2Button, getSkillNameForSlot("base2"), waitPct, ready && player.mp >= base2Cost, player.mp < base2Cost, base2Cost);

      const ultimateReady = player.skills.ultimateCharge >= 100;
      setMeterButton(ultimateButton, getSkillNameForSlot("ultimate"), player.skills.ultimateCharge, ultimateReady, false);

      if (enemyMeter) enemyMeter.style.width = `${enemyReadyPct}%`;
      if (enemyAttackText) enemyAttackText.textContent = `Attack ${Math.floor(enemyReadyPct)}%`;

      updateMonsterHud();
    }

    function stopCombatTimer() {
      if (combatTimer) {
        clearInterval(combatTimer);
        combatTimer = null;
      }
      playerAttackMeter = 100;
      enemyAttackMeter = 0;
      updateCombatMetersUI();
    }

    function startCombatTimer() {
      stopCombatTimer();
      playerAttackMeter = 100;
      enemyAttackMeter = 0;
      updateCombatMetersUI();

      combatTimer = window.setInterval(() => {
        if (gameMode !== "encounter" || !currentEnemy) {
          stopCombatTimer();
          return;
        }

        playerAttackMeter = Math.min(100, playerAttackMeter + meterGainForSpeed(getPlayerSpeedValue()));
        enemyAttackMeter += meterGainForSpeed(getMonsterSpeedValue(currentEnemy));

        if (enemyAttackMeter >= 100) {
          enemyAttackMeter -= 100;
          enemyAttack("");
        }

        tickPlayerSkillEffects();
        updateCombatMetersUI();
      }, COMBAT_TICK_MS);
    }


    function startEncounter(poolId, encounterKey, tileType = "M") {
      let rolledMonster = null;

      // Preferred current loader: select by theme + floor directly.
      // This prevents errors like "No monster found for c15" when older pool ids are interpreted literally.
      if (typeof getRandomMonsterForTheme === "function") {
        rolledMonster = getRandomMonsterForTheme(currentFloorTheme, tileType, currentFloor);
      } else if (typeof getRandomMonsterFromPool === "function") {
        // Backward-compatible fallback for older monsterLoader.js.
        rolledMonster = getRandomMonsterFromPool(poolId, tileType);
      } else {
        setMessage("Monster loader not found. Check script load order.");
        return;
      }

      if (!rolledMonster) {
        setMessage(`No monster found for ${currentFloorTheme} floor ${currentFloor}.`);
        return;
      }

      currentEnemy = { ...rolledMonster };
      currentEnemyTileKey = encounterKey || null;

      currentEnemy.maxHp = getMonsterMaxHpValue(currentEnemy);
      currentEnemy.currentHp = getMonsterCurrentHpValue(currentEnemy);
      if (currentEnemy.currentHp <= 0 || currentEnemy.currentHp > currentEnemy.maxHp) {
        currentEnemy.currentHp = currentEnemy.maxHp;
      }

      const monsterImg = document.getElementById("monsterLayer");
      setImageWithPngFallback(
        monsterImg,
        `assets/monsters/${forceWebpFileName(currentEnemy.image)}`,
        `assets/monsters/${String(currentEnemy.image || "").replace(/\.webp$/i, ".png")}`
      );

      setMode("encounter");
      clearSkillEffects();
      updateMonsterHud();
      startCombatTimer();
      showEncounterNotice(`${currentEnemy.monName} Lv ${currentEnemy.level || 1} appeared.`);
    }

    function getBaseAttackValue() {
      const bonuses = getEquipmentBonusTotals();
      return Math.max(1, 4 + Math.floor(player.str || 0) + (bonuses.atk || 0));
    }

    function getPlayerAttackValue() {
      const runeBonuses = getRuneBonusTotals();
      return Math.floor(getBaseAttackValue() * (1 + runeBonuses.attackPct / 100));
    }

    function getPlayerPdefValue() {
      const bonuses = getEquipmentBonusTotals();
      const runeBonuses = getRuneBonusTotals();
      const ironSkin = getActiveSkillEffect("ironSkin");
      const skillDefensePct = ironSkin ? Number(ironSkin.defensePct || 0) : 0;
      const base = (Number(bonuses.pdef || 0) + Math.floor((player.vitality || 0) / 8));
      return clampPct(base * (1 + (runeBonuses.defensePct + skillDefensePct) / 100), 0, 95);
    }

    function getPlayerDefenseValue() {
      // Compatibility wrapper. PDEF is physical mitigation percentage.
      return getPlayerPdefValue();
    }

    function getMonsterType(monster) {
      return (monster.monsterType || monster.MonsterType || monster.type || "normal").toLowerCase();
    }

    function getMonsterResistance(monster, key) {
      if (monster[key] === undefined) return 0;
      const n = Number(monster[key]);
      return Number.isFinite(n) ? n : 0;
    }

    function applyResistance(amount, resistancePct) {
      return Math.max(0, Math.floor(amount * (1 - resistancePct / 100)));
    }


    function clampPct(value, min = -95, max = 95) {
      const n = Number(value);
      if (!Number.isFinite(n)) return 0;
      return Math.max(min, Math.min(max, n));
    }

    function applyMitigation(amount, mitigationPct) {
      const base = Math.max(0, Number(amount) || 0);
      const pct = clampPct(mitigationPct, -95, 95);
      return Math.max(1, Math.floor(base * (1 - pct / 100)));
    }

    function getPhysicalMitigationValue(source, piercePct = 0) {
      const raw = Number(source?.pdef ?? source?.defense ?? source?.def ?? source?.pDef ?? 0) || 0;
      const pierced = raw * (1 - clampPct(piercePct, 0, 100) / 100);
      return clampPct(pierced, -95, 95);
    }

    function getResistanceValue(source, element) {
      if (!source || !element) return 0;
      const key = `${element}Res`;
      const legacyKey = `${element}Resist`;
      const weaknessKey = `${element}Weakness`;
      if (source[key] !== undefined) return clampPct(source[key], -95, 95);
      if (source[legacyKey] !== undefined) return clampPct(source[legacyKey], -95, 95);
      if (source[weaknessKey] !== undefined) return -Math.abs(clampPct(source[weaknessKey], 0, 95));
      return 0;
    }

    function applyElementMitigation(amount, target, element) {
      return Math.max(0, Math.floor(Math.max(0, Number(amount) || 0) * (1 - getResistanceValue(target, element) / 100)));
    }

    function getAveragePlayerResistanceValue() {
      const bonuses = typeof getEquipmentBonusTotals === "function" ? getEquipmentBonusTotals() : {};
      const values = [
        Number(bonuses.fireRes || 0),
        Number(bonuses.iceRes || 0),
        Number(bonuses.shockRes || 0),
        Number(bonuses.darkRes || 0)
      ];
      return values.reduce((a, b) => a + b, 0) / Math.max(1, values.length);
    }

    function ensureLeaderboardStats() {
      if (!player.leaderboardStats || typeof player.leaderboardStats !== "object") {
        player.leaderboardStats = {};
      }

      const stats = player.leaderboardStats;
      const defaults = {
        totalFloors: 0,
        totalRooms: 0,
        totalGold: 0,
        totalXp: 0,
        potionsUsed: 0,
        deaths: 0,
        kills: 0
      };

      Object.keys(defaults).forEach(key => {
        if (!Number.isFinite(Number(stats[key]))) stats[key] = defaults[key];
      });

      return stats;
    }

    function addLeaderboardGold(amount) {
      const n = Math.max(0, Math.floor(Number(amount) || 0));
      if (n <= 0) return;
      ensureLeaderboardStats().totalGold += n;
    }

    function addLeaderboardXp(amount) {
      const n = Math.max(0, Math.floor(Number(amount) || 0));
      if (n <= 0) return;
      ensureLeaderboardStats().totalXp += n;
    }

    function incrementLeaderboardStat(key, amount = 1) {
      const stats = ensureLeaderboardStats();
      stats[key] = Math.max(0, Math.floor(Number(stats[key] || 0) + Number(amount || 0)));
    }

    function getAttacksPerSecondFromSpeed(speed) {
      const baseSeconds = 4.6;
      const spd = Math.max(0, Number(speed) || 0);
      return (1 + spd / 100) / baseSeconds;
    }

    function formatThreatNumber(value) {
      const n = Math.max(0, Math.round(Number(value) || 0));
      if (n >= 1000000) return `${(n / 1000000).toFixed(n >= 10000000 ? 0 : 1)}m`;
      if (n >= 1000) return `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k`;
      return String(n);
    }

    const HARDINESS_WINDOW_SECONDS = 60;
    const HARDINESS_ASSUMED_INCOMING_APS = 0.5;
    const HARDINESS_ASSUMED_INCOMING_HIT = 50;

    function calculateCombatantHardiness(unit, options = {}) {
      const battleSeconds = Math.max(1, Number(options.battleSeconds ?? HARDINESS_WINDOW_SECONDS) || HARDINESS_WINDOW_SECONDS);
      const hp = Math.max(1, Number(unit?.maxHp ?? unit?.hp ?? 1) || 1);
      const attack = Math.max(0, Number(unit?.attack ?? unit?.atk ?? 0) || 0);
      const speed = Math.max(0, Number(unit?.speed ?? unit?.spd ?? 0) || 0);
      const lifeStealPct = Math.max(0, Number(unit?.lifeStealPct ?? unit?.lifeSteal ?? 0) || 0) / 100;
      const dodgePct = clampPct(unit?.dodgeChance ?? unit?.dodge ?? 0, 0, 95) / 100;

      const attacksPerSecond = getAttacksPerSecondFromSpeed(speed);
      const sustain = attack * attacksPerSecond * lifeStealPct * battleSeconds;
      const basePool = hp + sustain;

      const pdef = clampPct(getPhysicalMitigationValue(unit), -95, 95) / 100;
      const avgRes = clampPct(Number(unit?.averageRes ?? 0) || 0, -95, 95) / 100;

      // Hardiness is an additive survival estimate, not HP / remaining damage.
      const pdefAbsorption = basePool * pdef;
      const edefAbsorption = basePool * avgRes;

      const incomingAttacksPerSecond = Math.max(0, Number(options.incomingAttacksPerSecond ?? HARDINESS_ASSUMED_INCOMING_APS) || 0);
      const averageIncomingHit = Math.max(0, Number(options.averageIncomingHit ?? HARDINESS_ASSUMED_INCOMING_HIT) || 0);
      const dodgeAbsorption = incomingAttacksPerSecond * battleSeconds * dodgePct * averageIncomingHit;

      return Math.max(1, Math.round(basePool + pdefAbsorption + edefAbsorption + dodgeAbsorption));
    }

    function getPlayerHardinessValue() {
      const runeBonuses = getRuneBonusTotals();
      return calculateCombatantHardiness({
        maxHp: player.maxHp,
        attack: getPlayerAttackValue(),
        speed: getPlayerSpeedValue(),
        pdef: getPlayerPdefValue(),
        averageRes: getAveragePlayerResistanceValue(),
        dodge: getPlayerDodgeValue(),
        lifeStealPct: runeBonuses.lifeStealPct
      }, {
        battleSeconds: HARDINESS_WINDOW_SECONDS,
        incomingAttacksPerSecond: HARDINESS_ASSUMED_INCOMING_APS,
        averageIncomingHit: HARDINESS_ASSUMED_INCOMING_HIT
      });
    }

    function getMonsterAverageResistance(monster) {
      const vals = ["fire", "ice", "shock", "dark"].map(el => getResistanceValue(monster, el));
      return vals.reduce((a, b) => a + b, 0) / Math.max(1, vals.length);
    }

    function getMonsterExpectedHitAgainstPlayer(monster) {
      const physical = applyMitigation(Number(monster?.attack || 0), getPlayerPdefValue());
      let expected = physical;

      if (monster?.spell) {
        const chance = clampPct(monster.spell.chance ?? 0, 0, 100) / 100;
        const element = String(monster.spell.element || "").toLowerCase();
        const spellDamage = Number(monster.spell.damage || 0);
        const resisted = element ? applyElementMitigation(spellDamage, getEquipmentBonusTotals(), element) : spellDamage;
        expected += chance * Math.max(0, resisted);
      }

      if (monster?.ranged) {
        const chance = clampPct(monster.ranged.chance ?? 0, 0, 100) / 100;
        const rangedDamage = applyMitigation(Number(monster.ranged.damage || 0), getPlayerPdefValue());
        expected += chance * rangedDamage;
      }

      return Math.max(0, expected);
    }

    function getFloorIncomingAverages(floor, theme = currentFloorTheme) {
      if (typeof getMonsterIdsForTheme !== "function" || typeof getMonster !== "function" || typeof normalizeMonster !== "function" || typeof scaleMonster !== "function") {
        return { avgAps: 0, avgHit: 0 };
      }

      const floorLevel = Math.max(1, Math.floor(Number(floor) || 1));
      const themeCode = theme || currentFloorTheme;
      const ids = new Set([
        ...getMonsterIdsForTheme(themeCode, "M", floorLevel),
        ...getMonsterIdsForTheme(themeCode, "B", floorLevel)
      ]);

      let totalWeight = 0;
      let apsSum = 0;
      let hitSum = 0;

      ids.forEach(id => {
        const base = getMonster(id);
        const normalized = normalizeMonster(base);
        if (!normalized) return;
        const variants = typeof getScaledMonsterVariantsForFloor === "function"
          ? getScaledMonsterVariantsForFloor(normalized, floorLevel)
          : [scaleMonster(normalized, floorLevel)];

        variants.forEach(monster => {
          if (!monster) return;
          const weight = Math.max(1, Number(monster.rarityWeight || 100));
          totalWeight += weight;
          apsSum += getAttacksPerSecondFromSpeed(monster.speed) * weight;
          hitSum += getMonsterExpectedHitAgainstPlayer(monster) * weight;
        });
      });

      if (totalWeight <= 0) return { avgAps: 0, avgHit: 0 };
      return {
        avgAps: apsSum / totalWeight,
        avgHit: hitSum / totalWeight
      };
    }

    function getMonsterHardinessValue(monster) {
      return calculateCombatantHardiness({
        maxHp: monster?.maxHp ?? monster?.hp,
        attack: monster?.attack,
        speed: monster?.speed,
        pdef: monster?.pdef ?? monster?.defense,
        averageRes: getMonsterAverageResistance(monster),
        dodgeChance: monster?.dodgeChance,
        lifeStealPct: monster?.lifeStealPct ?? monster?.lifeSteal
      });
    }

    function getFloorThreatFor(floor, theme = currentFloorTheme) {
      if (typeof getMonsterIdsForTheme !== "function" || typeof getMonster !== "function" || typeof normalizeMonster !== "function" || typeof scaleMonster !== "function") {
        return null;
      }

      const floorLevel = Math.max(1, Math.floor(Number(floor) || 1));
      const themeCode = theme || currentFloorTheme;

      const ids = new Set([
        ...getMonsterIdsForTheme(themeCode, "M", floorLevel),
        ...getMonsterIdsForTheme(themeCode, "B", floorLevel)
      ]);

      const values = [];

      ids.forEach(id => {
        const base = getMonster(id);
        const normalized = normalizeMonster(base);
        if (!normalized) return;
        const variants = typeof getScaledMonsterVariantsForFloor === "function"
          ? getScaledMonsterVariantsForFloor(normalized, floorLevel)
          : [scaleMonster(normalized, floorLevel)];

        variants.forEach(scaled => {
          if (!scaled) return;
          values.push({
            id,
            name: scaled.monName || id,
            hardiness: getMonsterHardinessValue(scaled),
            weight: Math.max(1, Number(scaled.rarityWeight || 100))
          });
        });
      });

      if (!values.length) return null;
      values.sort((a, b) => a.hardiness - b.hardiness);

      const min = values[0].hardiness;
      const maxItem = values[values.length - 1];
      const max = maxItem.hardiness;
      const totalWeight = values.reduce((sum, item) => sum + item.weight, 0);
      const avg = Math.round(values.reduce((sum, item) => sum + (item.hardiness * item.weight), 0) / Math.max(1, totalWeight));

      return { min, avg, max, spikeName: maxItem.name, values };
    }

    function getCurrentFloorThreat() {
      return getFloorThreatFor(currentFloor, currentFloorTheme);
    }

    function threatTextForFloor(floor, theme = currentFloorTheme) {
      const threat = getFloorThreatFor(floor, theme);
      if (!threat) return "Threat Unknown";
      return `Threat ${formatThreatNumber(threat.min)}-${formatThreatNumber(threat.max)}`;
    }

    function getRiskLabelForThreat(playerHardiness, threat) {
      if (!threat) return "Unknown";
      if (playerHardiness >= threat.max) return "Safe";
      if (playerHardiness >= threat.avg) return "Spike Danger";
      if (playerHardiness >= threat.min) return "Risky";
      return "Dangerous";
    }

    function hardinessSummaryHtml() {

      return `<div class="hardinessBox"><b>Player Hardiness:</b> ${playerHardiness}</div>`;
    }


    function calculateAttackDamage(monster) {
      const runeBonuses = getRuneBonusTotals();
      const weaponAttack = getBaseAttackValue();
      const attack = getPlayerAttackValue();
      const physical = applyMitigation(attack, getPhysicalMitigationValue(monster, runeBonuses.piercePct));
      const enchant = getActiveSkillEffect("weaponEnchant");
      const enchantPct = enchant ? Number(enchant.elementPct || 0) : 0;
      const enchantElement = enchant ? String(enchant.element || "") : "";
      const fireBase = Math.floor(weaponAttack * (runeBonuses.fireWeaponPct + (enchantElement === "fire" ? enchantPct : 0)) / 100);
      const shockBase = Math.floor(weaponAttack * (runeBonuses.shockWeaponPct + (enchantElement === "shock" ? enchantPct : 0)) / 100);
      const iceBase = Math.floor(weaponAttack * (enchantElement === "ice" ? enchantPct : 0) / 100);
      const holyBase = Math.floor(weaponAttack * (enchantElement === "holy" ? enchantPct : 0) / 100);
      const darkBase = Math.floor(weaponAttack * (enchantElement === "dark" ? enchantPct : 0) / 100);
      const fire = applyElementMitigation(fireBase, monster, "fire");
      const shock = applyElementMitigation(shockBase, monster, "shock");
      const ice = applyElementMitigation(iceBase, monster, "ice");
      const holy = applyElementMitigation(holyBase, monster, "holy");
      const dark = applyElementMitigation(darkBase, monster, "dark");
      const monsterType = getMonsterType(monster);
      const typeBonusBase = (monsterType === "undead" ? runeBonuses.undeadBonusPct : 0) + (monsterType === "light" ? runeBonuses.lightBonusPct : 0);
      const typeBonus = Math.floor(weaponAttack * typeBonusBase / 100);
      const total = physical + fire + shock + ice + holy + dark + typeBonus;
      return { physical, fire, shock, ice, holy, dark, typeBonus, total, lifeSteal: Math.floor(total * runeBonuses.lifeStealPct / 100) };
    }


    const COMBAT_EFFECTS = {
      physical: ["slashwhite1.png", "slashwhite2.png"],
      fire: ["impactfire1.png", "impactfire2.png"],
      holy: ["impactgold1.png", "impactgold2.png"],
      ice: ["slashice1.png", "slashice2.png"]
    };

    function pickRandom(list) {
      if (!Array.isArray(list) || !list.length) return "";
      return list[Math.floor(Math.random() * list.length)];
    }

    function getAttackEffectType(damage) {
      if (damage && damage.fire > 0) return "fire";
      if (damage && damage.ice > 0) return "ice";
      if (damage && damage.holy > 0) return "holy";
      if (damage && damage.dark > 0) return "holy";
      if (damage && damage.shock > 0) return "ice";
      if (damage && damage.typeBonus > 0) return "holy";
      return "physical";
    }

      layer.src = `assets/effects/${effectFile}`;

    function handlePlayerDeath() {
      stopCombatTimer();
      setMode("roaming");
      currentEnemy = null;
      currentEnemyTileKey = null;
      currentEnemyDefeatedThisTurn = false;

      ensureFullInventoryShape();

      incrementLeaderboardStat("deaths", 1);

      const goldBefore = Math.max(0, Math.floor(Number(player.gold) || 0));
      const goldPenalty = Math.floor(goldBefore * 0.25);
      player.gold = Math.max(0, goldBefore - goldPenalty);

      if (!player.inventory.consumables) player.inventory.consumables = {};
      player.inventory.consumables.potion = Number(player.inventory.consumables.potion || 0) + 10;

      player.hp = player.maxHp;
      player.mp = player.maxMp;
      lowHpAlertPlayed = false;

      startNewFloor();
      updateBars();
      updateHud();
      saveGameState();

      setMessage(`You were defeated. Lost ${goldPenalty} gold and received 10 Potions.`);
    }

    function enemyAttack(prefix) {
      if (!currentEnemy) return;

      const dodgeChance = getPlayerDodgeValue();
      if (dodgeChance > 0 && Math.random() * 100 < dodgeChance) {
        playPlayerHit();
        showDamageNumber("Dodge");
        setMessage("You dodged the attack.");
        return;
      }

      playMonsterAttack();

      const damage = applyMitigation(currentEnemy.attack, getPlayerPdefValue());
      player.hp -= damage;
      gainUltimateCharge(Math.max(4, Math.min(14, Math.floor(damage / 3))));

      if (typeof playFemalePlayerHurtSound === "function") playFemalePlayerHurtSound(player);

      const hpPct = player.maxHp > 0 ? player.hp / player.maxHp : 1;
      if (hpPct <= 0.25 && !lowHpAlertPlayed) {
        lowHpAlertPlayed = true;
        if (typeof playSound === "function") playSound("low_hp");
      } else if (hpPct > 0.35) {
        lowHpAlertPlayed = false;
      }

      playPlayerHit();
      updateBars();

      if (player.hp <= 0) {
        handlePlayerDeath();
        return;
      }

      showDamageNumber(`-${damage}`);
    }

    function defeatEnemy() {
      const defeatedId = currentEnemy.monId;
      incrementLeaderboardStat("kills", 1);
      const defeatedName = currentEnemy.monName;
      const exp = getMonsterExpReward(currentEnemy);
      const expResult = gainExp(exp);

      if (currentEnemyTileKey) {
        clearedMonsters.add(currentEnemyTileKey);
      }

      let drops = [];
      if (typeof rollMonsterDrops === "function") {
        drops = rollMonsterDrops(defeatedId);
      }

      const foundMessages = [];

      drops.forEach(drop => {
        if (drop.type === "gold") {
          const scaledGoldBase = scaleMonsterGoldDropAmount(drop.amount, currentEnemy);
          const goldAmount = applyGoldFind(scaledGoldBase);
          player.gold += goldAmount;
          addLeaderboardGold(goldAmount);
          foundMessages.push(`${goldAmount} gold`);
        } else {
          const result = addLootItem(drop.id);
          foundMessages.push(result && result.message ? result.message : drop.name);
        }
      });

      const dropText = foundMessages.length ? foundMessages.join(", ") : "nothing";
      const levelText = expResult.levelsGained > 0
        ? ` Level up! Now level ${player.level}.`
        : "";

      gainUltimateCharge(15);
      if (typeof playMonsterDeathSound === "function") playMonsterDeathSound(currentEnemy);

      stopCombatTimer();
      currentEnemy = null;
      currentEnemyTileKey = null;
      setMode("roaming");
      updateRoomView();
      updateBars();
      setMessage(`${defeatedName} defeated. Gained ${exp} EXP.${levelText} Found ${dropText}.`);
    }

    function getRandomArmorStatusImagePath(armorItem) {
